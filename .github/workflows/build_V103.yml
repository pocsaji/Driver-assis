          assert 'targetDatabase.beginTransaction();' in legacy
          assert 'targetDatabase.setTransactionSuccessful();' in legacy
          assert 'ensureLegacyParkingDatabaseV103();' in main
          assert 'private void ensureLegacyParkingDatabaseV103()' in main
          assert 'legacy_parking_v103_error' in main
          assert 'RÉGI PARKOLÓK IMPORTÁLÁSA' in management
          assert 'RÉGI PARKOLÓK EXPORTÁLÁSA – JSON' in management
          assert 'Régi parkolók használata a POI-keresésben' in management
          assert 'database_role' in transfer and 'legacy_parking' in transfer
          assert 'KEY_INCLUDE_LEGACY_PARKING' in poi_search
          assert 'private static final String POI_SEARCH_PREFS = "poi_search_v103";' in main
          assert 'private static final String SEARCH_PREFS = "poi_search_v103";' in poi_search
          assert 'private static final String POI_SEARCH_PREFS = "poi_search_v103";' in management
          assert main.count('Régi parkolókban is keressen') >= 2
          assert 'legacyParkingToggle.setText("Régi parkolókban is keressen")' in poi_search
          assert 'getBoolean(KEY_INCLUDE_LEGACY_PARKING, false)' in main
          assert 'getBoolean(KEY_INCLUDE_LEGACY_PARKING, false)' in poi_search
          assert 'getBoolean(KEY_INCLUDE_LEGACY_PARKING, false)' in management
          assert 'private List<LocationDatabase.PoiRecord> searchLocalPoiSmart(' in main
          assert 'private List<List<LocationDatabase.PoiRecord>> searchLocalPoiSmartBatch(' in main
          assert 'legacyDatabase.searchPoiSmart(query, limit)' in main
          assert 'legacyDatabase.searchPoiSmartBatch(' in main
          assert 'if (poi != null && poi.id != 0L) ids.put(poi.id);' in main
          assert 'if (id != 0L) ids.add(id);' in main
          assert 'loadPoiByUnifiedId(id)' in main
