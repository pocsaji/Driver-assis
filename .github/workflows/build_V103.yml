          for forbidden in ['suggested_role', 'pickupQuery', 'deliveryQuery', '"role_type"', '"point_role"']:
              assert forbidden not in openai, forbidden
          scan_queue = section(service, 'private void handleRecognizedPoints(', 'private String scannedPointDisplayLabel(')
          assert 'for (ScannedPoint point : points)' in scan_queue
          assert 'scanQueueItem(' in scan_queue
          for forbidden in ['suggested_role', 'TARGET_PICKUP', 'TARGET_DELIVERY', 'TARGET_WAYPOINT']:
              assert forbidden not in scan_queue, forbidden
          
          # Aktív route-role szimbólumok sehol nincsenek. A megmaradó szavak kizárólag régi adatok migrációja,
          # fuvarlap OCR-felismerési szótára vagy keresési zajszó lehet.
          all_java = '\n'.join(p.read_text('utf-8') for p in root.rglob('*.java'))
          for forbidden in ['TARGET_PICKUP', 'TARGET_DELIVERY', 'TARGET_WAYPOINT', 'KEY_PICKUP_', 'KEY_DELIVERY_', 'KEY_WAYPOINTS', 'KEY_WAYPOINT_LABELS', 'suggested_role']:
              assert forbidden not in all_java, forbidden
          role_hits=[]
          pattern=re.compile(r'felrak|lerak|pickup|delivery|waypoint|köztes|koztes', re.I)
          for path in root.rglob('*.java'):
              for no,line in enumerate(path.read_text('utf-8').splitlines(),1):
                  if pattern.search(line): role_hits.append((path.relative_to(root).as_posix(),no,line.strip()))
          allowed_prefixes={
              'app/src/main/java/hu/pocsaji/driverassist/MainActivity.java',
              'app/src/main/java/hu/pocsaji/driverassist/OpenAiVisionClient.java',
              'app/src/main/java/hu/pocsaji/driverassist/TomTomAccessibilityService.java',
              'app/src/main/java/hu/pocsaji/driverassist/database/LocationDatabase.java',
          }
          assert all(p in allowed_prefixes for p,_,_ in role_hits), role_hits
          for p,no,line in role_hits:
              if p.endswith('MainActivity.java'):
                  assert ('LEGACY_' in line or 'root.optJSONObject("pickup")' in line or
