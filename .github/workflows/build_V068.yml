          clear_flow = section(main, 'private void clearAll()', 'private int dp(int value)')
          assert 'ExternalNavigationOverlayService.class' in clear_flow

          # V068: a Fordito V40.48-ból kizárólag a beszédfelismerési lánc került át új modulba.
