              private void importMapsLinkFromClipboard() {
                  ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
          
                  if (clipboard == null || !clipboard.hasPrimaryClip()) {
                      Toast.makeText(this,
                              "A Google Maps nem másolt helylinket. " +
                              "Nyisd meg újra a pontos helyet, majd nyomd meg a + gombot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  ClipData clip = clipboard.getPrimaryClip();
                  if (clip == null || clip.getItemCount() == 0) {
                      Toast.makeText(this,
                              "A vágólapon nincs feldolgozható Google Maps link.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  CharSequence value = clip.getItemAt(0).coerceToText(this);
                  String shared = value == null ? "" : value.toString().trim();
          
                  if (shared.isEmpty()) {
                      Toast.makeText(this,
                              "A Google Maps üres linket másolt.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  Toast.makeText(this,
                          "A Google Maps koordináta beolvasása folyamatban…",
                          Toast.LENGTH_LONG).show();
          
                  new Thread(() -> resolveSharedPlace(
                          shared, ""), "maps-clipboard-resolver").start();
              }
          
