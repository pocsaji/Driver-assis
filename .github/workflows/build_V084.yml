              private static volatile TomTomAccessibilityService connectedInstance;
          
              private static final int WEB_STAGE_IDLE = 0;
              private static final int WEB_STAGE_OPEN_MENU = 1;
              private static final int WEB_STAGE_OPEN_MY_ITEMS = 2;
              private static final int WEB_STAGE_OPEN_ROUTES = 3;
              private static final int WEB_STAGE_OPEN_IMPORT = 4;
              private static final int WEB_STAGE_PICK_FILE = 5;
              private static final int WEB_STAGE_WAIT_IMPORT = 6;
              private static final int WEB_STAGE_OPEN_ROUTE = 7;
              private static final int WEB_STAGE_SYNC = 8;
              private static final int WEB_MAX_NODES = 2200;
              private static final long WEB_TOTAL_TIMEOUT_MS = 120000L;
              private static final long WEB_STEP_TIMEOUT_MS = 15000L;

              private final Handler serviceHandler = new Handler(Looper.getMainLooper());
              private int currentWebStage = WEB_STAGE_IDLE;
              private long webStageStartedAt = 0L;
              private long webFlowStartedAt = 0L;
              private boolean webActionExecutedThisStage = false;

              public static boolean requestTomTomWebUpload() {
                  TomTomAccessibilityService instance = connectedInstance;
                  if (instance == null) return false;
                  instance.startWebUploadFlow();
                  return true;
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  connectedInstance = this;
                  AccessibilityServiceInfo info = new AccessibilityServiceInfo();
                  info.eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED |
                          AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED |
                          AccessibilityEvent.TYPE_WINDOWS_CHANGED |
                          AccessibilityEvent.TYPE_VIEW_CLICKED;
                  info.feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC;
                  info.flags = AccessibilityServiceInfo.DEFAULT |
                          AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS |
                          AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS |
                          AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS;
                  info.notificationTimeout = 250;
                  setServiceInfo(info);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  SharedPreferences prefs = getSharedPreferences(MainActivity.TOMTOM_UPLOAD_PREFS, MODE_PRIVATE);
                  if (!prefs.getBoolean(MainActivity.KEY_TOMTOM_UPLOAD_ACTIVE, false)) {
                      return;
                  }

                  if (currentWebStage == WEB_STAGE_IDLE) {
                      return;
                  }

                  checkWebUploadProgress();
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  connectedInstance = null;
                  currentWebStage = WEB_STAGE_IDLE;
                  return super.onUnbind(intent);
              }

              private void startWebUploadFlow() {
                  currentWebStage = WEB_STAGE_OPEN_MENU;
                  webStageStartedAt = SystemClock.elapsedRealtime();
                  webFlowStartedAt = SystemClock.elapsedRealtime();
                  webActionExecutedThisStage = false;
                  serviceHandler.postDelayed(this::checkWebUploadProgress, 1000L);
              }

              private void checkWebUploadProgress() {
                  SharedPreferences prefs = getSharedPreferences(MainActivity.TOMTOM_UPLOAD_PREFS, MODE_PRIVATE);
                  if (!prefs.getBoolean(MainActivity.KEY_TOMTOM_UPLOAD_ACTIVE, false)) {
                      currentWebStage = WEB_STAGE_IDLE;
                      return;
                  }

                  long now = SystemClock.elapsedRealtime();
                  if (now - webFlowStartedAt > WEB_TOTAL_TIMEOUT_MS) {
                      finishWebUpload(false, "Időtúllépés a TomTom feltöltés közben.");
                      return;
                  }

                  if (now - webStageStartedAt > WEB_STEP_TIMEOUT_MS) {
                      advanceWebStage();
                      return;
                  }

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;

                  boolean handled = processWebStageNodes(root);
                  root.recycle();

                  if (handled) {
                      webActionExecutedThisStage = true;
                      advanceWebStage();
                  }
              }

              private void advanceWebStage() {
                  currentWebStage++;
                  webStageStartedAt = SystemClock.elapsedRealtime();
                  webActionExecutedThisStage = false;
                  if (currentWebStage > WEB_STAGE_SYNC) {
                      finishWebUpload(true, "A TomTom útvonal sikeresen betöltve.");
                  }
              }

              private boolean processWebStageNodes(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  ArrayDeque<AccessibilityNodeInfo> queue = new ArrayDeque<>();
                  queue.add(node);
                  int visited = 0;

                  while (!queue.isEmpty() && visited < WEB_MAX_NODES) {
                      AccessibilityNodeInfo current = queue.poll();
                      if (current == null) continue;
                      visited++;

                      CharSequence text = current.getText();
                      CharSequence desc = current.getContentDescription();
                      String tStr = text != null ? text.toString().toLowerCase(Locale.ROOT) : "";
                      String dStr = desc != null ? desc.toString().toLowerCase(Locale.ROOT) : "";

                      if (current.isClickable() && (
                              tStr.contains("menu") || dStr.contains("menu") ||
                              tStr.contains("saját") || dStr.contains("saját") ||
                              tStr.contains("útvonal") || dStr.contains("útvonal") ||
                              tStr.contains("import") || dStr.contains("import") ||
                              tStr.contains("fájl") || dStr.contains("fájl")
                      )) {
                          current.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          current.recycle();
                          return true;
                      }

                      for (int i = 0; i < current.getChildCount(); i++) {
                          AccessibilityNodeInfo child = current.getChild(i);
                          if (child != null) {
                              queue.add(child);
                          }
                      }
                      current.recycle();
                  }
                  return false;
              }

              private void finishWebUpload(boolean success, String message) {
                  SharedPreferences prefs = getSharedPreferences(MainActivity.TOMTOM_UPLOAD_PREFS, MODE_PRIVATE);
                  prefs.edit()
                          .putBoolean(MainActivity.KEY_TOMTOM_UPLOAD_ACTIVE, false)
                          .remove(MainActivity.KEY_TOMTOM_FILE_NAME)
                          .remove(MainActivity.KEY_TOMTOM_ROUTE_NAME)
                          .remove(MainActivity.KEY_TOMTOM_UPLOAD_VERSION)
                          .remove(MainActivity.KEY_TOMTOM_UPLOAD_REQUESTED_AT)
                          .apply();

                  currentWebStage = WEB_STAGE_IDLE;
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }
          }
