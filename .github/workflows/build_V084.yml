      - name: Audit Driver Assist V084 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          root = Path('.')
          java = root / 'app/src/main/java/hu/pocsaji/driverassist'
          main = (java/'MainActivity.java').read_text('utf-8')
          service = (java/'TomTomAccessibilityService.java').read_text('utf-8')
          openai = (java/'OpenAiVisionClient.java').read_text('utf-8')
          overlay = (java/'RouteClipboardOverlayService.java').read_text('utf-8')
          external_overlay = (java/'ExternalNavigationOverlayService.java').read_text('utf-8')
          external_plan = (java/'ExternalNavigationPlan.java').read_text('utf-8')
          order = (java/'RouteOrder.java').read_text('utf-8')
          igo = (java/'IgoKmlWriter.java').read_text('utf-8')
          database = (java/'database/LocationDatabase.java').read_text('utf-8')
          poi_search = (java/'poisearch/PoiSearchActivity.java').read_text('utf-8')
          gradle = (root/'app/build.gradle.kts').read_text('utf-8')
          gradle_properties = (root/'gradle.properties').read_text('utf-8')
          settings = (root/'settings.gradle.kts').read_text('utf-8')
          strings = (root/'app/src/main/res/values/strings.xml').read_text('utf-8')
          manifest = (root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          order_test = (root/'app/src/test/java/hu/pocsaji/driverassist/RouteOrderTest.java').read_text('utf-8')
          external_test = (root/'app/src/test/java/hu/pocsaji/driverassist/ExternalNavigationPlanTest.java').read_text('utf-8')
          speech_module = (java/'speech/SpeechRecognitionModule.java').read_text('utf-8')
          speech_config = (java/'speech/SpeechRecognitionConfig.java').read_text('utf-8')
          speech_service = (java/'speech/SpeechRecognitionForegroundService.java').read_text('utf-8')
          speech_adapter = (java/'DriverAssistSpeechModule.java').read_text('utf-8')
          pcm_tools = (java/'speech/PcmAudioTools.java').read_text('utf-8')
          speech_gate = (java/'speech/SpeechAudioQualityGate.java').read_text('utf-8')
          speech_text = (java/'speech/SpeechTextProcessor.java').read_text('utf-8')
          speech_test = (root/'app/src/test/java/hu/pocsaji/driverassist/speech/SpeechRecognitionCoreTest.java').read_text('utf-8')
          
          def section(src, start, end):
              assert start in src, start
              tail=src.split(start,1)[1]
              assert end in tail, end
              return tail.split(end,1)[0]
          
          def balanced(src, path):
              stack=[]; state='code'; quote=''; i=0; pairs={')':'(',']':'[','}':'{'}
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='code':
                      if c=='/' and n=='/': state='line'; i+=2; continue
                      if c=='/' and n=='*': state='block'; i+=2; continue
                      if c in ('"', "'"): state='string'; quote=c; i+=1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}': assert stack and stack.pop()==pairs[c], (path,i,c)
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=2; continue
                  elif state=='string':
                      if c=='\\': i+=2; continue
                      if c==quote: state='code'
                  i+=1
              assert state not in ('block','string'), (path,state)
              assert not stack, (path,stack[-10:])
          
