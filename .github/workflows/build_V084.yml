          voice_test = (root/'app/src/test/java/hu/pocsaji/driverassist/voice/VoiceCommandCoreTest.java').read_text('utf-8')
          
          assert 'implements VoiceCommandHost' in main
          for required in [
              '"HANGVEZÉRLÉS"',
              'initializeVoiceCommandSystem()',
              'buildVoiceCommandState()',
              'executeVoiceAction(',
              'requestVoiceConfirmation('
          ]:
              assert required in main, required
          
          # A gombkatalógus forráskódban rögzített; nincs View-hierarchia-bejárás
          # és nincs programinduláskori gombgyűjtés.
          for required in [
              'private static final Map<String, List<ButtonSpec>> FIXED_SCREENS = fixedScreens();',
              'screens.put("MAIN"',
              'screens.put("SEARCH_MENU"',
              'screens.put("NAVIGATION_MENU"',
              'screens.put("SETTINGS_MENU"',
              'screens.put("FREIGHT_SCAN_MENU"',
              'screens.put("VOICE_RESULT_ACTIONS"',
              'MAIN_SEARCH', 'MAIN_NAVIGATION', 'MAIN_SETTINGS',
              'SEARCH_POI', 'SEARCH_TEXT', 'SEARCH_MAP', 'SEARCH_FREIGHT',
              'NAV_TOMTOM', 'NAV_IGO', 'NAV_CLIPBOARD', 'NAV_GOOGLE_MAPS', 'NAV_WAZE',
              'SETTINGS_GOOGLE_API', 'SETTINGS_OPENAI', 'SETTINGS_ACCESSIBILITY',
              'SETTINGS_IGO_FOLDER', 'SETTINGS_DATABASE',
              'FREIGHT_SCREENSHOT', 'FREIGHT_CURRENT_SCREEN',
              'RESULT_MAP', 'RESULT_DESTINATION', 'RESULT_ADD_ROUTE',
              'RESULT_NEW_WAZE', 'RESULT_NEW_IGO', 'RESULT_BACK',
              'RESULT_SELECT_'
          ]:
              assert required in voice_catalog, required
          for forbidden in [
              'getRootView(', 'findViewById(', 'ViewGroup', 'getChildAt(',
              'AccessibilityNodeInfo', 'programinduláskor'
          ]:
              assert forbidden not in voice_catalog, forbidden
          
          # Az AI egyetlen kis JSON-választ adhat: egy látható gomb azonosítója
          # vagy NONE. Nem készíthet több lépéses tervet.
          for required in [
              'public final class VoiceButtonSelectionClient',
              'Kizárólag a megadott gombazonosítók közül választhatsz.',
              'Ne tervezz következő lépést',
              'VoiceButtonCatalog.NONE',
              '.put("button_id"',
              '.put("max_output_tokens", 40)',
              'visible_button_selection'
          ]:
              assert required in voice_selector, required
          for forbidden in [
              'route_points', 'local_candidate_context', 'clarification_question',
              'SEARCH_POI', 'navigation_provider', 'actions"'
          ]:
              assert forbidden not in voice_selector, forbidden
          
          # A vezérlő minden mondatnál kizárólag az aktuális képernyő katalógusát
          # adja át, majd pontosan a kiválasztott gomb fix tervét futtatja.
          for required in [
              'VoiceButtonCatalog.buttonsFor(state)',
              'selector.select(',
              'VoiceButtonCatalog.find(buttons, selectedId)',
              'dispatcher.execute(selected.plan);',
              'MAX_UTTERANCE_MS = 18_000L',
              'CONTINUOUS_SESSION_WINDOW_MS = 120_000L',
              'AI_REQUEST_TIMEOUT_MS = 16_000L',
              'MAX_COMMANDS_PER_SESSION = 8',
              'MAX_AI_CALLS_PER_SESSION = 8',
              'MAX_UNRELATED_TURNS = 2',
              'cancelActiveAiRequest()'
          ]:
              assert required in voice_controller, required
          for forbidden in [
              'VoiceVisibleCommandResolver',
              'VoiceCommandInterpreterClient',
              'VoiceCommandAliasResolver',
              'VoiceCandidateResolver',
              'VoiceCommandContextPolicy',
              'VoiceCommandPlanPostProcessor',
              'buildVoiceCandidateContext(',
              'AI_SEARCH', 'LOCAL_PLAN', 'NEEDS_CLARIFICATION'
          ]:
              assert forbidden not in voice_controller, forbidden
          assert voice_controller.count('dispatcher.execute(selected.plan);') == 1
          
          # Egy gomb egy képernyőlépés: a főképernyős navigáció gomb csak a
          # navigációválasztót nyitja meg; a Waze/iGO csak a következő képernyőn látható.
          assert 'MAIN_NAVIGATION' in voice_catalog
          main_navigation = section(
              voice_catalog,
              'button("MAIN_NAVIGATION"',
              'button("MAIN_SETTINGS"')
          assert 'VoiceCommandAction.OPEN_NAVIGATION_MENU' in main_navigation
          assert 'VoiceCommandAction.navigation(' not in main_navigation
          navigation_screen = section(
              voice_catalog,
              'screens.put("NAVIGATION_MENU"',
              'screens.put("SETTINGS_MENU"')
          for provider in ['TOMTOM', 'IGO', 'CLIPBOARD', 'GOOGLE_MAPS', 'WAZE']:
              assert ('"' + provider + '"') in navigation_screen, provider
          
          # Minden támogatott, ténylegesen látható párbeszédablak saját statikus
          # képernyőazonosítót kap, és a host a gombok valódi funkcióját hívja.
          for required in [
              'voiceUiScreen = "NAVIGATION_MENU"',
              'voiceUiScreen = "SEARCH_MENU"',
              'voiceUiScreen = "SETTINGS_MENU"',
              'voiceUiScreen = "FREIGHT_SCAN_MENU"',
              'voiceUiScreen = "VOICE_SEARCH_RESULTS"',
              'voiceUiScreen = "VOICE_RESULT_ACTIONS"',
              'state.put("visible_buttons", visibleButtons)',
              'searchMenuDialog', 'settingsMenuDialog', 'freightScanDialog',
              'case VoiceCommandAction.OPEN_TEXT_SEARCH:',
              'case VoiceCommandAction.OPEN_FREIGHT_SCAN_MENU:',
              'case VoiceCommandAction.OPEN_GOOGLE_API_SETTINGS:',
              'case VoiceCommandAction.OPEN_OPENAI_SETTINGS:',
              'case VoiceCommandAction.OPEN_ACCESSIBILITY_SETTINGS:',
              'case VoiceCommandAction.OPEN_IGO_FOLDER_SETTINGS:',
              'case VoiceCommandAction.OPEN_DATABASE_MANAGEMENT:',
              'case VoiceCommandAction.CLOSE_CURRENT_DIALOG:',
              'case VoiceCommandAction.START_SELECTED_AS_WAZE:',
              'case VoiceCommandAction.START_SELECTED_AS_IGO:',
              'case VoiceCommandAction.RETURN_TO_SEARCH_RESULTS:',
              'case VoiceCommandAction.CONTINUE_VOICE:'
          ]:
              assert required in main, required
          
          new_actions = [
              'OPEN_TEXT_SEARCH', 'OPEN_FREIGHT_SCAN_MENU',
              'OPEN_GOOGLE_API_SETTINGS', 'OPEN_OPENAI_SETTINGS',
              'OPEN_ACCESSIBILITY_SETTINGS', 'OPEN_IGO_FOLDER_SETTINGS',
              'OPEN_DATABASE_MANAGEMENT', 'CLOSE_CURRENT_DIALOG',
              'START_SELECTED_AS_WAZE', 'START_SELECTED_AS_IGO',
              'RETURN_TO_SEARCH_RESULTS', 'CONTINUE_VOICE'
          ]
          for action in new_actions:
              assert ('public static final String ' + action) in voice_action, action
              assert ('VoiceCommandAction.' + action + '.equals(type)') in voice_validator, action
          
          # Az előző változatban visszaállított Fordító beszédfelismerési lánc változatlanul
          # megmarad; csak a leirat utáni parancsértelmezés egyszerűsödött.
          for required in [
              'DEFAULT_CAPTURE_SAMPLE_RATE = 48_000',
              'DEFAULT_VAD_SAMPLE_RATE = 16_000',
              'DEFAULT_TRANSCRIPTION_SAMPLE_RATE = 24_000',
              'DEFAULT_PRE_ROLL_MS = 240',
              'DEFAULT_SPEECH_END_SILENCE_MS = 330',
              'DEFAULT_BLOCK_WINDOW_MS = 7_000',
              'DEFAULT_BLOCK_OVERLAP_MS = 600',
              'DEFAULT_VAD_MODE = "VERY_AGGRESSIVE"',
              'DEFAULT_MODEL = "gpt-4o-mini-transcribe"'
          ]:
              assert required in speech_config, required
          for required in [
              '.sampleRates(48_000, 16_000, 24_000)',
              '.timing(240, 160, 330, 280)',
              '.blockWindow(7_000, 600)',
              '.vadMode("VERY_AGGRESSIVE")',
              '.strictNoiseGate(true)',
              '.rejectBluetoothInput(true)',
              '.requestLimit(2)'
          ]:
              assert required in speech_adapter, required
          
          for required in [
              'mainScreenCatalogContainsOnlyItsOwnFixedButtons',
              'navigationScreenCannotExposeMainScreenButtons',
              'searchAndSettingsScreensUseCompileTimeCatalogs',
              'oneSelectedButtonProducesOneFixedPlan',
              'unknownOrHiddenButtonCannotBeResolved',
              'resultRowsAreLimitedToActuallyVisibleSearchResults',
              'buttonCatalogNeverCreatesMultiScreenNavigationChain'
          ]:
              assert required in voice_test, required
          
          print('DRIVER_ASSIST_V084_VOICE_AUDIT_OK')
          print('DRIVER_ASSIST_V084_SOURCE_AUDIT_OK')
          print('ROLE_LITERAL_HITS_ALLOWED', len(role_hits))
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.13"
          ARCHIVE="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          INSTALL_ROOT="$RUNNER_TEMP/gradle-install"
          INSTALL_DIR="$INSTALL_ROOT/gradle-${GRADLE_VERSION}"
          rm -rf "$INSTALL_ROOT" "$ARCHIVE"
          mkdir -p "$INSTALL_ROOT"

          success=0
          for base_url in \
            "https://services.gradle.org/distributions" \
            "https://downloads.gradle.org/distributions"; do
            for attempt in 1 2 3 4 5; do
              echo "Gradle 8.13 letöltés: ${base_url}, kísérlet ${attempt}/5"
              if curl --fail --location --ipv4 \
                --retry 3 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --max-time 600 \
                "${base_url}/gradle-${GRADLE_VERSION}-bin.zip" \
                --output "$ARCHIVE"; then
                success=1
                break 2
              fi
              sleep $((attempt * 10))
            done
          done

          test "$success" -eq 1
          test -s "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$INSTALL_ROOT"
          test -x "$INSTALL_DIR/bin/gradle"
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/bin/gradle" --version | tee "$RUNNER_TEMP/gradle-version.txt"
          grep -F "Gradle 8.13" "$RUNNER_TEMP/gradle-version.txt"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V084 APK and AAB
        run: |
          set -euo pipefail
          echo "Memóriaállapot a fordítás előtt"
          free -h
          echo "[1/3] Release unit tesztek"
          gradle --no-daemon --console=plain --max-workers=2 \
            testReleaseUnitTest --stacktrace
          echo "[2/3] Aláírt release APK"
          gradle --no-daemon --console=plain --max-workers=2 \
            assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          echo "[3/3] Aláírt release AAB külön, egyetlen workerrel"
          gradle --no-daemon --console=plain --max-workers=1 \
            bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt, APK és AAB fordítás befejezve"
          free -h

      - name: Collect Driver Assist V084 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V084.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V084.aab
          sha256sum artifact/Driver_Assist_V084.apk artifact/Driver_Assist_V084.aab \
            | tee artifact/Driver_Assist_V084_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V084
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V084
          path: |
            artifact/Driver_Assist_V084.apk
            artifact/Driver_Assist_V084.aab
            artifact/Driver_Assist_V084_SHA256.txt
          if-no-files-found: error
          retention-days: 14
