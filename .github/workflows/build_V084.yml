          package hu.pocsaji.tomtomkiszolgalo;

          import java.util.ArrayList;
          import java.util.List;

          final class TomTomGpxWriter {
              private TomTomGpxWriter() {
              }

              static String build(
                      String creator,
                      String routeName,
                      List<String> coordinates) {
                  if (coordinates == null || coordinates.size() < 2) {
                      throw new IllegalArgumentException(
                              "A GPX-útvonalhoz legalább két koordináta szükséges.");
                  }

                  ArrayList<Point> points = new ArrayList<>();
                  for (String coordinate : coordinates) {
                      points.add(parsePoint(coordinate));
                  }

                  StringBuilder xml =
                          new StringBuilder(512 + points.size() * 120);
                  xml.append("<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n");
                  xml.append("<gpx xmlns=\"http://www.topografix.com/GPX/1/1\" ")
                          .append("xmlns:tt=\"TT\" version=\"1.1\" creator=\"")
                          .append(escapeXml(creator))
                          .append("\">\n");
                  xml.append("    <rte>\n");
                  xml.append("        <name>")
                          .append(escapeXml(routeName))
                          .append("</name>\n");

                  for (Point point : points) {
                      xml.append("        <rtept lat=\"")
                              .append(point.latitude)
                              .append("\" lon=\"")
                              .append(point.longitude)
                              .append("\">\n")
                              .append("            <type>TT_HARD</type>\n")
                              .append("        </rtept>\n");
                  }

                  xml.append("    </rte>\n");
                  xml.append("</gpx>\n");
                  return xml.toString();
              }

              private static Point parsePoint(String value) {
                  if (value == null) {
                      throw new IllegalArgumentException(
                              "Hiányzó koordináta.");
                  }

                  String[] parts = value.trim().split("\\s+");
                  if (parts.length != 2) {
                      throw new IllegalArgumentException(
                              "Hibás koordináta: " + value);
                  }

                  double latitude;
                  double longitude;
                  try {
                      latitude = Double.parseDouble(parts[0]);
                      longitude = Double.parseDouble(parts[1]);
                  } catch (NumberFormatException error) {
                      throw new IllegalArgumentException(
                              "Hibás koordináta: " + value,
                              error);
                  }

                  if (latitude < -90.0 || latitude > 90.0 ||
                          longitude < -180.0 || longitude > 180.0) {
                      throw new IllegalArgumentException(
                              "Határértéken kívüli koordináta: " +
                                      value);
                  }

                  return new Point(parts[0], parts[1]);
              }

              private static String escapeXml(String value) {
                  if (value == null) return "";
                  return value
                          .replace("&", "&amp;")
                          .replace("<", "&lt;")
                          .replace(">", "&gt;")
                          .replace("\"", "&quot;")
                          .replace("'", "&apos;");
              }

              private static final class Point {
                  final String latitude;
                  final String longitude;

                  Point(String latitude, String longitude) {
                      this.latitude = latitude;
                      this.longitude = longitude;
                  }
              }
          }
          EOF

