              private void openVerifiedRoute() {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
          
                  String pickupQuery = cleanQuery(
                          preferences.getString(KEY_PICKUP_QUERY, ""));
                  String deliveryQuery = cleanQuery(
                          preferences.getString(KEY_DELIVERY_QUERY, ""));
                  String pickup = normalizeCoordinate(
                          preferences.getString(KEY_PICKUP_COORD, ""));
                  String delivery = normalizeCoordinate(
                          preferences.getString(KEY_DELIVERY_COORD, ""));
                  List<String> waypoints = cleanLines(
                          preferences.getString(KEY_WAYPOINTS, ""));
          
                  if (!pickupQuery.isBlank() && pickup == null) {
                      Toast.makeText(this,
                              "A megadott felrakóhoz még nincs ellenőrzött koordináta.",
                              Toast.LENGTH_LONG).show();
                      openNextPointForReview();
                      return;
                  }
          
                  if (!deliveryQuery.isBlank() && delivery == null) {
                      Toast.makeText(this,
                              "A megadott lerakóhoz még nincs ellenőrzött koordináta.",
                              Toast.LENGTH_LONG).show();
                      openNextPointForReview();
                      return;
                  }
          
                  if (!allCoordinates(waypoints)) {
                      Toast.makeText(this,
                              "A köztes pontok között hibás koordináta maradt.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  ArrayList<String> targets = new ArrayList<>();
          
                  if (delivery != null) {
                      if (pickup != null) targets.add(pickup);
                      for (String waypoint : waypoints) {
                          targets.add(normalizeCoordinate(waypoint));
                      }
                      targets.add(delivery);
                  } else if (pickup != null) {
                      for (String waypoint : waypoints) {
                          targets.add(normalizeCoordinate(waypoint));
                      }
                      targets.add(pickup);
                  } else {
                      for (String waypoint : waypoints) {
                          targets.add(normalizeCoordinate(waypoint));
                      }
                  }
          
                  targets.removeIf(value -> value == null || value.isBlank());
                  if (targets.isEmpty()) {
                      Toast.makeText(this,
                              "Adj meg legalább egy felrakót, lerakót vagy köztes pontot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  resolveCurrentLocationAndSave(targets);
              }
          
              private void resolveCurrentLocationAndSave(
                      ArrayList<String> targets) {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) !=
                                  PackageManager.PERMISSION_GRANTED &&
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) !=
                                  PackageManager.PERMISSION_GRANTED) {
                      pendingRouteTargets = new ArrayList<>(targets);
                      requestPermissions(
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              REQUEST_ROUTE_LOCATION);
                      return;
                  }
          
                  LocationManager manager =
                          (LocationManager) getSystemService(LOCATION_SERVICE);
                  if (manager == null) {
                      Toast.makeText(this,
                              "Az aktuális hely nem kérdezhető le.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  Location lastKnown = bestLastKnownLocation(manager);
                  if (lastKnown != null &&
                          System.currentTimeMillis() - lastKnown.getTime() <= 180000L) {
                      saveRouteFromCurrentLocation(targets, lastKnown);
                      return;
                  }
          
                  String provider = null;
                  boolean fineLocation =
                          checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION) ==
                                  PackageManager.PERMISSION_GRANTED;
                  try {
                      if (fineLocation &&
                              manager.isProviderEnabled(
                                      LocationManager.GPS_PROVIDER)) {
                          provider = LocationManager.GPS_PROVIDER;
                      } else if (manager.isProviderEnabled(
                              LocationManager.NETWORK_PROVIDER)) {
                          provider = LocationManager.NETWORK_PROVIDER;
                      } else if (manager.isProviderEnabled(
                              LocationManager.PASSIVE_PROVIDER)) {
                          provider = LocationManager.PASSIVE_PROVIDER;
                      }
                  } catch (RuntimeException ignored) {
                  }
          
                  if (provider == null) {
                      if (lastKnown != null) {
                          saveRouteFromCurrentLocation(targets, lastKnown);
                      } else {
                          Toast.makeText(this,
                                  "Kapcsold be a helymeghatározást az indulási ponthoz.",
                                  Toast.LENGTH_LONG).show();
                      }
                      return;
                  }
          
                  stopPendingLocationRequest();
                  final ArrayList<String> routeTargets =
                          new ArrayList<>(targets);
                  final Location fallback = lastKnown;
                  pendingLocationListener = new LocationListener() {
                      @Override
                      public void onLocationChanged(Location location) {
                          stopPendingLocationRequest();
                          if (location != null) {
                              saveRouteFromCurrentLocation(
                                      routeTargets, location);
                          } else if (fallback != null) {
                              saveRouteFromCurrentLocation(
                                      routeTargets, fallback);
                          } else {
                              Toast.makeText(
                                      MainActivity.this,
                                      "Az aktuális indulási hely nem érkezett meg.",
                                      Toast.LENGTH_LONG).show();
                          }
                      }
                  };
          
                  try {
                      manager.requestSingleUpdate(
                              provider,
                              pendingLocationListener,
                              Looper.getMainLooper());
                      handler.postDelayed(() -> {
                          if (pendingLocationListener == null) return;
                          stopPendingLocationRequest();
                          if (fallback != null) {
                              saveRouteFromCurrentLocation(routeTargets, fallback);
                          } else {
                              Toast.makeText(this,
                                      "Az aktuális indulási hely lekérése időtúllépésbe futott.",
                                      Toast.LENGTH_LONG).show();
                          }
                      }, 8000L);
                  } catch (SecurityException | IllegalArgumentException error) {
                      stopPendingLocationRequest();
                      if (fallback != null) {
                          saveRouteFromCurrentLocation(routeTargets, fallback);
                      } else {
                          Toast.makeText(this,
                                  "Az aktuális hely nem kérdezhető le.",
                                  Toast.LENGTH_LONG).show();
                      }
                  }
              }
          
              private Location bestLastKnownLocation(
                      LocationManager manager) {
                  Location best = null;
                  String[] providers = {
                          LocationManager.GPS_PROVIDER,
                          LocationManager.NETWORK_PROVIDER,
                          LocationManager.PASSIVE_PROVIDER
                  };
                  for (String provider : providers) {
                      try {
                          Location candidate =
                                  manager.getLastKnownLocation(provider);
                          if (candidate != null &&
                                  (best == null ||
                                   candidate.getTime() > best.getTime())) {
                              best = candidate;
                          }
                      } catch (SecurityException | IllegalArgumentException ignored) {
                      }
                  }
                  return best;
              }
          
              private void stopPendingLocationRequest() {
                  if (pendingLocationListener == null) return;
                  LocationManager manager =
                          (LocationManager) getSystemService(LOCATION_SERVICE);
                  if (manager != null) {
                      try {
                          manager.removeUpdates(pendingLocationListener);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  pendingLocationListener = null;
              }
          
              private void saveRouteFromCurrentLocation(
                      ArrayList<String> targets,
                      Location location) {
                  if (location == null) return;
                  ArrayList<String> points = new ArrayList<>();
                  points.add(
                          plain(location.getLatitude()) + " " +
                          plain(location.getLongitude()));
                  points.addAll(targets);
                  saveTomTomGpxToDownloads(points);
              }
          
              private void saveTomTomGpxToDownloads(List<String> points) {
                  String timestamp = new SimpleDateFormat(
                          "yyyyMMdd_HHmmss", Locale.ROOT).format(new Date());
                  String routeName = "Driver Assist " + timestamp;
                  String fileName = "TT_" + timestamp + ".gpx";
                  Uri outputUri = null;
          
                  try {
                      String gpx = TomTomGpxWriter.build(
                              "TomTom Kiszolgáló " + VERSION,
                              routeName,
                              points);
          
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/gpx+xml");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
          
                      outputUri = getContentResolver().insert(
                              MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                              values);
                      if (outputUri == null) {
                          throw new IOException("A Download mappa nem nyitható meg.");
                      }
          
                      try (OutputStream output = getContentResolver()
                              .openOutputStream(outputUri, "w")) {
                          if (output == null) {
                              throw new IOException("A GPX fájl nem hozható létre.");
                          }
                          output.write(gpx.getBytes(StandardCharsets.UTF_8));
                          output.flush();
                      }
          
                      ContentValues completed = new ContentValues();
                      completed.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      getContentResolver().update(outputUri, completed, null, null);
          
                      preferencesForTomTomUpload(fileName, routeName);
          
                      Intent browser = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(TOMTOM_PLAN_URL));
                      browser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_ACTIVITY_CLEAR_TOP |
                              Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      if (getPackageManager().getLaunchIntentForPackage(CHROME_PACKAGE) != null) {
                          browser.setPackage(CHROME_PACKAGE);
                      }
                      startActivity(browser);
                      if (!TomTomAccessibilityService.requestTomTomWebUpload()) {
                          getSharedPreferences(TOMTOM_UPLOAD_PREFS, MODE_PRIVATE).edit()
                                  .putBoolean(KEY_TOMTOM_UPLOAD_ACTIVE, false)
                                  .remove(KEY_TOMTOM_FILE_NAME)
                                  .remove(KEY_TOMTOM_ROUTE_NAME)
                                  .remove(KEY_TOMTOM_UPLOAD_VERSION)
                                  .remove(KEY_TOMTOM_UPLOAD_REQUESTED_AT)
                                  .apply();
                          Toast.makeText(this,
                                  "Hiba: a TomTom kisegítő szolgáltatás nem fut, ezért az automatikus feltöltés nem indult el.",
                                  Toast.LENGTH_LONG).show();
                          return;
                      }

                      Toast.makeText(this,
                              "A GPX elkészült. A TomTom feltöltés elindult.",
                              Toast.LENGTH_LONG).show();
                  } catch (IOException | IllegalArgumentException |
                           SecurityException | ActivityNotFoundException error) {
                      getSharedPreferences(TOMTOM_UPLOAD_PREFS, MODE_PRIVATE).edit()
                              .putBoolean(KEY_TOMTOM_UPLOAD_ACTIVE, false)
                              .remove(KEY_TOMTOM_FILE_NAME)
                              .remove(KEY_TOMTOM_ROUTE_NAME)
                              .remove(KEY_TOMTOM_UPLOAD_VERSION)
                              .remove(KEY_TOMTOM_UPLOAD_REQUESTED_AT)
                              .apply();
                      if (outputUri != null) {
                          try {
                              getContentResolver().delete(outputUri, null, null);
                          } catch (RuntimeException ignored) {
                          }
                      }
                      Toast.makeText(this,
                              "A TomTom feltöltés nem indítható: " +
                                      cleanQuery(error.getMessage()),
                              Toast.LENGTH_LONG).show();
                  }
              }
          
              private void preferencesForTomTomUpload(
                      String fileName,
                      String routeName) {
                  getSharedPreferences(TOMTOM_UPLOAD_PREFS, MODE_PRIVATE).edit()
                          .putBoolean(KEY_TOMTOM_UPLOAD_ACTIVE, true)
                          .putString(KEY_TOMTOM_FILE_NAME, fileName)
                          .putString(KEY_TOMTOM_ROUTE_NAME, routeName)
                          .putString(KEY_TOMTOM_UPLOAD_VERSION, VERSION)
                          .putLong(KEY_TOMTOM_UPLOAD_REQUESTED_AT,
                                  System.currentTimeMillis())
                          .apply();
              }
          
              private void handleIncomingShare(Intent intent) {
                  if (intent == null ||
                          !Intent.ACTION_SEND.equals(intent.getAction()) ||
                          !"text/plain".equals(intent.getType())) {
                      return;
                  }
          
                  String shared = intent.getStringExtra(Intent.EXTRA_TEXT);
                  String subject = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                  intent.setAction(null);
          
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String target = preferences.getString(KEY_PENDING_TARGET, "");
                  if (!TARGET_PICKUP.equals(target) &&
                          !TARGET_DELIVERY.equals(target) &&
                          !TARGET_WAYPOINT.equals(target)) {
                      Toast.makeText(this,
                              "Nincs kijelölt felrakó, lerakó vagy köztes pont. " +
                              "Indítsd a címellenőrzést a programból.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  if (shared == null || shared.isBlank()) {
                      Toast.makeText(this,
                              "A Google Maps nem adott át használható helylinket.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
          
                  Toast.makeText(this,
                          "A Google Maps helylink ellenőrzése folyamatban…",
                          Toast.LENGTH_LONG).show();
          
                  final String sharedText = shared;
                  final String sharedSubject = subject == null ? "" : subject;
                  new Thread(() -> resolveSharedPlace(
                          sharedText, sharedSubject), "maps-link-resolver").start();
              }
          
              private void resolveSharedPlace(
                      String sharedText,
                      String sharedSubject) {
                  try {
                      String directCoordinate = coordinateFromAnyText(sharedText);
                      String finalUrl = "";
                      String body = "";
          
                      if (directCoordinate == null) {
                          List<String> urls = extractUrls(sharedText);
                          for (String rawUrl : urls) {
                              ResolvedUrl resolved = resolveUrl(rawUrl);
                              if (resolved == null) continue;
          
                              finalUrl = resolved.finalUrl;
                              body = resolved.body;
          
                              directCoordinate = coordinateFromAnyText(finalUrl);
                              if (directCoordinate == null) {
                                  directCoordinate = coordinateFromAnyText(body);
                              }
                              if (directCoordinate != null) break;
                          }
                      }
          
                      if (directCoordinate == null) {
                          runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  "A megosztott Google Maps linkből nem sikerült biztos koordinátát kiolvasni. " +
                                  "Ne mentsd el a pontot: válassz másik találatot, majd oszd meg újra.",
                                  Toast.LENGTH_LONG).show());
                          return;
                      }
          
                      SharedPlace place = buildSharedPlace(
                              sharedText, sharedSubject, finalUrl, directCoordinate);
          
                      PlaceValidation validation = validateSelectedPlace(place);
                      if (validation.reject) {
                          runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  validation.message +
                                          "\nA másik országban lévő koordinátát NEM mentettem.",
                                  Toast.LENGTH_LONG).show());
                          return;
                      }
          
                      saveResolvedPlace(place, validation.warning);
          
                      runOnUiThread(() -> {
                          loadState();
                          Toast.makeText(
                                  MainActivity.this,
                                  (validation.warning.isBlank()
                                          ? "Ellenőrzött Google Maps hely mentve:\n"
                                          : "⚠ BIZONYTALAN Google Maps hely mentve. Kézi ellenőrzés szükséges:\n") +
                                  place.label + "\n" + place.coordinate,
                                  Toast.LENGTH_LONG).show();
                      });
                  } catch (Exception error) {
                      runOnUiThread(() -> Toast.makeText(
                              MainActivity.this,
                              "A Google Maps helylink feldolgozása sikertelen: " +
                              cleanQuery(error.getMessage()),
                              Toast.LENGTH_LONG).show());
                  }
              }
          
              private void saveResolvedPlace(SharedPlace place, String warning) {
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String target = preferences.getString(KEY_PENDING_TARGET, "");
                  int index = preferences.getInt(KEY_PENDING_INDEX, -1);
          
                  SharedPreferences.Editor editor = preferences.edit();
          
                  if (TARGET_PICKUP.equals(target)) {
                      editor.putString(KEY_PICKUP_QUERY, place.query)
                              .putString(KEY_PICKUP_COORD, place.coordinate)
                              .putString(KEY_PICKUP_LABEL, place.label)
                              .putString(KEY_PICKUP_WARNING, warning == null ? "" : warning);
                  } else if (TARGET_DELIVERY.equals(target)) {
                      editor.putString(KEY_DELIVERY_QUERY, place.query)
                              .putString(KEY_DELIVERY_COORD, place.coordinate)
                              .putString(KEY_DELIVERY_LABEL, place.label)
                              .putString(KEY_DELIVERY_WARNING, warning == null ? "" : warning);
                  } else if (TARGET_WAYPOINT.equals(target)) {
                      List<String> coordinates = cleanLines(
                              preferences.getString(KEY_WAYPOINTS, ""));
                      List<String> labels = cleanLines(
                              preferences.getString(KEY_WAYPOINT_LABELS, ""));
          
                      while (labels.size() < coordinates.size()) {
                          labels.add("Köztes " + (labels.size() + 1));
                      }
          
                      if (index >= 0 && index < coordinates.size()) {
                          coordinates.set(index, place.coordinate);
                          labels.set(index, place.label);
                      } else {
                          coordinates.add(place.coordinate);
                          labels.add(place.label);
                      }
          
                      editor.putString(KEY_WAYPOINTS,
                                      String.join("\n", coordinates))
                              .putString(KEY_WAYPOINT_LABELS,
                                      String.join("\n", labels));
                  }
          
                  editor.remove(KEY_PENDING_TARGET)
                          .remove(KEY_PENDING_INDEX)
                          .remove(KEY_PENDING_QUERY)
                          .apply();
              }
          
              private SharedPlace buildSharedPlace(
                      String sharedText,
                      String subject,
                      String finalUrl,
                      String coordinate) {
                  List<String> contentLines = new ArrayList<>();
                  for (String line : sharedText.split("\\r?\\n")) {
                      String clean = cleanQuery(line);
                      if (clean.isBlank() || URL_PATTERN.matcher(clean).find()) continue;
                      contentLines.add(clean);
                  }
          
                  String name = cleanQuery(subject);
                  if (name.isBlank() && !contentLines.isEmpty()) {
                      name = contentLines.get(0);
                  }
          
                  String address = "";
                  for (String line : contentLines) {
                      if (!line.equals(name) && looksLikeAddress(line)) {
                          address = line;
                          break;
                      }
                  }
                  if (address.isBlank() && contentLines.size() > 1) {
                      address = contentLines.get(1);
                  }
          
                  String city = extractCity(address);
                  if (city.isBlank()) {
                      city = extractCity(sharedText);
                  }
          
                  String label;
                  if (!name.isBlank() && !city.isBlank() &&
                          !normalized(name).contains(normalized(city))) {
                      label = name + " – " + city;
                  } else if (!name.isBlank()) {
                      label = name;
                  } else if (!city.isBlank()) {
                      label = city;
                  } else {
                      label = "Google Maps hely";
                  }
          
                  String query = !name.isBlank() && !address.isBlank()
                          ? name + ", " + address
                          : (!address.isBlank()
                                  ? address
                                  : (!name.isBlank() ? name : finalUrl));
          
                  String countrySource = address.isBlank() ? sharedText : address;
                  return new SharedPlace(
                          cleanQuery(label),
                          cleanQuery(query),
                          coordinate,
                          city,
                          extractPostalCode(countrySource),
                          extractCountryCode(countrySource));
              }
          
              private PlaceValidation validateSelectedPlace(SharedPlace place) {
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String expected = preferences.getString(KEY_PENDING_QUERY, "");
                  return validateSelectedPlace(place, expected);
              }
          
              private PlaceValidation validateSelectedPlace(
                      SharedPlace place,
                      String expected) {
                  if (expected == null || expected.isBlank()) {
                      return PlaceValidation.accept();
                  }
          
                  String expectedCountry = extractCountryCode(expected);
                  String selectedCountry = place.countryCode;
                  if (!expectedCountry.isBlank() &&
                          !selectedCountry.isBlank() &&
                          !expectedCountry.equals(selectedCountry)) {
                      return PlaceValidation.reject(
                              "ORSZÁGELTÉRÉS!\n" +
                              "Várt ország: " + expectedCountry +
                              "\nTalált ország: " + selectedCountry);
                  }
          
                  String expectedPostal = extractPostalCode(expected);
                  String expectedCity = extractCity(expected);
          
                  boolean postalKnown = !expectedPostal.isBlank() &&
                          !place.postalCode.isBlank();
                  boolean cityKnown = !expectedCity.isBlank() &&
                          !place.city.isBlank();
          
                  boolean postalMatches = !postalKnown ||
                          postalCodesCompatible(expectedPostal, place.postalCode);
                  boolean cityMatches = !cityKnown ||
                          sameCity(expectedCity, place.city);
          
                  if (postalKnown && cityKnown && !postalMatches && !cityMatches) {
                      return PlaceValidation.warning(
                              "A város ÉS az irányítószám is eltér. " +
                              "Várt: " + expectedPostal + " " + expectedCity +
                              "; talált: " + place.postalCode + " " + place.city +
                              ". A koordináta nem 100%-os.");
                  }
          
                  return PlaceValidation.accept();
              }
          
              private boolean postalCodesCompatible(String expected, String selected) {
                  String left = cleanQuery(expected).toUpperCase(Locale.ROOT);
                  String right = cleanQuery(selected).toUpperCase(Locale.ROOT);
                  if (left.equals(right)) return true;
          
                  String leftDigits = left.replaceAll("\\D", "");
                  String rightDigits = right.replaceAll("\\D", "");
                  if (leftDigits.isBlank() || rightDigits.isBlank() ||
                          leftDigits.length() != rightDigits.length()) {
                      return false;
                  }
          
                  try {
                      long difference = Math.abs(
                              Long.parseLong(leftDigits) - Long.parseLong(rightDigits));
                      return difference <= 10L;
                  } catch (NumberFormatException ignored) {
                      return false;
                  }
              }
          
              private boolean sameCity(String expected, String selected) {
                  String left = normalized(expected);
                  String right = normalized(selected);
                  return left.equals(right) ||
                          left.startsWith(right + " ") ||
                          right.startsWith(left + " ") ||
                          left.contains(right) ||
                          right.contains(left);
              }
          
              private String extractPostalCode(String value) {
                  if (value == null) return "";
                  Matcher matcher = POSTAL_CODE_PATTERN.matcher(
                          cleanAddressQuery(value));
                  return matcher.find() ? cleanQuery(matcher.group(1)) : "";
              }
          
              private String extractCountryCode(String value) {
                  String clean = cleanQuery(value);
                  if (clean.isBlank()) return "";
          
                  String normalizedValue = normalized(clean)
                          .toUpperCase(Locale.ROOT)
                          .replaceAll("[^A-Z ]", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
                  if (normalizedValue.isBlank()) return "";
          
                  String[] words = normalizedValue.split(" ");
                  for (int size = Math.min(3, words.length); size >= 1; size--) {
                      String suffix = String.join(" ",
                              java.util.Arrays.copyOfRange(
                                      words, words.length - size, words.length));
                      String code = countryCodeFromToken(suffix);
                      if (!code.isBlank()) return code;
                  }
                  return "";
              }
          
              private String countryCodeFromToken(String value) {
                  String token = normalized(value).toUpperCase(Locale.ROOT);
                  switch (token) {
                      case "FR": case "FRANCE": case "FRANCIAORSZAG": return "FR";
                      case "CH": case "SUISSE": case "SCHWEIZ": case "SWITZERLAND": case "SVAJC": return "CH";
                      case "BE": case "BELGIQUE": case "BELGIUM": return "BE";
                      case "DE": case "DEUTSCHLAND": case "GERMANY": case "NEMETORSZAG": return "DE";
                      case "NL": case "NEDERLAND": case "NETHERLANDS": case "HOLLANDIA": return "NL";
                      case "LU": case "LUXEMBOURG": return "LU";
                      case "AT": case "AUSTRIA": case "OSTERREICH": case "AUSZTRIA": return "AT";
                      case "IT": case "ITALIA": case "ITALY": case "OLASZORSZAG": return "IT";
                      case "ES": case "ESPANA": case "SPAIN": case "SPANYOLORSZAG": return "ES";
                      case "HU": case "HUNGARY": case "MAGYARORSZAG": return "HU";
                      case "PL": case "POLAND": case "POLSKA": case "LENGYELORSZAG": return "PL";
                      case "CZ": case "CZECHIA": case "CESKO": case "CSEHORSZAG": return "CZ";
                      case "SK": case "SLOVAKIA": case "SLOVENSKO": case "SZLOVAKIA": return "SK";
                      case "SI": case "SLOVENIA": case "SLOVENIJA": return "SI";
                      case "HR": case "CROATIA": case "HRVATSKA": return "HR";
                      case "RO": case "ROMANIA": return "RO";
                      case "BG": case "BULGARIA": return "BG";
                      case "DK": case "DENMARK": case "DANIA": return "DK";
                      case "SE": case "SWEDEN": case "SVERIGE": return "SE";
                      case "NO": case "NORWAY": case "NORGE": return "NO";
                      case "FI": case "FINLAND": case "SUOMI": return "FI";
                      case "GB": case "UK": case "UNITED KINGDOM": return "GB";
                      default: return "";
                  }
              }
          
              private boolean looksLikeAddress(String value) {
                  if (value == null) return false;
                  String clean = cleanAddressQuery(value);
                  return POSTAL_CODE_PATTERN.matcher(clean).find() ||
                          clean.matches(".*\\d.*") ||
                          clean.contains(",") ||
                          clean.toLowerCase(Locale.ROOT).contains("straße") ||
                          clean.toLowerCase(Locale.ROOT).contains("strasse") ||
                          clean.toLowerCase(Locale.ROOT).contains("street") ||
                          clean.toLowerCase(Locale.ROOT).contains("route") ||
                          clean.toLowerCase(Locale.ROOT).contains("rue");
              }
          
              private String extractCity(String value) {
                  String clean = cleanAddressQuery(value);
                  if (clean.isBlank()) return "";
          
                  Matcher postal = POSTAL_CODE_PATTERN.matcher(clean);
                  if (!postal.find()) return "";
          
                  String tail = cleanQuery(clean.substring(postal.end()))
                          .replaceFirst("^[,;\\-–—\\s]+", "");
                  if (tail.isBlank()) return "";
          
                  ArrayList<String> cityParts = new ArrayList<>();
                  for (String piece : tail.split("[,;]")) {
                      String part = cleanQuery(piece)
                              .replaceAll("^[\\-–—\\s]+|[\\-–—\\s]+$", "");
                      if (part.isBlank()) continue;
          
                      String withoutCountry = removeCountrySuffix(part);
                      if (!withoutCountry.equals(part)) {
                          if (!withoutCountry.isBlank()) cityParts.add(withoutCountry);
                          break;
                      }
          
                      if (isCountryToken(part) ||
                              INLINE_METADATA_PATTERN.matcher("," + part).find()) {
                          break;
                      }
          
                      cityParts.add(part);
                      if (cityParts.size() >= 3) break;
                  }
          
                  return cleanQuery(String.join(" ", cityParts));
              }
          
              private boolean isCountryToken(String value) {
                  return COUNTRY_TOKEN_PATTERN.matcher(
                          normalized(value).toUpperCase(Locale.ROOT)).matches();
              }
          
              private String removeCountrySuffix(String value) {
                  String clean = cleanQuery(value);
                  String[] words = clean.split("\\s+");
                  for (int start = 0; start < words.length; start++) {
                      String suffix = String.join(" ",
                              java.util.Arrays.copyOfRange(words, start, words.length));
                      if (isCountryToken(suffix)) {
                          return cleanQuery(String.join(" ",
                                  java.util.Arrays.copyOfRange(words, 0, start)));
                      }
                  }
                  return clean;
              }
          
              private String cleanAddressQuery(String value) {
                  String clean = cleanQuery(value);
                  if (clean.isBlank()) return "";
          
                  Matcher metadata = INLINE_METADATA_PATTERN.matcher(clean);
                  if (metadata.find()) {
                      clean = cleanQuery(clean.substring(0, metadata.start()));
                  }
          
                  return clean.replaceAll("\\s+,", ",")
                          .replaceAll(",\\s*,+", ", ")
                          .replaceAll("[,;\\s]+$", "")
                          .trim();
              }
          
              private List<String> extractUrls(String value) {
                  ArrayList<String> urls = new ArrayList<>();
                  Matcher matcher = URL_PATTERN.matcher(value == null ? "" : value);
                  while (matcher.find()) {
                      String url = matcher.group();
                      while (url.endsWith(".") || url.endsWith(",") ||
                              url.endsWith(")") || url.endsWith("]")) {
                          url = url.substring(0, url.length() - 1);
                      }
                      urls.add(url);
                  }
                  return urls;
              }
          
              private ResolvedUrl resolveUrl(String rawUrl) throws IOException {
                  URL current = new URL(rawUrl);
                  String body = "";
          
                  for (int attempt = 0; attempt < 10; attempt++) {
                      HttpURLConnection connection =
                              (HttpURLConnection) current.openConnection();
                      connection.setInstanceFollowRedirects(false);
                      connection.setConnectTimeout(10000);
                      connection.setReadTimeout(10000);
                      connection.setRequestProperty(
                              "User-Agent",
                              "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 " +
                              "(KHTML, like Gecko) Chrome/138.0 Mobile Safari/537.36");
                      connection.setRequestProperty("Accept-Language", "hu-HU,hu;q=0.9,en;q=0.7");
          
                      int status = connection.getResponseCode();
                      if (status == 301 || status == 302 || status == 303 ||
                              status == 307 || status == 308) {
                          String location = connection.getHeaderField("Location");
                          connection.disconnect();
                          if (location == null || location.isBlank()) break;
                          current = new URL(current, location);
                          continue;
                      }
          
                      InputStream stream = status >= 400
                              ? connection.getErrorStream()
                              : connection.getInputStream();
                      body = readLimited(stream, 524288);
                      String finalUrl = current.toString();
                      connection.disconnect();
                      return new ResolvedUrl(finalUrl, body);
                  }
          
                  return new ResolvedUrl(current.toString(), body);
              }
          
              private String readLimited(InputStream stream, int maxChars)
                      throws IOException {
                  if (stream == null) return "";
                  StringBuilder result = new StringBuilder();
                  try (BufferedReader reader = new BufferedReader(
                          new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                      char[] buffer = new char[4096];
                      int count;
                      while ((count = reader.read(buffer)) >= 0 &&
                              result.length() < maxChars) {
                          int allowed = Math.min(count, maxChars - result.length());
                          result.append(buffer, 0, allowed);
                      }
                  }
                  return result.toString()
                          .replace("\\u003d", "=")
                          .replace("\\u0026", "&")
                          .replace("\\/", "/");
              }
          
              private String coordinateFromAnyText(String value) {
                  if (value == null || value.isBlank()) return null;
                  String decoded = Uri.decode(value.replace('−', '-'));
          
                  Matcher dataMatcher = DATA_COORDINATE_PATTERN.matcher(decoded);
                  if (dataMatcher.find()) {
                      return normalizeCoordinate(
                              dataMatcher.group(1) + " " + dataMatcher.group(2));
                  }
          
                  Matcher queryMatcher = QUERY_COORDINATE_PATTERN.matcher(decoded);
                  if (queryMatcher.find()) {
                      return normalizeCoordinate(
                              queryMatcher.group(1) + " " + queryMatcher.group(2));
                  }
          
                  Matcher atMatcher = AT_COORDINATE_PATTERN.matcher(decoded);
                  if (atMatcher.find()) {
                      return normalizeCoordinate(
                              atMatcher.group(1) + " " + atMatcher.group(2));
                  }
          
                  for (String line : decoded.split("\\r?\\n")) {
                      String coordinate = normalizeCoordinate(cleanQuery(line));
                      if (coordinate != null) return coordinate;
                  }
                  return null;
              }
          
              private boolean allCoordinates(List<String> values) {
                  for (String value : values) {
                      if (normalizeCoordinate(value) == null) return false;
                  }
                  return true;
              }
          
              private String normalizeCoordinate(String value) {
                  if (value == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          value.replace('−', '-'));
                  if (!matcher.matches()) return null;
          
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }
          
              private String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }
          
              private List<String> cleanLines(String source) {
                  ArrayList<String> result = new ArrayList<>();
                  if (source == null || source.isBlank()) return result;
                  for (String line : source.split("\\r?\\n")) {
                      String clean = cleanQuery(line);
                      if (!clean.isBlank()) result.add(clean);
                  }
                  return result;
              }
          
              private String summarizeQuery(String query) {
                  String clean = cleanAddressQuery(query);
                  if (clean.isBlank()) return "";
                  String company = clean.split(",")[0].trim();
                  String city = extractCity(clean);
                  if (!company.isBlank() && !city.isBlank() &&
                          !normalized(company).contains(normalized(city))) {
                      return company + " – " + city;
                  }
                  return company.isBlank() ? clean : company;
              }
          
              private String safeLabel(
                      String label,
                      String query,
                      String fallback) {
                  String cleanLabel = cleanQuery(label);
                  if (!cleanLabel.isBlank()) return cleanLabel;
                  String summarized = summarizeQuery(query);
                  return summarized.isBlank() ? fallback : summarized;
              }
          
              private String normalized(String value) {
                  return Normalizer.normalize(
                                  value == null ? "" : value,
                                  Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "")
                          .toLowerCase(Locale.ROOT)
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private String cleanQuery(String value) {
                  if (value == null) return "";
                  return value.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private void clearAll() {
                  getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit()
                          .clear()
                          .apply();
                  pickupEditor.setText("");
                  deliveryEditor.setText("");
                  waypointEditor.setText("");
