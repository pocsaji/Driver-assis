      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.13"
          ARCHIVE="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          INSTALL_ROOT="$RUNNER_TEMP/gradle-install"
          INSTALL_DIR="$INSTALL_ROOT/gradle-${GRADLE_VERSION}"
          rm -rf "$INSTALL_ROOT" "$ARCHIVE"
          mkdir -p "$INSTALL_ROOT"

          success=0
          for base_url in \
            "https://services.gradle.org/distributions" \
            "https://downloads.gradle.org/distributions"; do
            for attempt in 1 2 3 4 5; do
              echo "Gradle 8.13 letöltés: ${base_url}, kísérlet ${attempt}/5"
              if curl --fail --location --ipv4 \
                --retry 3 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --max-time 600 \
                "${base_url}/gradle-${GRADLE_VERSION}-bin.zip" \
                --output "$ARCHIVE"; then
                success=1
                break 2
              fi
              sleep $((attempt * 10))
            done
          done

          test "$success" -eq 1
          test -s "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$INSTALL_ROOT"
          test -x "$INSTALL_DIR/bin/gradle"
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/bin/gradle" --version | tee "$RUNNER_TEMP/gradle-version.txt"
          grep -F "Gradle 8.13" "$RUNNER_TEMP/gradle-version.txt"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V080 APK and AAB
        run: |
          set -euo pipefail
          echo "Memóriaállapot a fordítás előtt"
          free -h
          echo "[1/3] Release unit tesztek"
          gradle --no-daemon --console=plain --max-workers=2 \
            testReleaseUnitTest --stacktrace
          echo "[2/3] Aláírt release APK"
          gradle --no-daemon --console=plain --max-workers=2 \
            assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          echo "[3/3] Aláírt release AAB külön, egyetlen workerrel"
          gradle --no-daemon --console=plain --max-workers=1 \
            bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt, APK és AAB fordítás befejezve"
          free -h

      - name: Collect Driver Assist V080 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V080.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V080.aab
          sha256sum artifact/Driver_Assist_V080.apk artifact/Driver_Assist_V080.aab \
            | tee artifact/Driver_Assist_V080_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V080
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V080
          path: |
            artifact/Driver_Assist_V080.apk
            artifact/Driver_Assist_V080.aab
            artifact/Driver_Assist_V080_SHA256.txt
          if-no-files-found: error
          retention-days: 14
