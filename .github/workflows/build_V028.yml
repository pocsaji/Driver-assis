      - name: Audit Driver Assist V028 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          java_paths = sorted(java_root.rglob('*.java'))
          assert len(java_paths) == 23, len(java_paths)

          def balanced_java(source: str, path: Path) -> None:
              stack = []
              i = 0
              state = 'code'
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if ch == '/' and nxt == '/':
                          state = 'line'; i += 2; continue
                      if ch == '/' and nxt == '*':
                          state = 'block'; i += 2; continue
                      if ch == '"': state = 'string'
                      elif ch == "'": state = 'char'
                      elif ch in '({[': stack.append(ch)
                      elif ch in ')}]':
                          pairs = {')':'(', '}':'{', ']':'['}
                          assert stack and stack[-1] == pairs[ch], (path, i, ch)
                          stack.pop()
                  elif state == 'line':
                      if ch == '\n': state = 'code'
                  elif state == 'block':
                      if ch == '*' and nxt == '/': state = 'code'; i += 2; continue
                  elif state in ('string', 'char'):
                      if ch == '\\': i += 2; continue
                      if (state == 'string' and ch == '"') or (state == 'char' and ch == "'"):
                          state = 'code'
                  i += 1
              assert state in ('code', 'line'), (path, state)
              assert not stack, (path, stack)

          for path in java_paths:
              source = path.read_text('utf-8')
              assert source.startswith('package hu.pocsaji.driverassist'), path
              assert source.rstrip().endswith('}'), path
              balanced_java(source, path)

          gradle = (root/'app/build.gradle.kts').read_text('utf-8')
          settings = (root/'settings.gradle.kts').read_text('utf-8')
          manifest = (root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          strings = (root/'app/src/main/res/values/strings.xml').read_text('utf-8')
          accessibility = (root/'app/src/main/res/xml/accessibility_service_config.xml').read_text('utf-8')
          main = (java_root/'MainActivity.java').read_text('utf-8')
          service = (java_root/'TomTomAccessibilityService.java').read_text('utf-8')
          db_store = (java_root/'database/LocationDatabase.java').read_text('utf-8')
          all_project_text = '\n'.join(
              p.read_text('utf-8', errors='replace')
              for p in root.rglob('*') if p.is_file())

          # V028 identity and migration from the immediately previous V027 state.
          assert 'versionCode = 28' in gradle
          assert 'versionName = "028"' in gradle
          assert 'DriverAssistV028' in settings
          assert 'Driver Assist V028' in manifest
          assert 'Driver Assist V028' in strings
          assert 'private static final String VERSION = "V028";' in main
          assert 'private static final String VERSION = "V028";' in service
          assert 'static final String PREFS = "driver_assist_v028";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {27, 26, 25' in main
          assert 'migration_v028_done' in main
          assert 'V027' not in all_project_text and 'v027' not in all_project_text

          # Main screen: exactly one visible manual address-search area.
          build_ui = main.split('private void buildUi()', 1)[1].split(
              'private void applySamsungNavigationBarClearance', 1)[0]
          assert 'CÍMKERESÉS – név, város vagy teljes cím' in build_ui
          assert 'CÍM / POI KERESÉSE' in build_ui
          assert 'openGeneralAddressSearch()' in build_ui
          for removed in [
              'FELRAKÓ – kézzel is beírható cím',
              'LERAKÓ – kézzel is beírható cím',
              'FELRAKÓ\\nKERESÉSE',
              'LERAKÓ\\nKERESÉSE',
              'KÖZTES NÉV/CÍM KERESÉSE',
          ]:
              assert removed not in build_ui, removed
          assert build_ui.count('addressSearchEditor = createPointEditor') == 1

          # Database-first general search and no automatic route mutation.
          general = main.split('private void openGeneralAddressSearch()', 1)[1].split(
              'private void showGeneralDatabaseResults', 1)[0]
          assert 'database.searchPoiSmart(query, 20)' in general
          assert general.index('database.searchPoiSmart(query, 20)') < general.index(
              'openMapsForResolution(TARGET_UNASSIGNED, -1, query)')
          assert 'savePlaceToRoute(' not in general
          assert 'TARGET_UNASSIGNED = "unassigned"' in main

          # One result window with explicit four-way assignment at the bottom.
          results = main.split('private void showGeneralDatabaseResults', 1)[1].split(
              'private void openDatabasePoiForGeneralMap', 1)[0]
          for needle in [
              'Cím / POI találatok',
              'MI LEGYEN A KIJELÖLT PONTBÓL?',
              'Button pickup = createButton("FELRAKÓ"',
              'Button firstWaypoint = createButton("ELSŐ KÖZTES"',
              'Button lastWaypoint = createButton("UTOLSÓ KÖZTES"',
              'Button delivery = createButton("LERAKÓ"',
              'assignGeneralPlaceToRoute(',
              'NINCS KÖZTÜK – GOOGLE MAPS KERESÉS',
          ]: assert needle in results, needle
          assert results.index('selected[0] = poi') < results.index('assignGeneralPlaceToRoute(')

          # First intermediate inserts at index zero; last intermediate appends.
          assignment = main.split('private void assignGeneralPlaceToRoute', 1)[1].split(
              'private String routeRoleConfirmation', 1)[0]
          assert 'ROLE_FIRST_WAYPOINT.equals(role) ? 0 : coordinates.size()' in assignment
          assert 'coordinates.add(insertAt, place.coordinate)' in assignment
          assert 'labels.add(insertAt, place.label)' in assignment
          assert 'savePlaceToRoute(role, -1, place, warning, true, true)' in assignment

          # Google Maps opens a point/search, never an itinerary, and returns to mandatory role choice.
          assert 'https://www.google.com/maps/dir' not in main
          assert 'maps/dir' not in main
          general_map = main.split('private void openDatabasePoiForGeneralMap', 1)[1].split(
              'private void assignGeneralPlaceToRoute', 1)[0]
          assert 'https://www.google.com/maps/search/?api=1&query=' in general_map
          assert '.putString(KEY_PENDING_TARGET, TARGET_UNASSIGNED)' in general_map
          assert '.putBoolean(KEY_PENDING_MAP_ROUTE_UPDATE, false)' in general_map
          mandatory = main.split('private void showMandatoryPointRoleDialog', 1)[1].split(
              'private void openManualEndpointSearch', 1)[0]
          assert 'Mi legyen ebből a pontból?' in mandatory
          assert 'dialog.setCancelable(false)' in mandatory
          for role in ['FELRAKÓ', 'ELSŐ KÖZTES', 'UTOLSÓ KÖZTES', 'LERAKÓ']:
              assert role in mandatory

          # Map save is local-first, read-back verified, then role choice; cloud sync is later.
          persist = main.split('private void persistMapSave', 1)[1].split(
              'private LocationDatabase.PoiRecord createPoiRecordForMapSave', 1)[0]
          for needle in [
              'database.updatePoi(existing)',
              'database.insertMapPoi(record)',
              'persisted = database.getPoi(id)',
              'A helyi adatbázis visszaellenőrzése sikertelen.',
              'boolean needsRoleChoice = TARGET_UNASSIGNED.equals(target)',
              'showMandatoryPointRoleDialog(',
              'startAutomaticDatabaseSync(false)',
          ]: assert needle in persist, needle
          assert persist.index('persisted = database.getPoi(id)') < persist.index(
              'showMandatoryPointRoleDialog(')
          assert persist.index('showMandatoryPointRoleDialog(') < persist.index(
              'startAutomaticDatabaseSync(false)')

          # The original four-button horizontal Maps overlay remains; general targets are recognized.
          for needle in [
              'reviewPreviousButton = createReviewButton("◀ ELŐZŐ")',
              'reviewSaveButton = createReviewButton("📍 MENTÉS")',
              'reviewNextButton = createReviewButton("KÖVETKEZŐ ▶")',
              'reviewDoneButton = createReviewButton("KÉSZ")',
              'MainActivity.TARGET_UNASSIGNED.equals(target)',
              'ÁLTALÁNOS PONT',
          ]: assert needle in service, needle
          assert 'mode = "map_save";' not in service
          assert 'floatingButton.setText("MENTÉS")' not in service

          # Scanned address and found POI remain separate until confirmation, then one detailed approved address is stored.
          for needle in [
              'showResolvedPlaceConfirmation(',
              'BEOLVASOTT CÍM',
              'TALÁLT POI / CÍM',
              'JÓVÁHAGYOM',
              'savePlaceToRoute(target, index, place, routeNote, true, true)',
              'A talált cím jóváhagyva és összevonva',
              'sanitizedPlaceQuery(place)',
              'String.join(", ", nonBlankParts(',
          ]: assert needle in main, needle
          assert 'searchPoiSmart(String query, int limit)' in db_store

          ET.parse(root/'app/src/main/AndroidManifest.xml')
          ET.parse(root/'app/src/main/res/xml/accessibility_service_config.xml')
          ET.parse(root/'app/src/main/res/values/strings.xml')
          print('DRIVER_ASSIST_V028_SOURCE_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V028 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V028 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V028.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V028.aab
          sha256sum artifact/Driver_Assist_V028.apk artifact/Driver_Assist_V028.aab \
            | tee artifact/Driver_Assist_V028_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V028
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V028
          path: |
            artifact/Driver_Assist_V028.apk
            artifact/Driver_Assist_V028.aab
            artifact/Driver_Assist_V028_SHA256.txt
          if-no-files-found: error
          retention-days: 14
