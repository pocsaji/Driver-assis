      - name: Audit Driver Assist V038 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path('.')
          java_root=root/'app/src/main/java/hu/pocsaji/driverassist'
          main=(java_root/'MainActivity.java').read_text('utf-8')
          service=(java_root/'TomTomAccessibilityService.java').read_text('utf-8')
          database=(java_root/'database/LocationDatabase.java').read_text('utf-8')
          database_cloud=(java_root/'GoogleDriveDatabaseCloud.java').read_text('utf-8')
          vision=(java_root/'OpenAiVisionClient.java').read_text('utf-8')
          igo_writer=(java_root/'IgoKmlWriter.java').read_text('utf-8')
          igo_test=(root/'app/src/test/java/hu/pocsaji/driverassist/IgoKmlWriterTest.java').read_text('utf-8')
          gradle=(root/'app/build.gradle.kts').read_text('utf-8')
          settings=(root/'settings.gradle.kts').read_text('utf-8')
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          strings=(root/'app/src/main/res/values/strings.xml').read_text('utf-8')
          alltext='\n'.join(p.read_text('utf-8',errors='replace') for p in root.rglob('*') if p.is_file())

          def balanced_java(source,path):
              stack=[]; i=0; state='code'; pairs={')':'(',']':'[','}':'{'}
              while i<len(source):
                  ch=source[i]; nxt=source[i+1] if i+1<len(source) else ''
                  if state=='code':
                      if ch=='/' and nxt=='/': state='line'; i+=2; continue
                      if ch=='/' and nxt=='*': state='block'; i+=2; continue
                      if ch=='"': state='string'; i+=1; continue
                      if ch=="'": state='char'; i+=1; continue
                      if ch in '([{': stack.append(ch)
                      elif ch in ')]}':
                          assert stack and stack[-1]==pairs[ch], (path,i,ch,stack[-5:])
                          stack.pop()
                  elif state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and nxt=='/': state='code'; i+=2; continue
                  elif state in ('string','char'):
                      if ch=='\\': i+=2; continue
                      if (state=='string' and ch=='"') or (state=='char' and ch=="'"): state='code'
                  i+=1
              assert state in ('code','line'), (path,state)
              assert not stack,(path,stack)

          for path in java_root.rglob('*.java'):
              src=path.read_text('utf-8')
              assert src.startswith('package hu.pocsaji.driverassist'), path
              assert src.rstrip().endswith('}'), path
              balanced_java(src,path)
          for xml in root.glob('app/src/main/**/*.xml'):
              ET.parse(xml)

          # Identity/version
          assert 'versionCode = 38' in gradle
          assert 'versionName = "038"' in gradle
          assert 'DriverAssistV038' in settings
          assert 'Driver Assist V038' in manifest and 'Driver Assist V038' in strings
          assert 'private static final String VERSION = "V038";' in main
          assert 'private static final String VERSION = "V038";' in service
          assert 'static final String PREFS = "driver_assist_v038";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {37, 36, 35, 34, 33, 32, 31, 30, 29, 28, 27' in main
          assert 'migration_v038_done' in main
          assert not re.search(r'(?i)\bv037\b|driver_assist_v037|DriverAssistV037', alltext)

          # Simplified main UI and route list remain intact
          ui=main.split('private void buildUi()',1)[1].split('private void applySamsungNavigationBarClearance',1)[0]
          assert 'CÍMKERESÉS – név, város vagy teljes cím' in ui
          assert 'CÍM / POI KERESÉSE' in ui
          assert 'ÚTVONALPONTOK:' in ui
          assert 'ÚTVONALPONTOK – SORREND ÉS ELLENŐRZÉS' not in ui
          for needle in [
              'createTwoButtonRow(resolveButton, poiSearchButton)',
              'createThreeButtonRow(\n                        waypointButton,',
              'createTwoButtonRow(finishButton, igoButton)',
              '"KÜLDÉS\\niGO-RA"',
              'Color.rgb(170, 35, 35)']:
              assert needle in ui, needle
          for removed in ['Cím → Google-koordináta', 'ELLENŐRIZVE –', 'KÖZTES PONTOK – mentett koordináták', 'FELRAKÓ – kézzel', 'LERAKÓ – kézzel', 'KÖZTES NÉV/CÍM KERESÉSE']:
              assert removed not in ui, removed
          route=main.split('private void rebuildRoutePointList',1)[1].split('private void moveWaypoint',1)[0]
          for needle in ['roleShortName(point.target)', 'compactPointDetail(point)', 'button.setMaxLines(2)', 'return "FEL"', 'return "LE"', 'return "KÖZTES"', 'setScale(4, RoundingMode.HALF_UP)']:
              assert needle in route, needle

          # iGO export: accepted Point-based KML, remembered Android 14 SAF folder
          igo_flow=main.split('private void exportCurrentRouteToIgo()',1)[1].split('private void openVerifiedRoute()',1)[0]
          for needle in [
              'Intent.ACTION_OPEN_DOCUMENT_TREE',
              'takePersistableUriPermission(',
              'KEY_IGO_ROUTE_TREE_URI',
              'primary:iGO/content/userdata/route',
              'DocumentsContract.createDocument(',
              'application/vnd.google-earth.kml+xml',
              'IgoKmlWriter.build(',
              'DA_IGO_',
              'Az iGO-ban nyomd meg a Reboot gombot']:
              assert needle in igo_flow, needle
          assert 'catch (IOException | RuntimeException ignored)' in igo_flow

          # Orientation: system/user rotation plus wide-tablet two-column layout
          assert manifest.count('android:screenOrientation="user"') >= 4
          assert 'android:screenOrientation="portrait"' not in manifest
          for needle in [
              'private boolean useWideLandscapeLayout()',
              'Configuration.ORIENTATION_LANDSCAPE',
              'configuration.screenWidthDp >= 700',
              'columns.addView(leftScroll, leftParams)',
              'columns.addView(rightScroll, rightParams)',
              'searchColumn.addView(routePointList, matchWrap())',
              'actionColumn.addView(']:
              assert needle in main, needle

          # Database cloud sync: local event upload + silent remote metadata ping.
          for needle in [
              'DATABASE_REMOTE_PING_INTERVAL_MS = 60_000L',
              'DATABASE_LOCAL_CHANGE_DEBOUNCE_MS = 3_500L',
              'scheduleDatabaseDirtySync()',
              'databaseCloudPreferenceListener',
              'boolean manualCloudBusy = cloudOperationInProgress',
              'result.remoteVersion']:
              assert needle in main, needle
          for needle in [
              'boolean remoteChanged',
              'if (!localDirty && !remoteChanged)',
              'if (!localDirty)',
              'SyncResult.noChange',
              'final long remoteVersion']:
              assert needle in database_cloud, needle
          assert 'KEY_CLOUD_REMOTE_VERSION' in database
          assert 'changedDuringSync' in database
          for needle in [
              '<name>iGO-Route</name>',
              '<Placemark>',
              '<Point>',
              '<coordinates>',
              ".append(format(pair[1])).append(',')",
              '.append(format(pair[0])).append(",0</coordinates>\\n")']:
              assert needle in igo_writer, needle
          assert '<LineString>' not in igo_writer
          for needle in ['7.3793401,48.111881,0', 'A &amp; B', 'assertFalse(kml.contains("<LineString>"))']:
              assert needle in igo_test, needle

          # DB-first search: no implicit first result, exact selected ID is reloaded
          general=main.split('private void openGeneralAddressSearch()',1)[1].split('private void showGeneralDatabaseResults',1)[0]
          assert 'database.searchPoiSmart(query, 20)' in general
          assert general.index('database.searchPoiSmart(query, 20)') < general.index('openMapsForResolution(TARGET_UNASSIGNED, -1, query)')
          results=main.split('private void showGeneralDatabaseResults',1)[1].split('private void setRoleButtonsEnabled',1)[0]
          for needle in ['final long[] selectedPoiId = {-1L};', 'setRoleButtonsEnabled(roleButtons, false);', 'selectedPoi = database.getPoi(id);', 'Előbb érintsd meg a használni kívánt találatot.', 'KIVÁLASZTVA:']:
              assert needle in results, needle
          assert 'results.get(0)' not in results

          # Exact search and OCR-noise filtering
          for needle in ['if (tokens.size() <= 4)', 'requiredMatches = tokens.size()', 'matchedTokens == tokens.size()', 'queryNamesCity', 'isCoordinateNoiseToken', 'token.equals("douane")', 'token.equals("zoll")', 'token.equals("vam")']:
              assert needle in database, needle

          # Beolvasott címek: egyetlen adatbázis-bejárás, előkészített találatok
          scan_queue=main.split('private void processPendingScanQueue()',1)[1].split('private void resolveScannedAddressWithGoogle',1)[0]
          for needle in ['scanQueueSearchesPrepared(queue, cursor)', 'prefetchScanQueueSearches(queue, cursor)', 'database.searchPoiSmartBatch(queries, 20)', 'poi_search_ready', 'poi_candidate_ids', 'database.getPoisByIds(ids)', 'scanned-address-batch-database-search']:
              assert needle in scan_queue, needle
          assert 'scanned-address-database-search' not in scan_queue
          for needle in ['public List<List<PoiRecord>> searchPoiSmartBatch(', 'SearchablePoi searchable = new SearchablePoi(record)', 'insertTopScored(', 'searchable.companyWords', 'public List<PoiRecord> getPoisByIds(List<Long> ids)']:
              assert needle in database, needle

          # Every address-result map action uses the common review/save flow
          assert 'private void openPlaceInMapReview(' in main
          assert main.count('openPlaceInMapReview(') >= 7
          assert 'openSinglePlaceInMaps' not in main
          assert 'openPoiComparisonMap' not in main
          map_flow=main.split('private void openPlaceInMapReview',1)[1].split('private void assignGeneralPlaceToRoute',1)[0]
          for needle in ['KEY_PENDING_POI_ID, poiId', 'KEY_PENDING_SELECTED_LABEL', 'KEY_PENDING_SELECTED_QUERY', 'KEY_PENDING_MAP_ROUTE_UPDATE, updateRoute']:
              assert needle in map_flow, needle
          assert 'maps/dir' not in main and '/dir?' not in main and 'origin=' not in main and 'destination=' not in main

          # Local DB save and verification precede route update and cloud sync
          persist=main.split('private void persistMapSave',1)[1].split('private LocationDatabase.PoiRecord createPoiRecordForMapSave',1)[0]
          for needle in ['database.updatePoi(existing)', 'database.insertMapPoi(record)', 'persisted = database.getPoi(id)', 'A helyi adatbázis visszaellenőrzése sikertelen.', 'showMandatoryPointRoleDialog(', 'scheduleDatabaseDirtySync()']:
              assert needle in persist, needle
          assert persist.index('persisted = database.getPoi(id)') < persist.index('showMandatoryPointRoleDialog(') < persist.index('scheduleDatabaseDirtySync()')

          # Mandatory explicit route role; no search result auto-insertion
          mandatory=main.split('private void showMandatoryPointRoleDialog',1)[1].split('private void openManualEndpointSearch',1)[0]
          for needle in ['Mi legyen ebből a pontból?', 'dialog.setCancelable(false)', 'createTwoButtonRow(pickup, delivery)', 'createTwoButtonRow(firstWaypoint, lastWaypoint)']:
              assert needle in mandatory, needle

          # OCR queue: GPT-4o, full customs label, batch local lookup and sequential approval
          assert 'String model = OpenAiVisionClient.MODEL_GPT_4O;' in service
          scan_service=service.split('private void handleExtractedEndpoints(',1)[1].split('private JSONObject scanQueueItem',1)[0]
          for needle in ['JSONArray queue = new JSONArray()', 'KEY_SCAN_QUEUE_JSON', 'customsDisplayLabel(value, index)', 'openEditor()']:
              assert needle in scan_service, needle
          assert 'Vámhely " + (index + 1)' not in service
          for needle in ['DOUANE, ZOLL vagy VÁM', 'douane…henriot…pontarlier', 'soha ne adj vissza olyan általános', 'Ugyanazt a fizikai vámhelyet akkor is csak egyszer']:
              assert needle in vision, needle
          for needle in ['sameCustomsPlace(', 'customsIdentityTokens(', 'customsSpecificityScore(', 'embeddedCoordinate(', 'firstTokens.containsAll(secondTokens)', 'result.set(duplicateIndex, cleaned)']:
              assert needle in service, needle
          assert scan_service.index('if (!pickup.isEmpty())') < scan_service.index('for (int index = 0; index < customs.size(); index++)') < scan_service.index('if (!delivery.isEmpty())')

          # Google Maps overlay is compact, one-line, draggable; original four controls stay
          for needle in ['reviewTitle.setTextSize(10.5f)', 'reviewTitle.setMaxLines(1)', 'ReviewPanelDragTouchListener', 'reviewParams.y = 0', '0, dp(34), 1f', 'reviewPreviousButton = createReviewButton("◀ ELŐZŐ")', 'reviewSaveButton = createReviewButton("📍 MENTÉS")', 'reviewNextButton = createReviewButton("KÖVETKEZŐ ▶")', 'reviewDoneButton = createReviewButton("KÉSZ")']:
              assert needle in service, needle

          # TomTom-only floating button is small, left-centred and inactive
          for needle in ['floatingParams.width = dp(34)', 'floatingParams.height = dp(34)', 'floatingParams.gravity = Gravity.START | Gravity.CENTER_VERTICAL', 'if (tomTomState != TT_IDLE) {\n            return;\n        }']:
              assert needle in service, needle

          print('DRIVER_ASSIST_V038_SOURCE_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V038 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V038 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V038.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V038.aab
          sha256sum artifact/Driver_Assist_V038.apk artifact/Driver_Assist_V038.aab \
            | tee artifact/Driver_Assist_V038_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V038
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V038
          path: |
            artifact/Driver_Assist_V038.apk
            artifact/Driver_Assist_V038.aab
            artifact/Driver_Assist_V038_SHA256.txt
          if-no-files-found: error
          retention-days: 14
