          gradle-version: 8.13
          cache-disabled: true

      - name: Fallback Gradle 8.13 setup after network failure
        if: steps.setup_gradle.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "A setup-gradle hálózati hibába futott; közvetlen IPv4 letöltés indul."
          GRADLE_VERSION="8.13"
          ARCHIVE="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          INSTALL_DIR="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
          rm -rf "$INSTALL_DIR" "$ARCHIVE"
          success=0
          for attempt in 1 2 3 4 5; do
            echo "Gradle letöltési kísérlet: $attempt/5"
            if curl --fail --location --ipv4 \
              --retry 4 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              --output "$ARCHIVE"; then
              success=1
              break
            fi
            sleep $((attempt * 10))
          done
          test "$success" -eq 1
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/bin/gradle" --version

      - name: Verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --version | grep -F "Gradle 8.13"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V076 APK and AAB
        run: |
          set -euo pipefail
          echo "Memóriaállapot a fordítás előtt"
          free -h
          echo "[1/3] Release unit tesztek"
          gradle --no-daemon --console=plain --max-workers=2 \
            testReleaseUnitTest --stacktrace
          echo "[2/3] Aláírt release APK"
          gradle --no-daemon --console=plain --max-workers=2 \
            assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          echo "[3/3] Aláírt release AAB külön, egyetlen workerrel"
          gradle --no-daemon --console=plain --max-workers=1 \
            bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt, APK és AAB fordítás befejezve"
          free -h

      - name: Collect Driver Assist V076 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V076.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V076.aab
          sha256sum artifact/Driver_Assist_V076.apk artifact/Driver_Assist_V076.aab \
            | tee artifact/Driver_Assist_V076_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V076
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V076
          path: |
            artifact/Driver_Assist_V076.apk
            artifact/Driver_Assist_V076.aab
            artifact/Driver_Assist_V076_SHA256.txt
          if-no-files-found: error
          retention-days: 14
