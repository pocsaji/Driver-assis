      - name: Audit Driver Assist V004 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          base_paths = sorted(java_root.glob('*.java'))
          database_paths = sorted((java_root / 'database').glob('*.java'))
          assert len(base_paths) == 6, base_paths
          assert len(database_paths) == 3, database_paths

          for path in base_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist;'), path
              assert source.rstrip().endswith('}'), path
          for path in database_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist.database;'), path
              assert source.rstrip().endswith('}'), path

          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          settings = Path('settings.gradle.kts').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')
          main = (java_root / 'MainActivity.java').read_text(encoding='utf-8')
          service = (java_root / 'TomTomAccessibilityService.java').read_text(encoding='utf-8')
          database_activity = (java_root / 'database/DatabaseManagementActivity.java').read_text(encoding='utf-8')
          database_store = (java_root / 'database/LocationDatabase.java').read_text(encoding='utf-8')
          transfer = (java_root / 'database/DatabaseTransfer.java').read_text(encoding='utf-8')

          assert 'versionCode = 4' in gradle
          assert 'versionName = "004"' in gradle
          assert 'DriverAssistV004' in settings
          assert 'Driver Assist V004' in manifest
          assert 'Driver Assist V004' in strings
          assert 'private static final String VERSION = "V004";' in main
          assert 'static final String PREFS = "driver_assist_v004";' in main
          assert 'private static final String PREVIOUS_PREFS = "driver_assist_v003";' in main
          assert 'migration_v004_done' in main
          assert 'DatabaseManagementActivity.class' in main
          assert 'createTwoButtonRow(resolveButton, waypointButton)' in main
          assert 'createTwoButtonRow(finishButton, clearButton)' in main
          assert 'WindowInsets.Type.navigationBars()' in main
          assert 'Math.max(dp(96), navigationBottom + dp(30))' in main
          assert 'button.setSingleLine(true);' in main
          assert 'ELLENŐRIZVE – " + routePointCount + " útvonalpont' in main
          assert '.database.DatabaseManagementActivity' in manifest
          assert 'Documents / Drive Assist' in database_activity
          assert 'CREATE TABLE ' in database_store
          assert 'company_name' in database_store
          assert 'source_reference' in database_store
          assert 'Drive Assist' in transfer
          assert 'IMPORT_FOLDER' in transfer and 'EXPORT_FOLDER' in transfer and 'BACKUP_FOLDER' in transfer
          assert 'database_transfer_v004' in transfer
          assert 'public static boolean beginTomTomRoute(' in service
          assert 'TT_SEARCH_RESULT_FALLBACK_ATTEMPT = 14' in service
          assert 'tomTomNotBefore' in service
          assert 'scheduleTomTomStep(450L);' in service
          assert service.count('public static boolean beginTomTomRoute(') == 1

          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          ET.parse('app/src/main/res/values/strings.xml')
          print('DRIVER_ASSIST_V004_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"

      - name: Build signed Driver Assist V004 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle fordítás indul"
          gradle --no-daemon --console=plain assembleRelease bundleRelease --stacktrace
          echo "Gradle fordítás befejezve"

      - name: Collect Driver Assist V004 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V004.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V004.aab
          ls -lah artifact

      - name: Upload Driver Assist V004
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V004
          path: |
            artifact/Driver_Assist_V004.apk
            artifact/Driver_Assist_V004.aab
          if-no-files-found: error
          retention-days: 14
