      - name: Audit Driver Assist V010 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          base_paths = sorted(java_root.glob('*.java'))
          database_paths = sorted((java_root / 'database').glob('*.java'))
          assert len(base_paths) == 6, base_paths
          assert len(database_paths) == 4, database_paths

          for path in base_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist;'), path
              assert source.rstrip().endswith('}'), path
          for path in database_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist.database;'), path
              assert source.rstrip().endswith('}'), path

          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          settings = Path('settings.gradle.kts').read_text(encoding='utf-8')
