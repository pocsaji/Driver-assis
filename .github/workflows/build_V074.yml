      - name: Audit Driver Assist V074 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          root = Path('.')
          java = root / 'app/src/main/java/hu/pocsaji/driverassist'
          main = (java/'MainActivity.java').read_text('utf-8')
          service = (java/'TomTomAccessibilityService.java').read_text('utf-8')
          openai = (java/'OpenAiVisionClient.java').read_text('utf-8')
          overlay = (java/'RouteClipboardOverlayService.java').read_text('utf-8')
          external_overlay = (java/'ExternalNavigationOverlayService.java').read_text('utf-8')
          external_plan = (java/'ExternalNavigationPlan.java').read_text('utf-8')
          order = (java/'RouteOrder.java').read_text('utf-8')
          igo = (java/'IgoKmlWriter.java').read_text('utf-8')
          database = (java/'database/LocationDatabase.java').read_text('utf-8')
          poi_search = (java/'poisearch/PoiSearchActivity.java').read_text('utf-8')
          gradle = (root/'app/build.gradle.kts').read_text('utf-8')
          gradle_properties = (root/'gradle.properties').read_text('utf-8')
          settings = (root/'settings.gradle.kts').read_text('utf-8')
          strings = (root/'app/src/main/res/values/strings.xml').read_text('utf-8')
          manifest = (root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          order_test = (root/'app/src/test/java/hu/pocsaji/driverassist/RouteOrderTest.java').read_text('utf-8')
          external_test = (root/'app/src/test/java/hu/pocsaji/driverassist/ExternalNavigationPlanTest.java').read_text('utf-8')
          speech_module = (java/'speech/SpeechRecognitionModule.java').read_text('utf-8')
          speech_config = (java/'speech/SpeechRecognitionConfig.java').read_text('utf-8')
          speech_service = (java/'speech/SpeechRecognitionForegroundService.java').read_text('utf-8')
          speech_adapter = (java/'DriverAssistSpeechModule.java').read_text('utf-8')
          speech_test = (root/'app/src/test/java/hu/pocsaji/driverassist/speech/SpeechRecognitionCoreTest.java').read_text('utf-8')
          
          def section(src, start, end):
              assert start in src, start
              tail=src.split(start,1)[1]
              assert end in tail, end
              return tail.split(end,1)[0]
          
          def balanced(src, path):
              stack=[]; state='code'; quote=''; i=0; pairs={')':'(',']':'[','}':'{'}
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='code':
                      if c=='/' and n=='/': state='line'; i+=2; continue
                      if c=='/' and n=='*': state='block'; i+=2; continue
                      if c in ('"', "'"): state='string'; quote=c; i+=1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}': assert stack and stack.pop()==pairs[c], (path,i,c)
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=2; continue
                  elif state=='string':
                      if c=='\\': i+=2; continue
                      if c==quote: state='code'
                  i+=1
              assert state not in ('block','string'), (path,state)
              assert not stack, (path,stack[-10:])
          
          for path in list(root.rglob('*.java'))+list(root.rglob('*.kt'))+list(root.rglob('*.kts')):
              balanced(path.read_text('utf-8'), path)
          for path in root.rglob('*.xml'):
              ET.parse(path)
          
          # V074 egységesség.
          assert 'versionCode = 74' in gradle
          assert 'versionName = "074"' in gradle
          assert 'DriverAssistV074' in settings
          assert 'private static final String VERSION = "V074";' in main
          assert 'private static final String VERSION = "V074";' in service
          assert 'static final String PREFS = "driver_assist_v074";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {73, 72, 71, 70, 69, 68, 67, 66, 65, 64, 63, 62, 61, 60, 59, 58' in main
          assert 'migration_v074_done' in main
          assert 'Driver Assist V074' in strings and 'Driver Assist V074' in manifest
          assert 'org.gradle.jvmargs=-Xmx4096m' in gradle_properties
          assert 'org.gradle.workers.max=2' in gradle_properties
          assert 'org.gradle.parallel=false' in gradle_properties
          assert 'org.gradle.daemon=false' in gradle_properties
          
          # Egyetlen kanonikus, sorrendtartó útvonalmodell.
          for forbidden in [
              'TARGET_PICKUP', 'TARGET_DELIVERY', 'TARGET_WAYPOINT',
              'KEY_PICKUP_QUERY', 'KEY_PICKUP_COORD', 'KEY_PICKUP_LABEL',
              'KEY_DELIVERY_QUERY', 'KEY_DELIVERY_COORD', 'KEY_DELIVERY_LABEL',
              'KEY_WAYPOINTS', 'KEY_WAYPOINT_LABELS', 'KEY_WAYPOINT_SEARCH_QUERY',
              'pickupEditor', 'deliveryEditor', 'waypointEditor', 'waypointSearchEditor',
              'pickupStatus', 'deliveryStatus', 'waypointStatus',
              'suggested_role', 'suggestedRole'
          ]:
              assert forbidden not in main + '\n' + service, forbidden
          for required in [
              'KEY_ROUTE_POINTS_JSON = "route_points_json"',
              'TARGET_ROUTE_POINT = "route_point"',
              'private ArrayList<RouteEntry> readOrderedRouteEntries(',
              'private void writeOrderedRouteEntries(',
              'private boolean insertGeneralPlaceAt(',
              'showRouteInsertionPositionDialog(',
              'entries.set(routeIndex, entries.get(targetIndex));',
              'entries.remove(routeIndex);'
          ]:
              assert required in main, required
          route_entry = section(main, 'private static final class RouteEntry', 'static final class ReviewPoint')
          for field in ['final String label;', 'final String query;', 'final String coordinate;', 'final String warning;', 'final String sourceName;']:
              assert field in route_entry
          for forbidden in ['role', 'pickup', 'delivery', 'waypoint']:
              assert forbidden not in route_entry.lower(), forbidden
          review_point = section(main, 'static final class ReviewPoint', 'private static final class ResolvedUrl')
          assert 'final int index;' in review_point
          assert 'target' not in review_point and 'role' not in review_point
          
          # V060 és régebbi útvonalak sorrendtartó, egyszeri migrációja; aktív logika nem használja a régi kulcsokat.
          migration = section(main, 'private void migrateLegacyRouteStorage(', 'private void refreshTomTomLoginButton()')
          for required in ['LEGACY_FIRST_QUERY', 'LEGACY_MIDDLE_VALUES', 'LEGACY_LAST_QUERY', '.remove(LEGACY_FIRST_QUERY)', '.remove(LEGACY_LAST_QUERY)', '.remove(LEGACY_MIDDLE_VALUES)']:
              assert required in migration, required
          assert migration.index('LEGACY_FIRST_QUERY') < migration.index('LEGACY_MIDDLE_VALUES') < migration.index('LEGACY_LAST_QUERY')
          
          # Főlista és minden felhasználói felirat csak számozást használ.
          list_ui = section(main, 'private void rebuildRoutePointList(', 'private void startExternalRouteReview(')
          for required in ['(routeIndex + 1) + "/" + total', 'moveRoutePoint(', 'deleteRoutePoint(', '(routeIndex + 1) + ". pont neve"']:
              assert required in list_ui, required
          for forbidden in ['Felrakó', 'Lerakó', 'Köztes', 'FELRAKÓ', 'LERAKÓ', 'KÖZTES']:
              assert forbidden not in list_ui, forbidden
          
          # Lebegő vágólap: eredeti sorszám+név, szerepcímke nélkül; egyetlen folyamatos N..1 TomTom-sorrend.
          payload = section(main, 'private String createRouteClipboardOverlayPayload()', 'private void showSettingsMenu()')
          assert 'tomTomClipboardInputOrder(routePoints)' in payload
          assert 'item.put("label", (point.index + 1) + ". " + label);' in payload
          for forbidden in ['FELRAKÓ', 'LERAKÓ', 'KÖZTES', 'role =']:
              assert forbidden not in payload, forbidden
          for required in ['clipboardInputIndexes', 'for (int output = 0; output < size; output++)', 'indexes[output] = size - 1 - output;']:
              assert required in order, required
          for forbidden in ['indexes[0] = size - 2;', 'indexes[1] = size - 1;', 'for (int index = size - 3; index >= 0; index--)']:
              assert forbidden not in order, forbidden
          assert 'new int[] {4, 3, 2, 1, 0}' in order_test
          assert 'new int[] {1, 0}' in order_test
          
          # iGO: pontosan a kanonikus 1..N sorrendet exportálja, külön párcsere nélkül.
          igo_export = section(main, 'private void exportCurrentRouteToIgo()', 'private void requestIgoRouteFolder(')
          assert 'igoExportOrder(canonical)' in igo_export
          assert 'labels.add((point.index + 1) + ". " +' in igo_export
          assert 'return identityIndexes(size);' in order
          for forbidden in ['finalPairCompensationIndexes', 'indexes[last - 1] = last;', 'indexes[last] = last - 1;']:
              assert forbidden not in order, forbidden
          assert 'new int[] {0, 1, 2, 3, 4}' in order_test
          assert 'new int[] {0, 1}' in order_test
          assert 'igoExportKeepsCanonicalOrderWithoutAnyPairSwap' in order_test
          assert 'kml.indexOf("1. A &amp; B") < kml.indexOf("2. C")' in (root/'app/src/test/java/hu/pocsaji/driverassist/IgoKmlWriterTest.java').read_text('utf-8')
          assert '<Placemark>' in igo and '<Point>' in igo and '<LineString>' not in igo
          
          # Közvetlen TomTom automatizálás: kanonikus 1..N bemenet; a service folyamatosan N..1 sorrendben viszi be.
          auto_tomtom = section(main, 'private void openVerifiedRoute()', 'private void resolveCurrentLocationAndSave(')
          assert 'for (ReviewPoint point : tomTomAutomationOrder(canonical))' in auto_tomtom
          assert 'tomTomClipboardInputOrder' not in auto_tomtom
          assert 'tomTomAutomationIndexes' in order
          assert 'return identityIndexes(size);' in order
