        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path('.')
          java=root/'app/src/main/java/hu/pocsaji/driverassist'
          main=(java/'MainActivity.java').read_text('utf-8')
          service=(java/'TomTomAccessibilityService.java').read_text('utf-8')
          database=(java/'database/LocationDatabase.java').read_text('utf-8')
          simple_poi=(java/'database/SimplePoiEditorDialog.java').read_text('utf-8')
          poi_search=(java/'poisearch/PoiSearchActivity.java').read_text('utf-8')
          poi_analysis=(java/'poisearch/PoiMapAnalysis.java').read_text('utf-8')
          poi_vision=(java/'poisearch/PoiMapVisionClient.java').read_text('utf-8')
          poi_spatial=(java/'poisearch/PoiSpatialSearchEngine.java').read_text('utf-8')
          poi_list=(java/'database/PoiListActivity.java').read_text('utf-8')
          cloud=(java/'GoogleDriveDatabaseCloud.java').read_text('utf-8')
          igo=(java/'IgoKmlWriter.java').read_text('utf-8')
          gradle=(root/'app/build.gradle.kts').read_text('utf-8')
          settings=(root/'settings.gradle.kts').read_text('utf-8')
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          alltext='\n'.join(p.read_text('utf-8',errors='replace') for p in root.rglob('*') if p.is_file() and p.name != 'project.tar.gz')
          
          def balanced(src,path):
              stack=[]; state='code'; i=0; pairs={')':'(',']':'[','}':'{'}
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='code':
                      if c=='/' and n=='/': state='line'; i+=2; continue
                      if c=='/' and n=='*': state='block'; i+=2; continue
                      if c=='"': state='string'; i+=1; continue
                      if c=="'": state='char'; i+=1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}': assert stack and stack.pop()==pairs[c],(path,i,c)
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=2; continue
                  else:
                      if c=='\\': i+=2; continue
                      if (state=='string' and c=='"') or (state=='char' and c=="'"): state='code'
                  i+=1
              assert not stack,(path,stack)
          
          for p in java.rglob('*.java'):
              s=p.read_text('utf-8'); balanced(s,p); assert s.rstrip().endswith('}')
          for p in root.glob('app/src/main/**/*.xml'): ET.parse(p)
          
          # version / identity
          assert 'versionCode = 51' in gradle
          assert 'versionName = "051"' in gradle
          assert 'DriverAssistV051' in settings
          assert 'private static final String VERSION = "V051";' in main
          assert 'private static final String VERSION = "V051";' in service
          assert 'static final String PREFS = "driver_assist_v051";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {50, 49, 48, 47, 46, 45, 44, 43, 42, 41, 40, 39, 38, 37' in main
          assert not re.search(r'(?i)\bv050\b|driver_assist_v050|DriverAssistV050',alltext)
          
          # main UI: one search button opens the three requested search modes
          ui=main.split('private void buildUi()',1)[1].split('private void applySamsungNavigationBarClearance',1)[0]
          for n in ['"KERESÉS"','FELHŐBE\\nMENTÉS','KÜLDÉS\\niGO-RA','showSearchMenu()']:
              assert n in ui,n
          for forbidden in ['CÍM / POI\\nKERESÉSE','POI\\nKERESÉSE','ÚJ PONT\\nTÉRKÉPRŐL','KÖZTES PONT\\nTÉRKÉPRŐL','CÍMEK ELLENŐRZÉSE']:
              assert forbidden not in ui,forbidden
          search_menu=main.split('private void showSearchMenu()',1)[1].split('private void openGeneralAddressSearch()',1)[0]
          for n in ['POI KERESÉS','SZÖVEGES KERESÉS','TÉRKÉPEN KERESÉS','openPoiSearch();','openGeneralAddressSearch();','openNewWaypoint();']:
              assert n in search_menu,n
          for n in ['readOrderedRouteEntries(','writeOrderedRouteEntries(','moveRoutePoint(']: assert n in main,n
          assert 'showRouteInsertionPositionDialog(' not in main
          assert 'private String compactPointDetail(ReviewPoint point)' in main
          assert 'String secondLine = compactPointDetail(point);' in main
          assert 'showMandatoryPointRoleDialog(' not in main
          assert '.remove(KEY_GENERAL_SEARCH_QUERY)' in main
          assert 'setEditorText(addressSearchEditor, "")' in main
          
          # simplified stand-alone POI search screen
          poi_ui=poi_search.split('private void buildUi()',1)[1].split('private void loadCategories',1)[0]
          for n in ['KÉPERNYŐFOTÓ','AKTUÁLIS KÉPERNYŐ','POI-KATEGÓRIA','Keresési sáv: 5 km','POI-K KERESÉSE']:
              assert n in poi_ui,n
          for forbidden in ['KÉZI POI-KERESÉS AZ ADATBÁZISBAN','Név, város, cím vagy megjegyzés','SZÖVEGES POI-KERESÉS','MÁSIK KÉP KIVÁLASZTÁSA']:
              assert forbidden not in poi_ui,forbidden
          
          # selectable insertion slot: before first, between points, or after last
          for n in ['KEY_PENDING_INSERT_POSITION','insertionPositionLabel(','insertionButtonLabel(','selectedInsertPosition','◀ ELŐRÉBB','HÁTRÉBB ▶']:
              assert n in main,n
          results=main.split(
              'private void showGeneralDatabaseResults(\n            String query,\n            List<LocationDatabase.PoiRecord> results,\n            boolean fromScanQueue,',
              1)[1].split('private String insertionPositionLabel',1)[0]
          for n in [
              'results.isEmpty() ? -1L : results.get(0).id',
              'poi.id == selectedPoiId[0]',
              'selectedInsertPosition[0]',
              'position > 0',
              'position < routePointCount',
              'insertGeneralPlaceAt(insertAt, selectedPlace, note)']:
              assert n in results,n
          approve=main.split('private void approveCapturedMapPoint',1)[1].split('private void advanceRouteReviewAfterApproval',1)[0]
          for n in ['KEY_PENDING_INSERT_POSITION','Math.max(0, Math.min(insertAt, routePointCount))','insertGeneralPlaceAt(insertAt, place, warning)']:
              assert n in approve,n
          assert approve.index('getInt(\n                    KEY_PENDING_INSERT_POSITION') < approve.index('insertGeneralPlaceAt(insertAt, place, warning)')
          
          # map overlay uses previous/next as insertion-position controls for a new point
          for n in ['reviewParams.y = dp(88)','ReviewPanelDragTouchListener','◀ ELŐZŐ','KÖVETKEZŐ ▶','JÓVÁHAGYÁS','MENTÉS POI-KÉNT','BEFEJEZÉS','reviewPoiButton','triggerMapAction(','minimum = dp(88)']:
              assert n in service,n
          for n in ['ÚJ PONT HELYE:','KEY_PENDING_INSERT_POSITION','setReviewNavigationState(','current + direction','insertionPosition > 0','insertionPosition < currentCount']:
              assert n in service,n
          assert 'setReviewNavigationEnabled(' not in service
          assert 'findCoordinateInGoogleMapsSearchField' not in service
          assert 'findCoordinateInSearchNode' not in service
          assert 'requestMapSaveConfirmation' not in service
          assert 'setReviewSaveButtonState' not in service
          assert 'ACTION_CONFIRM_MAP_SAVE' not in service
          assert 'startMapShareFlow();' in service
          assert 'mindig az aktuális hely' in service
          for n in ['requestMapReviewOverlayRefresh()','refreshMapReviewOverlayWithRetries()','GOOGLE_MAPS_PACKAGE.equals(foregroundPackage)','handler.postDelayed(this::updateFloatingButton, 2800L)']:
              assert n in service,n
          for n in ['TomTomAccessibilityService.requestMapReviewOverlayRefresh();','boolean pendingStateSaved','commit();']:
              assert n in main,n
          
          # map action split and stale-coordinate removal
          for n in ['KEY_PENDING_MAP_ACTION','MAP_ACTION_APPROVE_ROUTE','MAP_ACTION_SAVE_POI','approveCapturedMapPoint(','showPoiSaveConfirmation(','openSimplePoiEditor(','SimplePoiEditorDialog.showPoiSave(','persistPoiSave(','enrichPoiDraftFromReverseGeocode(','MENTÉS POI-KÉNT','Az útvonalpont jóváhagyva.']:
              assert n in main,n
          assert 'ACTION_CONFIRM_MAP_SAVE' not in main
          assert 'EXTRA_MAP_COORDINATE' not in main
          assert 'openDirectMapSaveConfirmation' not in main
          assert 'pendingPlaceForCoordinate' not in main
          assert 'showMapSaveConfirmation(' not in main
          assert 'persistMapSave(' not in main
          
          # Google Maps short-link coordinate recovery and retry behavior
          for n in [
              'STRICT_EMBEDDED_COORDINATE_PATTERN','JSON_LAT_LNG_PATTERN','GOOGLE_PLACE_ID_PATTERN',
              'decodeRepeatedly(','extractEmbeddedGoogleMapsUrl(','resolveSharedGoogleMapsPlace(',
              'geocodeGooglePlaceId(','Accept-Encoding','identity','hasPendingMapTargetForRetry()']:
              assert n in main,n
          assert 'reportMapSaveFailure(' in main
          assert 'requestMapReviewOverlayRefresh()' in main
          
          # route approval has one owner and one result
          assert 'savePlaceToRoute(' in approve
          assert 'LocationDatabase' not in approve
          assert 'originalLabel' in approve and 'originalQuery' in approve
          assert 'notifyMapSaveResult(true)' in approve
          assert 'advanceRouteReviewAfterApproval' in approve
          assert 'notifyRoutePointApprovedAndAdvance' not in main
          assert 'advanceRouteReviewAfterApprovalFallback' not in main
          assert 'resumeActiveMapReview' not in main
          assert 'notifyRoutePointApprovedAndAdvance' not in service
          assert 'handleRoutePointApprovedAndAdvance' not in service
          advance=main.split('private void advanceRouteReviewAfterApproval()',1)[1].split('private void clearCompletedRouteReviewState',1)[0]
          for n in ['int next = current + 1','openReviewPoint(points.get(next))','clearCompletedRouteReviewState(preferences)']:
              assert n in advance,n
          resolve=main.split('private void resolveSharedPlace',1)[1].split('private SharedPlace resolveSharedGoogleMapsPlace',1)[0]
          assert 'pendingRouteTarget' in resolve
          assert 'approveCapturedMapPoint(' in resolve
          assert 'reviewPlaceAgainstDatabase(' not in resolve
          assert 'directRouteApproval' not in main
          assert 'pendingRouteUpdate' not in resolve
          
          poi=main.split('private void persistPoiSave',1)[1].split('private void finishMapActionWithoutClearingPoint',1)[0]
          for n in ['database.updatePoi(edited)','database.insertMapPoi(edited)','persisted = database.getPoi(id)','scheduleDatabaseDirtySync()']: assert n in poi,n
          assert 'savePlaceToRoute(' not in poi
          assert 'showRouteInsertionPositionDialog(' not in poi
          
          # simplified POI editor and removal of manual coordinate entry
          for n in ['POI neve – jóváhagyás vagy módosítás','MENTÉS ELŐTT ELLENŐRIZD A POI NEVÉT','A név jóváhagyható vagy átírható','name.setSelectAllOnFocus(true)','public static void showPoiSave(','"Kategória"','"Ország"','"Irányítószám"','"Város"','"Utca"','"Házszám"','CATEGORY_VALUES','A koordinátát a térképen kijelölt helyből veszi át']:
              assert n in simple_poi,n
          for forbidden in ['"Szélesség"','"Hosszúság"','optionalCoordinate(']:
              assert forbidden not in simple_poi,forbidden
          assert '+ ÚJ POI FELVÉTELE AZ ADATBÁZISBA' not in poi_search
          assert 'openNewPoiEditor(' not in poi_search
          assert '+ ÚJ POI FELVÉTELE' not in poi_list
          assert 'EXTRA_CREATE_NEW' not in poi_list
          assert 'SimplePoiEditorDialog.showPoiSave(' in poi_list
          assert 'SimplePoiEditorDialog.show(' not in (main + poi_list)
          assert '"Szélesség"' not in poi_list
          assert '"Hosszúság"' not in poi_list
          
          # map screenshot bounds repair
          for n in ['repairVisibleBounds(','normalizeRawBounds(','deriveBoundsFromEvidence(','expandCollapsedRawPoint(','boundsAroundPoint(','evidenceInsideBounds(']:
              assert n in poi_analysis,n
          for n in ['north mindig','azonos north/south','forgalmi útszínezése önmagában nem navigációs útvonal']:
              assert n in poi_vision,n
          
          # area POI search uses a real radius around recognized center
          for n in ['chooseAreaCenter(','boundsAroundPoint(','if (distance <= maximumMeters)','areaCenter.latitude','analysis.anchors']:
              assert n in poi_spatial,n
          assert poi_spatial.count('if (distance <= maximumMeters)') >= 2
          assert 'expand(analysis.visibleBounds, safeDistanceKm)' not in poi_spatial
          assert 'keresési középponttól' in poi_search
          assert 'teljes látható térségben történt a keresés' not in poi_search
          
          # existing major functions remain
          for n in ['DATABASE_REMOTE_PING_INTERVAL_MS = 60_000L','DATABASE_LOCAL_CHANGE_DEBOUNCE_MS = 3_500L','boolean remoteChanged','KEY_CLOUD_REMOTE_VERSION']:
              assert n in (main+'\n'+cloud+'\n'+database),n
          assert 'Intent.ACTION_OPEN_DOCUMENT_TREE' in main
          assert 'IgoKmlWriter.build(' in main
          assert '<Placemark>' in igo and '<Point>' in igo and '<LineString>' not in igo
          assert manifest.count('android:screenOrientation="user"') >= 4
          print('DRIVER_ASSIST_V051_SOURCE_AUDIT_OK')
          PY_VERIFY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V051 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V051 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V051.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V051.aab
          sha256sum artifact/Driver_Assist_V051.apk artifact/Driver_Assist_V051.aab \
            | tee artifact/Driver_Assist_V051_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V051
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V051
          path: |
            artifact/Driver_Assist_V051.apk
            artifact/Driver_Assist_V051.aab
            artifact/Driver_Assist_V051_SHA256.txt
          if-no-files-found: error
          retention-days: 14
