              'EXPORTÁLÁS – JSON',
              'BIZTONSÁGI MÁSOLAT KÉSZÍTÉSE',
              'ADATBÁZIS TISZTÍTÁSA – 20 M',
              'confirmDatabaseCleanup()'
          ]:
              assert required in export_menu, required
          assert database_management.count('ADATBÁZIS TISZTÍTÁSA – 20 M') == 2
          statistics = section(database_management, 'private TextView createStatisticsView()', 'private void confirmDatabaseCleanup()')
          for required in ['setTextSize(14)', 'Összes POI:', 'getCategoryCounts(false)', 'categoryDisplayName(']:
              assert required in statistics, required

          cleanup_flow = section(database_management, 'private void confirmDatabaseCleanup()', 'private void openImportPicker()')
          for required in [
              'automatikus biztonsági másolatot készít',
              'DatabaseTransfer.exportJson(this, database, true)',
              'database.cleanupCoordinateDuplicates(',
              'LocationDatabase.AUTO_MERGE_METERS',
              'result.removed'
          ]:
              assert required in cleanup_flow, required
          assert cleanup_flow.index('DatabaseTransfer.exportJson(this, database, true)') < cleanup_flow.index('database.cleanupCoordinateDuplicates(')

          cleanup_engine = section(database, 'public CleanupResult cleanupCoordinateDuplicates(', 'public PoiSaveResult savePoiMerged(')
          for required in [
              'maximumMeters > 50.0',
              'readCoordinateRecords(db)',
              'poiInformationScore(right)',
              'findCleanupSurvivor(',
              'mergedPoiValues(',
              'db.delete(',
              'markCloudDirty(applicationContext)',
              'new CleanupResult('
          ]:
              assert required in cleanup_engine, required
          for required in [
              'public static final class CleanupResult',
              'public final int scanned;',
              'public final int groups;',
              'public final int removed;',
              'public final int total;'
          ]:
              assert required in database, required

          # Kategóriák, Google Maps feloldás és korábbi alapfunkciók változatlanok.
          for required in ['categoryDisplayName(', 'categoryIcon(', 'routeLabel(']:
              assert required in database, required
          for required in ['"CÉG"', '"PARKOLÓ"', '"VÁSÁRLÁS"']:
              assert required in simple_poi, required
          assert 'LocationDatabase.routeLabel(' in poi_search
          assert 'LocationDatabase.routeLabel(' in poi_list
          assert 'LocationDatabase.categoryDisplayName(' in database_management
          resolve = section(main, 'private void resolveSharedPlace(', 'private SharedPlace resolveSharedGoogleMapsPlace(')
          assert 'final SharedPlace approvedPlace = place;' in resolve
          assert 'showPoiSaveConfirmation(approvedPlace);' in resolve
          assert 'reverseGeocodeCoordinate(directCoordinate)' in resolve
          for required in ['◀ ELŐZŐ', 'KÖVETKEZŐ ▶', 'JÓVÁHAGYÁS', 'MENTÉS POI-KÉNT', 'BEFEJEZÉS']:
              assert required in service, required
          assert 'IgoKmlWriter.build(' in main
          assert '<Placemark>' in igo and '<Point>' in igo and '<LineString>' not in igo
          assert manifest.count('android:screenOrientation="user"') >= 4
          for required in ['repairVisibleBounds(', 'normalizeRawBounds(', 'deriveBoundsFromEvidence(']:
              assert required in poi_analysis, required
          for required in ['north mindig', 'azonos north/south']:
              assert required in poi_vision, required
          for required in ['chooseAreaCenter(', 'if (distance <= maximumMeters)']:
              assert required in poi_spatial, required
          for required in ['DATABASE_REMOTE_PING_INTERVAL_MS = 60_000L', 'DATABASE_LOCAL_CHANGE_DEBOUNCE_MS = 3_500L', 'KEY_CLOUD_REMOTE_VERSION']:
              assert required in (main + '\n' + cloud + '\n' + database), required

          print('DRIVER_ASSIST_V058_SOURCE_AUDIT_OK')
          PY_VERIFY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V058 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V058 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V058.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V058.aab
          sha256sum artifact/Driver_Assist_V058.apk artifact/Driver_Assist_V058.aab \
            | tee artifact/Driver_Assist_V058_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V058
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V058
          path: |
            artifact/Driver_Assist_V058.apk
            artifact/Driver_Assist_V058.aab
            artifact/Driver_Assist_V058_SHA256.txt
          if-no-files-found: error
          retention-days: 14
