      - name: Audit Driver Assist V058 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          java = root / 'app/src/main/java/hu/pocsaji/driverassist'
          main = (java / 'MainActivity.java').read_text('utf-8')
          service = (java / 'TomTomAccessibilityService.java').read_text('utf-8')
          simple_poi = (java / 'database/SimplePoiEditorDialog.java').read_text('utf-8')
          poi_search = (java / 'poisearch/PoiSearchActivity.java').read_text('utf-8')
          poi_analysis = (java / 'poisearch/PoiMapAnalysis.java').read_text('utf-8')
          poi_vision = (java / 'poisearch/PoiMapVisionClient.java').read_text('utf-8')
          poi_spatial = (java / 'poisearch/PoiSpatialSearchEngine.java').read_text('utf-8')
          poi_list = (java / 'database/PoiListActivity.java').read_text('utf-8')
          database_management = (java / 'database/DatabaseManagementActivity.java').read_text('utf-8')
          database = (java / 'database/LocationDatabase.java').read_text('utf-8')
          cloud = (java / 'GoogleDriveDatabaseCloud.java').read_text('utf-8')
          igo = (java / 'IgoKmlWriter.java').read_text('utf-8')
          gradle = (root / 'app/build.gradle.kts').read_text('utf-8')
          settings = (root / 'settings.gradle.kts').read_text('utf-8')
          strings = (root / 'app/src/main/res/values/strings.xml').read_text('utf-8')
          manifest_path = root / 'app/src/main/AndroidManifest.xml'
          manifest = manifest_path.read_text('utf-8')
          alltext = '\n'.join(
              p.read_text('utf-8', errors='replace')
              for p in root.rglob('*')
              if p.is_file() and p.name != 'project.tar.gz'
          )

          def section(src, start, end):
              assert start in src, start
              tail = src.split(start, 1)[1]
              assert end in tail, end
              return tail.split(end, 1)[0]

          def balanced(src, path):
              stack = []
              state = 'code'
              quote = ''
              i = 0
              pairs = {')': '(', ']': '[', '}': '{'}
              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          state = 'line'; i += 2; continue
                      if c == '/' and n == '*':
                          state = 'block'; i += 2; continue
                      if c in ('"', "'"):
                          state = 'string'; quote = c; i += 1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}':
                          assert stack and stack.pop() == pairs[c], (path, i, c)
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 2; continue
                  elif state == 'string':
                      if c == '\\': i += 2; continue
                      if c == quote: state = 'code'
                  i += 1
              assert state not in ('block', 'string'), (path, state)
              assert not stack, (path, stack[-10:])

          for path in list(root.rglob('*.java')) + list(root.rglob('*.kt')) + list(root.rglob('*.kts')):
              balanced(path.read_text('utf-8'), path)
          ET.parse(manifest_path)

          # Egységes verzióléptetés.
          assert 'versionCode = 58' in gradle
          assert 'versionName = "058"' in gradle
          assert 'DriverAssistV058' in settings
          assert 'private static final String VERSION = "V058";' in main
          assert 'private static final String VERSION = "V058";' in service
          assert 'static final String PREFS = "driver_assist_v058";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {57, 56, 55, 54, 53, 52, 51, 50, 49' in main
          assert 'migration_v058_done' in main
          assert 'Driver Assist V058' in strings
          previous_upper = 'V' + str(57).zfill(3)
          previous_lower = 'v' + str(57).zfill(3)
          assert previous_upper not in alltext and previous_lower not in alltext

          # A főképernyő és a keresési/fuvarbeolvasási menü korábbi javításai maradnak.
          ui = section(main, 'private void buildUi()', 'private void applySamsungNavigationBarClearance')
          assert '"KERESÉS"' in ui and 'showSearchMenu()' in ui
          assert 'addressSearchEditor = null;' in ui

          # V058 főképernyő: telefonon közös görgetés, kompakt útvonalpontok,
          # kék felhőgombok, fél széles törlés/navigáció és beállításokba tett adatbázis.
          wide_layout = section(main, 'private boolean useWideLandscapeLayout()', 'private TextView createScreenTitle(')
          assert 'smallestScreenWidthDp >= 600' in wide_layout
          assert 'screenWidthDp >= 700' not in wide_layout
          for required in [
              'createRouteSectionDivider()',
              '"↑ FELHŐBE\\nMENTÉS"',
              '"↓ FELHŐBŐL\\nBETÖLTÉS"',
              '"TÖRLÉS /\\nÚJ KEZDÉS"',
              '"KÜLDÉS\\nNAVIGÁCIÓRA"',
              'showNavigationMenu()',
              'igoButton = null;',
              'actionColumn.addView(settingsButton, buttonParams())'
          ]:
              assert required in ui, required
          assert 'createLabel("ÚTVONALPONTOK:")' not in ui
          assert 'createTwoButtonRow(finishButton, igoButton)' not in ui
          navigation_menu = section(main, 'private void showNavigationMenu()', 'private void showSettingsMenu()')
          for required in ['TOMTOM INDÍTÁSA', 'KÜLDÉS iGO-RA', 'openVerifiedRoute()', 'exportCurrentRouteToIgo()']:
              assert required in navigation_menu, required
          settings_menu = section(main, 'private void showSettingsMenu()', 'private void migrateFromPreviousVersion()')
          assert 'ADATBÁZIS-KEZELÉS' in settings_menu
          assert 'DatabaseManagementActivity.class' in settings_menu
          route_sizes = section(main, 'private LinearLayout.LayoutParams routeArrowParams()', 'private LinearLayout.LayoutParams routeRowParams()')
          assert route_sizes.count('dp(42)') == 3
          assert 'dp(58)' not in route_sizes
          inset = section(main, 'private void applySamsungNavigationBarClearance(', 'private LinearLayout createTwoButtonRow(')
          for required in ['WindowInsets.Type.statusBars()', 'statusTop', 'safeTop = statusTop +']:
              assert required in inset, required
          search_menu = section(main, 'private void showSearchMenu()', 'private void focusSearchEditor()')
          for required in [
              'SZÖVEGES KERESÉS – POI / CÍM',
              'POI KERESÉS – EGYEDI',
              'TÉRKÉPEN KERESÉS',
              'FUVARFELADAT SZKENNELÉSE',
              'FUVAR BEOLVASÁSA',
              'if (query.isBlank())',
              'focusSearchEditor();'
          ]:
              assert required in search_menu, required
          text_button = section(search_menu, 'Button textSearch', 'Button mapSearch')
          assert text_button.index('if (query.isBlank())') < text_button.index('dialogHolder[0].dismiss();')
          freight = section(main, 'private void showFreightScanMenu()', 'private void openGeneralAddressSearch()')
          for required in ['KÉPERNYŐFOTÓ ALKALMAZÁSA', 'AKTUÁLIS KÉPERNYŐ BEOLVASÁSA']:
              assert required in freight, required
          assert 'floatingButton.setText("SCAN")' in service

          # Egyetlen közös útvonalpont-beszúrási kapu.
          for required in [
              'ACTION_REQUEST_ROUTE_INSERTION',
              'public static void requestRouteInsertion(',
              'showRouteInsertionPositionDialog(',
              'private boolean insertGeneralPlaceAt('
          ]:
              assert required in main, required
          assert main.count('insertGeneralPlaceAt(') == 2, main.count('insertGeneralPlaceAt(')
          assert 'public static int routePointCount(' not in main
          assert 'public static boolean insertRoutePointFromPoi(' not in main
          assert 'private static ArrayList<RouteEntry> readStoredRouteEntries(' not in main
          assert 'private static void writeStoredRouteEntries(' not in main

          incoming = section(main, 'if (ACTION_REQUEST_ROUTE_INSERTION.equals(intent.getAction()))', 'if (ACTION_IMPORT_MAPS_CLIPBOARD.equals(intent.getAction()))')
          assert 'showRouteInsertionPositionDialog(' in incoming
          assert 'insertGeneralPlaceAt(' not in incoming

          captured = section(main, 'private void approveCapturedMapPoint(', 'private void savePlaceToRoute(')
          new_point = section(captured, 'if (newPoint) {', 'SharedPreferences preferences =')
          assert 'showRouteInsertionPositionDialog(' in new_point
          assert 'insertGeneralPlaceAt(' not in new_point
          assert 'KEY_PENDING_INSERT_POSITION' not in new_point

          scan_result = section(main, 'private void showScannedResolvedPlaceDialog(', 'private void showScannedAddressMapFallback(')
          assert 'showRouteInsertionPositionDialog(' in scan_result
          assert 'insertGeneralPlaceAt(' not in scan_result

          general_results = section(main, 'private void showGeneralDatabaseResults(', 'private String insertionPositionLabel(')
          assert 'showRouteInsertionPositionDialog(' in general_results
          assert 'insertGeneralPlaceAt(' not in general_results
          assert 'selectedInsertPosition' not in general_results

          poi_route = section(poi_search, 'private void addPoiAsWaypoint(', 'private void startSearch()')
          assert 'MainActivity.requestRouteInsertion(' in poi_route
          for forbidden in ['MainActivity.routePointCount(', 'MainActivity.insertRoutePointFromPoi(', 'Hanyadik útvonalpont legyen?', 'selectedPosition[0]']:
              assert forbidden not in poi_route, forbidden

          # A közös beszúrási ablak pozíciót kér, előnézetet mutat és a Samsung navigációs sáv fölött marad.
          insertion_dialog = section(main, 'private void showRouteInsertionPositionDialog(', 'private void finishMapActionWithoutClearingPoint(')
          for required in [
              'showRouteInsertionPreview(place, position)',
              'clearRouteInsertionPreview()',
              'placeRouteInsertionDialogAboveNavigation(positionDialog)',
              'currentNavigationBarInset() + dp(8)',
              'Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL',
              'attributes.dimAmount = 0.18f',
              'Color.rgb(67, 132, 96)',
              '"◀ ELŐRÉBB"',
              '"HÁTRÉBB ▶"',
              '"JÓVÁHAGYÁS"',
              '"MÉGSE"'
          ]:
              assert required in insertion_dialog, required
          assert 'Hanyadik útvonalpont legyen?' not in insertion_dialog
          route_list = section(main, 'private void rebuildRoutePointList(', 'private Button createRouteArrowButton(')
          for required in ['routeInsertionPreviewPlace', 'addRouteInsertionPreviewRow(', '"↓ IDE KERÜL: "', 'scrollRouteInsertionPreviewIntoView()']:
              assert required in main, required
          assert 'addRouteInsertionPreviewRow(' in route_list

          # Az új pont ténylegesen csak a közös jóváhagyás után írható az útvonalba.
          central_insert = section(main, 'private boolean insertGeneralPlaceAt(', 'private ArrayList<ReviewPoint> buildReviewPoints(')
          for required in [
              'readOrderedRouteEntries(preferences)',
              'entries.add(position, routeEntryFromPlace(place, warning))',
              'writeOrderedRouteEntries(preferences, entries)',
              'LocationDatabase.AUTO_MERGE_METERS',
              'return true;'
          ]:
