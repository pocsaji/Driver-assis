          # Egyetlen közös POI-mentési és 20 méteres összevonási motor.
          assert 'public static final double AUTO_MERGE_METERS = 20.0;' in database
          save_engine = section(database, 'public PoiSaveResult savePoiMerged(', 'public long insertConfirmedPoi(')
          for required in [
