      - name: Audit Driver Assist V002 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          paths = sorted(java_root.glob('*.java'))
          assert len(paths) == 6, paths
          for path in paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist;'), path
              assert source.rstrip().endswith('}'), path
              assert source.count('{') == source.count('}'), path
              assert 'hu.pocsaji.tomtomkiszolgalo' not in source, path

          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          settings = Path('settings.gradle.kts').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')
          main = (java_root / 'MainActivity.java').read_text(encoding='utf-8')
          service = (java_root / 'TomTomAccessibilityService.java').read_text(encoding='utf-8')
          vision = (java_root / 'OpenAiVisionClient.java').read_text(encoding='utf-8')

          assert 'versionCode = 2' in gradle
          assert 'versionName = "002"' in gradle
          assert 'DriverAssistV002' in settings
          assert 'Driver Assist V002' in manifest
          assert 'Driver Assist V002' in strings
          assert 'private static final String VERSION = "V002";' in main
          assert 'static final String PREFS = "driver_assist_v002";' in main
          assert '47.578721 7.557428' in main
          assert 'Saint-Louis–Bázel határ' in main
          assert 'isBaselBorderWaypoint(value)' in main
          assert '47.578721 7.557428' in vision
          assert 'MainActivity.BASEL_BORDER_COORDINATE' in service
          assert 'TT_SEARCH_RESULT_FALLBACK_ATTEMPT = 14' in service
          assert 'tomTomNotBefore' in service
          assert 'scheduleTomTomStep(450L);' in service
          assert 'clickTomTomSearchResultCandidate()' in service
          assert 'A Hozzáadás gomb megjelenéséig várunk' in service
          assert 'tomTomStateAttempts >= 2' not in service
          assert service.count('public static boolean beginTomTomRoute(') == 1

          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          ET.parse('app/src/main/res/values/strings.xml')
          print('DRIVER_ASSIST_V002_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Driver Assist V002 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect Driver Assist V002 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V002.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V002.aab
          ls -lah artifact

      - name: Upload Driver Assist V002
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V002
          path: |
            artifact/Driver_Assist_V002.apk
            artifact/Driver_Assist_V002.aab
          if-no-files-found: error
