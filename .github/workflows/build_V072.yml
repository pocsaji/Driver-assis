      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V072 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V072 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V072.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V072.aab
          sha256sum artifact/Driver_Assist_V072.apk artifact/Driver_Assist_V072.aab \
            | tee artifact/Driver_Assist_V072_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V072
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V072
          path: |
            artifact/Driver_Assist_V072.apk
            artifact/Driver_Assist_V072.aab
            artifact/Driver_Assist_V072_SHA256.txt
          if-no-files-found: error
          retention-days: 14
