      - name: Audit Driver Assist V052 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          root = Path('.')
          java = root / 'app/src/main/java/hu/pocsaji/driverassist'
          main = (java / 'MainActivity.java').read_text('utf-8')
          service = (java / 'TomTomAccessibilityService.java').read_text('utf-8')
          simple_poi = (java / 'database/SimplePoiEditorDialog.java').read_text('utf-8')
          poi_search = (java / 'poisearch/PoiSearchActivity.java').read_text('utf-8')
          poi_analysis = (java / 'poisearch/PoiMapAnalysis.java').read_text('utf-8')
          poi_vision = (java / 'poisearch/PoiMapVisionClient.java').read_text('utf-8')
          poi_spatial = (java / 'poisearch/PoiSpatialSearchEngine.java').read_text('utf-8')
          poi_list = (java / 'database/PoiListActivity.java').read_text('utf-8')
          database = (java / 'database/LocationDatabase.java').read_text('utf-8')
          cloud = (java / 'GoogleDriveDatabaseCloud.java').read_text('utf-8')
          igo = (java / 'IgoKmlWriter.java').read_text('utf-8')
          gradle = (root / 'app/build.gradle.kts').read_text('utf-8')
          settings = (root / 'settings.gradle.kts').read_text('utf-8')
          manifest_path = root / 'app/src/main/AndroidManifest.xml'
          manifest = manifest_path.read_text('utf-8')
          alltext = '\n'.join(
              p.read_text('utf-8', errors='replace')
              for p in root.rglob('*')
              if p.is_file() and p.name != 'project.tar.gz'
          )
          
          def section(src, start, end):
              assert start in src, start
              tail = src.split(start, 1)[1]
              assert end in tail, end
              return tail.split(end, 1)[0]
          
          def balanced(src, path):
              stack = []
              state = 'code'
              quote = ''
              i = 0
              pairs = {')': '(', ']': '[', '}': '{'}
              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          state = 'line'; i += 2; continue
                      if c == '/' and n == '*':
                          state = 'block'; i += 2; continue
                      if c in ('"', "'"):
                          state = 'string'; quote = c; i += 1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}':
                          assert stack and stack.pop() == pairs[c], (path, i, c)
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 2; continue
                  elif state == 'string':
                      if c == '\\': i += 2; continue
                      if c == quote: state = 'code'
                  i += 1
              assert state not in ('block', 'string'), (path, state)
              assert not stack, (path, stack[-10:])
          
          for path in list(root.rglob('*.java')) + list(root.rglob('*.kt')) + list(root.rglob('*.kts')):
              balanced(path.read_text('utf-8'), path)
          ET.parse(manifest_path)
          
          # Kötelező, egységes verzióléptetés.
          assert 'versionCode = 52' in gradle
          assert 'versionName = "052"' in gradle
          assert 'DriverAssistV052' in settings
          assert 'private static final String VERSION = "V052";' in main
          assert 'private static final String VERSION = "V052";' in service
          assert 'static final String PREFS = "driver_assist_v052";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {51, 50, 49, 48' in main
          assert 'migration_v052_done' in main
          assert not re.search(r'(?i)\bv051\b|driver_assist_v051|DriverAssistV051', alltext)
          
          # Főképernyő: csak a KERESÉS gomb látható, a szövegmező az almenüben van.
          ui = section(main, 'private void buildUi()', 'private void applySamsungNavigationBarClearance')
          assert '"KERESÉS"' in ui and 'showSearchMenu()' in ui
          assert 'addressSearchEditor = null;' in ui
          for forbidden in [
              'CÍMKERESÉS – név, város vagy teljes cím',
              'CÍM / POI\\nKERESÉSE', 'POI\\nKERESÉSE',
              'ÚJ PONT\\nTÉRKÉPRŐL', 'KÖZTES PONT\\nTÉRKÉPRŐL',
              'CÍMEK ELLENŐRZÉSE'
          ]:
              assert forbidden not in ui, forbidden
          search_menu = section(main, 'private void showSearchMenu()', 'private void openGeneralAddressSearch()')
          for required in [
              'SZÖVEGES KERESÉS – név, város vagy teljes cím',
              'Cégnév, ország, irányítószám, város vagy utca',
              'KEY_GENERAL_SEARCH_QUERY',
              'POI KERESÉS', 'SZÖVEGES KERESÉS', 'TÉRKÉPEN KERESÉS',
              'openPoiSearch();', 'openGeneralAddressSearch();', 'openNewWaypoint();'
          ]:
              assert required in search_menu, required
          assert search_menu.index('createPointEditor(') < search_menu.index('"POI KERESÉS"')
          
          # Az önálló POI-kereső megmarad egyszerűsített formában.
          poi_ui = section(poi_search, 'private void buildUi()', 'private void loadCategories')
          for required in ['KÉPERNYŐFOTÓ', 'AKTUÁLIS KÉPERNYŐ', 'POI-KATEGÓRIA', 'Keresési sáv: 5 km', 'POI-K KERESÉSE']:
              assert required in poi_ui, required
          for forbidden in ['KÉZI POI-KERESÉS AZ ADATBÁZISBAN', 'Név, város, cím vagy megjegyzés', 'SZÖVEGES POI-KERESÉS', 'MÁSIK KÉP KIVÁLASZTÁSA']:
              assert forbidden not in poi_ui, forbidden
          
          # POI találat: térképes megnyitás vagy külön jóváhagyott útvonalpont.
          assert poi_search.count('.setPositiveButton("TÉRKÉP", null)') >= 2
          assert poi_search.count('.setNeutralButton("ÚTVONALPONT", null)') >= 2
          poi_route = section(poi_search, 'private void addPoiAsWaypoint(', 'private String routePositionLabel(')
          for required in [
              'MainActivity.routePointCount(this)',
              '◀ ELŐRÉBB', 'HÁTRÉBB ▶', 'JÓVÁHAGYÁS',
              'Hanyadik útvonalpont legyen?',
              'MainActivity.insertRoutePointFromPoi(',
              'selectedPosition[0]'
          ]:
              assert required in poi_route, required
          assert poi_route.count('"JÓVÁHAGYÁS"') == 1
          for required in ['public static int routePointCount(', 'public static boolean insertRoutePointFromPoi(', 'readStoredRouteEntries(', 'writeStoredRouteEntries(']:
              assert required in main, required
          
          # Térképi POI-mentés: rövidített név/kategória ablak, automatikus útvonalba rakás nélkül.
          open_editor = section(main, 'private void openSimplePoiEditor(', 'private LocationDatabase.PoiRecord findExistingPoiForMapSave(')
          assert 'SimplePoiEditorDialog.showCompactPoiSave(' in open_editor
          assert '"POI MENTÉSE"' in open_editor
          compact = section(simple_poi, 'public static void showCompactPoiSave(', 'private static String compactPlaceSummary(')
          for required in [
              'MENTÉS ELŐTT ELLENŐRIZD A POI NEVÉT',
              'POI neve – jóváhagyás vagy módosítás',
              'name.setSelectAllOnFocus(true)', 'Kategória',
              'HELYADATOK', 'A POI neve kötelező.'
          ]:
              assert required in compact, required
          for forbidden in ['"Ország"', '"Irányítószám"', '"Város"', '"Utca"', '"Házszám"', '"Szélesség"', '"Hosszúság"']:
              assert forbidden not in compact, forbidden
          persist = section(main, 'private void persistPoiSave(', 'private void showSavedPoiRouteQuestion(')
          for required in ['database.updatePoi(edited)', 'database.insertMapPoi(edited)', 'persisted = database.getPoi(id)', 'scheduleDatabaseDirtySync()', 'showSavedPoiRouteQuestion(persisted)']:
              assert required in persist, required
          assert 'savePlaceToRoute(' not in persist
          saved_question = section(main, 'private void showSavedPoiRouteQuestion(', 'private void showRouteInsertionPositionDialog(')
          for required in ['Hozzáadod ezt a pontot az útvonalhoz?', '.setPositiveButton("IGEN"', '.setNegativeButton("NEM"', 'returnToGoogleMapsAfterMapAction()']:
              assert required in saved_question, required
          route_position = section(main, 'private void showRouteInsertionPositionDialog(', 'private void finishMapActionWithoutClearingPoint(')
          for required in ['Hanyadik útvonalpont legyen?', '◀ ELŐRÉBB', 'HÁTRÉBB ▶', 'JÓVÁHAGYÁS', 'insertGeneralPlaceAt(', 'selectedPosition[0]']:
              assert required in route_position, required
          assert route_position.count('"JÓVÁHAGYÁS"') == 1
          
          # A videón látható maps.app.goo.gl hiba: a link mellett a Maps aktuális helyszövege is tartalék forrás.
          for required in [
              'KEY_PENDING_MAP_FALLBACK_QUERY',
              'captureCurrentGoogleMapsPlaceHint()',
              'collectGoogleMapsTextCandidates(',
              'scoreGoogleMapsPlaceHint(',
              'pendingEditor.putString(',
              'MainActivity.KEY_PENDING_MAP_FALLBACK_QUERY'
          ]:
              assert required in service, required
          resolve = section(main, 'private void resolveSharedPlace(', 'private SharedPlace resolveSharedGoogleMapsPlace(')
          for required in [
              'KEY_PENDING_MAP_FALLBACK_QUERY',
              'fallbackQuery',
              'geocodeStreetAddressWithGoogle(',
              'geocodeStreetAddressWithAndroid(',
              'coordinateFromAnyText(fallbackQuery)'
          ]:
              assert required in resolve, required
          android_geocode = section(main, 'private SharedPlace geocodeStreetAddressWithAndroid(', 'private SharedPlace geocodeGooglePlaceId(')
          for required in ['Geocoder.isPresent()', 'getFromLocationName(clean, 5)', 'address.hasLatitude()', 'address.hasLongitude()', 'new SharedPlace(']:
              assert required in android_geocode, required
          assert 'A megosztott Google Maps linkből nem sikerült biztos koordinátát kiolvasni.' in main
          
          # A térképi panel és a korábbi fő funkciók megmaradnak.
          for required in ['◀ ELŐZŐ', 'KÖVETKEZŐ ▶', 'JÓVÁHAGYÁS', 'MENTÉS POI-KÉNT', 'BEFEJEZÉS', 'triggerMapAction(']:
              assert required in service, required
          for required in ['DATABASE_REMOTE_PING_INTERVAL_MS = 60_000L', 'DATABASE_LOCAL_CHANGE_DEBOUNCE_MS = 3_500L', 'boolean remoteChanged', 'KEY_CLOUD_REMOTE_VERSION']:
              assert required in (main + '\n' + cloud + '\n' + database), required
          assert 'Intent.ACTION_OPEN_DOCUMENT_TREE' in main
          assert 'IgoKmlWriter.build(' in main
          assert '<Placemark>' in igo and '<Point>' in igo and '<LineString>' not in igo
          assert manifest.count('android:screenOrientation="user"') >= 4
          assert 'SimplePoiEditorDialog.showPoiSave(' in poi_list
          
          # A korábbi térképkép- és területi POI-keresési javítások maradjanak meg.
          for required in ['repairVisibleBounds(', 'normalizeRawBounds(', 'deriveBoundsFromEvidence(', 'expandCollapsedRawPoint(', 'boundsAroundPoint(', 'evidenceInsideBounds(']:
              assert required in poi_analysis, required
          for required in ['north mindig', 'azonos north/south', 'forgalmi útszínezése önmagában nem navigációs útvonal']:
              assert required in poi_vision, required
          for required in ['chooseAreaCenter(', 'boundsAroundPoint(', 'if (distance <= maximumMeters)', 'areaCenter.latitude', 'analysis.anchors']:
              assert required in poi_spatial, required
          
          print('DRIVER_ASSIST_V052_SOURCE_AUDIT_OK')
          PY_VERIFY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V052 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V052 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V052.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V052.aab
          sha256sum artifact/Driver_Assist_V052.apk artifact/Driver_Assist_V052.aab \
            | tee artifact/Driver_Assist_V052_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V052
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V052
          path: |
            artifact/Driver_Assist_V052.apk
            artifact/Driver_Assist_V052.aab
            artifact/Driver_Assist_V052_SHA256.txt
          if-no-files-found: error
          retention-days: 14
