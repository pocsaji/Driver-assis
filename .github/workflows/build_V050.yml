      - name: Audit Driver Assist V050 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path('.')
          java=root/'app/src/main/java/hu/pocsaji/driverassist'
          main=(java/'MainActivity.java').read_text('utf-8')
          service=(java/'TomTomAccessibilityService.java').read_text('utf-8')
          database=(java/'database/LocationDatabase.java').read_text('utf-8')
          simple_poi=(java/'database/SimplePoiEditorDialog.java').read_text('utf-8')
          poi_search=(java/'poisearch/PoiSearchActivity.java').read_text('utf-8')
          poi_analysis=(java/'poisearch/PoiMapAnalysis.java').read_text('utf-8')
          poi_vision=(java/'poisearch/PoiMapVisionClient.java').read_text('utf-8')
          poi_spatial=(java/'poisearch/PoiSpatialSearchEngine.java').read_text('utf-8')
          poi_list=(java/'database/PoiListActivity.java').read_text('utf-8')
          cloud=(java/'GoogleDriveDatabaseCloud.java').read_text('utf-8')
          igo=(java/'IgoKmlWriter.java').read_text('utf-8')
          gradle=(root/'app/build.gradle.kts').read_text('utf-8')
          settings=(root/'settings.gradle.kts').read_text('utf-8')
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          alltext='\n'.join(p.read_text('utf-8',errors='replace') for p in root.rglob('*') if p.is_file() and p.name != 'project.tar.gz')
          
          def balanced(src,path):
              stack=[]; state='code'; i=0; pairs={')':'(',']':'[','}':'{'}
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='code':
                      if c=='/' and n=='/': state='line'; i+=2; continue
                      if c=='/' and n=='*': state='block'; i+=2; continue
                      if c=='"': state='string'; i+=1; continue
                      if c=="'": state='char'; i+=1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}': assert stack and stack.pop()==pairs[c],(path,i,c)
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=2; continue
                  else:
                      if c=='\\': i+=2; continue
                      if (state=='string' and c=='"') or (state=='char' and c=="'"): state='code'
                  i+=1
              assert not stack,(path,stack)
          
