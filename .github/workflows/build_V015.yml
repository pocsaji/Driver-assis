      - name: Audit Driver Assist V015 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          base_paths = sorted(java_root.glob('*.java'))
          database_paths = sorted((java_root / 'database').glob('*.java'))
          poi_paths = sorted((java_root / 'poisearch').glob('*.java'))
          test_paths = sorted((root / 'app/src/test/java/hu/pocsaji/driverassist/poisearch').glob('*.java'))
          assert len(base_paths) == 7, base_paths
          assert len(database_paths) == 4, database_paths
          assert len(poi_paths) == 11, poi_paths
          assert len(test_paths) == 1, test_paths

          for path, package in [
              *[(p, 'package hu.pocsaji.driverassist;') for p in base_paths],
              *[(p, 'package hu.pocsaji.driverassist.database;') for p in database_paths],
              *[(p, 'package hu.pocsaji.driverassist.poisearch;') for p in poi_paths],
              *[(p, 'package hu.pocsaji.driverassist.poisearch;') for p in test_paths],
          ]:
              source = path.read_text('utf-8')
              assert source.startswith(package), path
              assert source.rstrip().endswith('}'), path

          gradle = (root/'app/build.gradle.kts').read_text('utf-8')
          settings = (root/'settings.gradle.kts').read_text('utf-8')
          manifest = (root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          strings = (root/'app/src/main/res/values/strings.xml').read_text('utf-8')
          accessibility = (root/'app/src/main/res/xml/accessibility_service_config.xml').read_text('utf-8')
          main = (java_root/'MainActivity.java').read_text('utf-8')
          vision = (java_root/'OpenAiVisionClient.java').read_text('utf-8')
          service = (java_root/'TomTomAccessibilityService.java').read_text('utf-8')
          cloud = (java_root/'GoogleDriveRouteCloud.java').read_text('utf-8')
          db_activity = (java_root/'database/DatabaseManagementActivity.java').read_text('utf-8')
          db_store = (java_root/'database/LocationDatabase.java').read_text('utf-8')
          transfer = (java_root/'database/DatabaseTransfer.java').read_text('utf-8')
          poi_list = (java_root/'database/PoiListActivity.java').read_text('utf-8')
          poi_activity = (java_root/'poisearch/PoiSearchActivity.java').read_text('utf-8')
          poi_client = (java_root/'poisearch/PoiMapVisionClient.java').read_text('utf-8')
          poi_analysis = (java_root/'poisearch/PoiMapAnalysis.java').read_text('utf-8')
          poi_spatial = (java_root/'poisearch/PoiSpatialSearchEngine.java').read_text('utf-8')
          poi_cache = (java_root/'poisearch/PoiSearchAnalysisCache.java').read_text('utf-8')
          poi_image = (java_root/'poisearch/PoiImageProcessor.java').read_text('utf-8')
          poi_test = test_paths[0].read_text('utf-8')
          all_project_text = '\n'.join(
              p.read_text('utf-8', errors='replace')
              for p in root.rglob('*') if p.is_file())

          # V015 identity and no accidental previous workflow identity.
          assert 'versionCode = 15' in gradle
          assert 'versionName = "015"' in gradle
          assert 'testImplementation("junit:junit:4.13.2")' in gradle
          assert 'DriverAssistV015' in settings
          assert 'Driver Assist V015' in manifest
          assert 'Driver Assist V015' in strings
          assert 'private static final String VERSION = "V015";' in main
          assert 'private static final String VERSION = "V015";' in service
          assert 'static final String PREFS = "driver_assist_v015";' in main
          assert 'migration_v015_done' in main
          assert ('V' + '014') not in all_project_text
          assert ('v' + '014') not in all_project_text

          # Robust migration: prefer actual route data and fall back through prior stored generations.
          for needle in [
              'PREVIOUS_PREFS_VERSIONS = {14, 13, 12, 11, 10}',
              'hasRouteValues(candidateValues)',
              'fallback == null && hasMigratableValues(candidateValues)',
              'String.format(Locale.ROOT, "driver_assist_v%03d", version)',
              'copyPreferences(source.getAll(), target)',
              'target.putBoolean("migration_v015_done", true).commit()',
          ]: assert needle in main, needle
          assert 'private static final String PREVIOUS_PREFS' not in main

          # Existing stable main functions remain.
          for needle in [
              '"TOMTOM\\nINDÍTÁS"', '"FELHŐBE\\nMENTÉS"', '"FELHŐBŐL\\nBETÖLTÉS"',
              'uploadCurrentRouteToCloud', 'downloadLatestRouteFromCloud',
              'requestDriveAuthorization', 'CLOUD_ACTION_UPLOAD', 'CLOUD_ACTION_DOWNLOAD',
              'getLaunchIntentForPackage(TOMTOM_PACKAGE)',
              'TomTomAccessibilityService.beginTomTomRoute(targets)',
              'startExternalRouteReview(0)', 'openNewWaypoint()',
              'showNearbyPoiDialog', 'reviewPlaceAgainstDatabase', 'openPoiComparisonMap',
              'NEARBY_POI_METERS = 300.0', 'NEARBY_POI_SCAN_LIMIT = 200',
              'NEARBY_POI_LIMIT = 50',
          ]: assert needle in main, needle
          assert 'PoiSearchActivity.class' in main
          assert '"POI\\nKERESÉSE"' in main
          assert re.search(r'createThreeButtonRow\(\s*resolveButton,\s*poiSearchButton,\s*waypointButton\)', main)
          assert 'public static boolean addWaypointFromPoi(' in main
          assert '.poisearch.PoiSearchActivity' in manifest

          # Existing OpenAI route reader remains isolated.
          assert 'public final class OpenAiVisionClient' in vision
          assert 'public static String apiKey(Context context)' in vision
          assert 'public static String model(Context context)' in vision
          for needle in ['pickup_company','pickup_location','delivery_company','delivery_location','combineCompanyAndLocation']:
              assert needle in vision

          # Import remains merge-only, without the destructive submenu.
          for forbidden in ['chooseImportMode', 'pendingReplaceAll', 'Importálási mód',
                            'Teljes csere', 'boolean replaceAll', 'if (replaceAll)']:
              assert forbidden not in db_activity + transfer + db_store, forbidden
          assert 'importButton.setOnClickListener(v -> openImportPicker())' in db_activity
          assert 'DatabaseTransfer.importFiles(this, database, uris);' in db_activity
          assert 'public ImportResult importRows(JSONArray rows)' in db_store
          assert 'EXTRA_ALLOW_MULTIPLE' in db_activity

          # Dynamic categories, Unicode preservation, indexed bounds query and candidate cap.
          assert 'DATABASE_VERSION = 3' in db_store
          assert 'idx_locations_category_coordinates' in db_store
          assert '(category, latitude, longitude)' in db_store
          assert 'LinkedHashMap<String, Integer> merged' in db_store
          assert 'getCategoryCounts(boolean coordinatesOnly)' in db_store
          assert 'findPoiCandidatesInBounds(' in db_store
          assert 'CategorySql categorySql = categorySql("category", category)' in db_store
          assert 'categorySql.clause' in db_store
          assert 'SELECT DISTINCT category' in db_store
          assert 'result.size() >= 50_000' in db_store
          assert '.replaceAll("[^\\\\p{L}\\\\p{N}]+", "_")' in db_store
          assert 'truck parking' in db_store and 'supermarket' in db_store
          assert 'database.getCategoryCounts(true)' in transfer
          assert 'database.getCategoryCounts(false)' in db_activity
          assert 'database.getCategoryCounts(false)' in poi_list
          assert 'private static final String[] CATEGORIES' not in transfer

          # Standalone UI and interchangeable providers.
          for needle in [
              'KÉPERNYŐKÉP ALAPÚ POI-KERESÉS', 'KÉPERNYŐFOTÓ BEILLESZTÉSE',
              'AKTUÁLIS KÉPERNYŐ BEOLVASÁSA', 'MÁSIK KÉP KIVÁLASZTÁSA',
              'Keresési sáv: 5 km', 'POI-K KERESÉSE',
              'A térképi képernyőfotót a program földrajzi értelmezés céljából elküldi',
              'A POI-adatbázis helyben marad',
              'A találatok a képernyőképből becsült útvonal alapján készültek.',
              'A képen nem volt egyértelmű útvonal; a teljes látható térségben történt a keresés.',
              'Túl sok találat. Csökkentsd a keresési távolságot',
              'GOOGLE MAPS', 'KÖZTES PONTKÉNT',
          ]: assert needle in poi_activity, needle
          assert 'Intent.ACTION_OPEN_DOCUMENT' in poi_activity
          assert 'intent.setType("image/*")' in poi_activity
          assert 'distanceSeek.setMin(1)' in poi_activity and 'distanceSeek.setMax(10)' in poi_activity
          assert 'distanceSeek.setProgress(5)' in poi_activity
          assert 'new GalleryScreenshotProvider(uri)' in poi_activity
          assert 'new AccessibilityScreenshotProvider' in poi_activity
          assert 'currentAnalysis != null' in poi_activity
          assert 'runLocalSearch(currentAnalysis' in poi_activity
          assert 'ExecutorService' in poi_activity and 'shutdownNow()' in poi_activity
          assert 'KEY_PICKUP' not in poi_activity and 'KEY_DELIVERY' not in poi_activity

          # Real cancellation disconnects the active HTTP request.
          for needle in [
              'public static final class AnalysisCall',
              'public void cancel()',
              'active.disconnect()',
              'checkCancelled()',
              'InterruptedIOException',
              'AtomicReference<PoiMapVisionClient.AnalysisCall>',
              'activeVisionCall.getAndSet(null)',
              'activeVisionCall.compareAndSet(call, null)',
          ]: assert needle in poi_client + poi_activity, needle
          assert 'call = PoiMapVisionClient.newCall' in poi_activity
          assert 'call.execute()' in poi_activity

          # Cache accepts only validated useful analyses; cache I/O cannot invalidate a successful API result.
          assert 'SCHEMA_VERSION = 2' in poi_cache
          assert 'PROMPT_VERSION = "poi_map_prompt_v2"' in poi_cache
          assert 'analysis.isCacheable()' in poi_cache
          assert 'MAX_CACHE_FILES = 32' in poi_cache
          assert 'MAX_AGE_MILLIS' in poi_cache
          assert 'Files.readString' not in poi_cache
          assert 'Files.writeString' not in poi_cache
          assert 'Files.readAllBytes' not in poi_cache
          assert 'Files.write(' not in poi_cache
          analyze_block = poi_activity.split('private void analyzeThenSearch', 1)[1].split('private void handleAnalysis', 1)[0]
          assert analyze_block.index('analysis.validate()') < analyze_block.index('analysisCache.write')
          assert 'catch (Exception ignored)' in analyze_block
          assert 'A gyorsítótár opcionális' in analyze_block

          # Stricter geographic validation and explicit confirmation without strong visible anchors.
          for needle in [
              'MAX_VISIBLE_DIAGONAL_KM = 750.0',
              'MAX_ROUTE_SEGMENT_KM = 450.0',
              'MAX_ROUTE_TOTAL_KM = 1800.0',
              'hasStrongAnchorEvidence()',
              '!visibleBounds.containsWithMargin',
              'A becsült útvonalpontok között túl nagy vagy hibás ugrás',
              'A térképi horgonypont kívül esik',
              'countryCode.matches("[A-Z]{2}")',
              'overallConfidence < 0.65 || !hasStrongAnchorEvidence()',
          ]: assert needle in poi_analysis, needle
          assert 'Térség megerősítése' in poi_activity
          assert 'analysis.evidenceSummary()' in poi_activity
          assert 'A képernyőkép földrajzi helye nem azonosítható elég biztosan.' in poi_activity

          # Memory-bounded image decoding.
          for needle in [
              'MAX_LONG_SIDE = 1900', 'MAX_DECODE_LONG_SIDE = 2600',
              'MAX_INPUT_PIXELS = 50_000_000L', 'JPEG_QUALITY = 87',
              'calculateSample(width, height, MAX_DECODE_LONG_SIDE)',
              'OutOfMemoryError', 'inSampleSize', 'ExifInterface',
              'cropSystemBarsIfLikely', 'Bitmap.CompressFormat.JPEG', 'SHA-256',
          ]: assert needle in poi_image, needle
          assert 'MAX_LONG_SIDE * 2' not in poi_image
          assert 'READ_EXTERNAL_STORAGE' not in manifest

          # Accessibility capture remains isolated from route capture.
          assert 'CAPTURE_ROUTE = 1' in service
          assert 'CAPTURE_POI_SEARCH = 3' in service
          assert 'PoiSearchCaptureStore.isActive(this)' in service
          assert 'startPoiSearchCapture()' in service
          assert 'floatingButton.setText("POI")' in service
          assert 'storePoiSearchScreenshot' in service
          assert 'captureMode == CAPTURE_POI_SEARCH' in service
          assert 'captureMode = CAPTURE_ROUTE' in service
          assert 'takeScreenshot(' in service
          assert 'android:canTakeScreenshot="true"' in accessibility
          assert 'PoiSearchCaptureStore.complete' in service
          assert 'PoiSearchCaptureStore.fail' in service

          # Strict one-shot OpenAI image analysis.
          assert 'https://api.openai.com/v1/responses' in poi_client
          assert poi_client.count('openConnection()') == 1
          assert '"input_image"' in poi_client and '"image_url"' in poi_client
          assert '.put("type", "json_schema")' in poi_client
          assert '.put("strict", true)' in poi_client
          assert poi_client.count('.put("additionalProperties", false)') >= 4
          assert '.put("maxItems", 24)' in poi_client
          assert 'Ne találj ki nem látható helynevet' in poi_client

          # Local point-to-segment search and critical regression tests exist.
          for needle in [
              'distancePointToSegmentMeters', 'distanceToRouteMeters',
              'boundsForPoints', 'findPoiCandidatesInBounds',
              'projection = Math.max(0.0, Math.min(1.0, projection))',
              'distance <= maximumMeters', 'RESULT_LIMIT = 100',
          ]: assert needle in poi_spatial + poi_activity, needle
          for needle in [
              'strongValidatedRouteCanProceedAutomatically',
              'routeWithoutStrongVisibleAnchorNeedsConfirmation',
              'continentSizedBoundsAreRejected',
              'distanceIsMeasuredToSegmentNotOnlyEndpoints',
              'unicodeCustomCategoryIsPreserved',
          ]: assert needle in poi_test, needle

          # Legacy service/cloud automation remains.
          for needle in [
              'public static boolean beginTomTomRoute(', 'TT_WAIT_TOMTOM_READY = 1',
              'TT_CLEAR_EXISTING_ROUTE = 2', 'TT_STARTUP_TIMEOUT_MS = 90000L',
              'ensureTomTomLaunched', 'isTomTomInterfaceReady',
              'clickTomTomRouteClearControl', 'result.pickupCompany',
              'result.deliveryCompany', 'TT_SEARCH_RESULT_FALLBACK_ATTEMPT = 14',
          ]: assert needle in service, needle
          for needle in ['DRIVE_APPDATA_SCOPE','appDataFolder','uploadLatest','downloadLatest','MAX_KEPT_FILES = 5']:
              assert needle in cloud, needle

          ET.parse(root/'app/src/main/AndroidManifest.xml')
          ET.parse(root/'app/src/main/res/xml/accessibility_service_config.xml')
          ET.parse(root/'app/src/main/res/values/strings.xml')
          print('DRIVER_ASSIST_V015_SOURCE_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V015 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V015 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V015.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V015.aab
          sha256sum artifact/Driver_Assist_V015.apk artifact/Driver_Assist_V015.aab \
            | tee artifact/Driver_Assist_V015_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V015
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V015
          path: |
            artifact/Driver_Assist_V015.apk
            artifact/Driver_Assist_V015.aab
            artifact/Driver_Assist_V015_SHA256.txt
          if-no-files-found: error
          retention-days: 14
