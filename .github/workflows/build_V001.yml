          grep -F 'private static final String VERSION = "V001";' "$SERVICE"
          grep -F 'hu.pocsaji.driverassist' "$ACCESS"
          grep -F 'FLOATING_BUTTON_SIZE_DP = 62' "$SERVICE"
          grep -F 'FLOATING_BUTTON_BOTTOM_CLEARANCE_DP = 88' "$SERVICE"
          grep -F 'floatingParams.gravity = Gravity.END | Gravity.BOTTOM;' "$SERVICE"
          grep -F 'floatingButton.setText("SCAN")' "$SERVICE"
          grep -F 'floatingButton.setText("MAP")' "$SERVICE"
          grep -F 'floatingButton.setText("TT")' "$SERVICE"
          grep -F 'isMapReviewActive() && googleMapsVisible' "$SERVICE"
          grep -F 'clearMapReviewForTomTom();' "$SERVICE"
          grep -F 'if (tomTomStateAttempts >= 3)' "$SERVICE"
          grep -F 'tomTomNextRunAt' "$SERVICE"
          grep -F 'scheduleTomTomStep(180L);' "$SERVICE"
          grep -F 'tomTomReverseIndex = tomTomRoute.size() - 2;' "$SERVICE"
          grep -F 'Locale.US, "%.6f %.6f"' "$SERVICE"
          grep -F 'android:canPerformGestures="true"' "$ACCESS"

          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          java_root = Path('app/src/main/java/hu/pocsaji/driverassist')
          paths = list(java_root.glob('*.java'))
          assert len(paths) == 6, paths
          for path in paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist;'), path
              assert source.rstrip().endswith('}'), path
              assert source.count('{') == source.count('}'), path
              assert 'hu.pocsaji.tomtomkiszolgalo' not in source, path

          main = (java_root / 'MainActivity.java').read_text(encoding='utf-8')
          service = (java_root / 'TomTomAccessibilityService.java').read_text(encoding='utf-8')
          assert 'static final String PREFS = "driver_assist_v001";' in main
          assert 'TomTomAccessibilityService.beginTomTomRoute(targets)' in main
          assert 'showReviewPanel = tomTomState == TT_IDLE &&' in service
          assert 'isMapReviewActive() && googleMapsVisible' in service
          assert 'mode = "tomtom";' in service
          assert 'mode = googleMapsVisible ? "maps" : "review_paused";' in service
          assert 'openReviewPoint(index, points);' in service
          assert 'startY - Math.round(dy)' in service
          assert 'minY = dp(72)' in service
          assert 'if (tomTomStateAttempts >= 3)' in service
          assert 'target >= tomTomNextRunAt - 20L' in service
          assert service.count('public static boolean beginTomTomRoute(') == 1
          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          ET.parse('app/src/main/res/values/strings.xml')
          print('DRIVER_ASSIST_V001_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Driver Assist V001 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect Driver Assist V001 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V001.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V001.aab
          ls -lah artifact

      - name: Upload Driver Assist V001
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V001
          path: |
            artifact/Driver_Assist_V001.apk
            artifact/Driver_Assist_V001.aab
          if-no-files-found: error
