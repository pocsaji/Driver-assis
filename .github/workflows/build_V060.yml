              assert start in src, start
              tail = src.split(start, 1)[1]
              assert end in tail, end
              return tail.split(end, 1)[0]

          def balanced(src, path):
              stack = []
              state = 'code'
              quote = ''
              i = 0
              pairs = {')': '(', ']': '[', '}': '{'}
              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          state = 'line'; i += 2; continue
                      if c == '/' and n == '*':
                          state = 'block'; i += 2; continue
                      if c in ('"', "'"):
                          state = 'string'; quote = c; i += 1; continue
                      if c in '([{': stack.append(c)
                      elif c in ')]}':
                          assert stack and stack.pop() == pairs[c], (path, i, c)
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 2; continue
                  elif state == 'string':
                      if c == '\\': i += 2; continue
                      if c == quote: state = 'code'
                  i += 1
              assert state not in ('block', 'string'), (path, state)
              assert not stack, (path, stack[-10:])

