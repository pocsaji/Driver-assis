              private void refreshStatus() {
                  if (statusText == null) return;
                  String login = TomTomCredentialStore.hasCredentials(this)
                          ? "TomTom-adatok elmentve"
                          : "TomTom-adatok még nincsenek megadva";
                  if (generatedGpxUri != null) {
                      statusText.setText(login + " • GPX kész: " +
                              displayGpxName());
                  } else {
                      statusText.setText(login);
                  }
              }

              private String displayGpxName() {
                  return generatedGpxFileName.isEmpty()
                          ? "a létrehozott GPX"
                          : generatedGpxFileName;
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQUEST_FILE ||
                          pendingFileCallback == null) {
                      return;
                  }
                  Uri[] result = null;
                  if (resultCode == RESULT_OK && data != null &&
                          data.getData() != null) {
                      result = new Uri[]{data.getData()};
                  }
                  pendingFileCallback.onReceiveValue(result);
                  pendingFileCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (pendingFileCallback != null) {
                      pendingFileCallback.onReceiveValue(null);
                      pendingFileCallback = null;
                  }
                  CookieManager.getInstance().flush();
                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }

              private int dp(int value) {
                  return Math.round(
                          value * getResources().getDisplayMetrics().density);
              }
          }
