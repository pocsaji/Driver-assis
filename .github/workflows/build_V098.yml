                      Toast.makeText(this,
                              "Nincs kijelölt felrakó, lerakó vagy köztes pont.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  editor.remove(MainActivity.KEY_PENDING_TARGET)
                          .remove(MainActivity.KEY_PENDING_INDEX)
                          .remove(MainActivity.KEY_PENDING_QUERY)
                          .putInt(MainActivity.KEY_REVIEW_CURSOR, 0)
                          .apply();

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);

                  Toast.makeText(this,
                          "Koordináta beillesztve: " + coordinate,
                          Toast.LENGTH_LONG).show();
              }

              private List<String> cleanStoredLines(String value) {
                  ArrayList<String> lines = new ArrayList<>();
                  if (value == null || value.isBlank()) return lines;

                  for (String line : value.split("\\r?\\n")) {
                      String clean = line.trim();
                      if (!clean.isEmpty()) lines.add(clean);
                  }
                  return lines;
              }

              private void startMapShareFlow() {
                  if (!processing.compareAndSet(false, true)) return;

                  updateFloatingButton();

                  AccessibilityNodeInfo share = findControlInAllWindows(
                          "MEGOSZTÁS",
                          "SHARE",
                          "PARTAGER",
                          "TEILEN",
                          "CONDIVIDI",
                          "COMPARTIR");
                  if (share == null || !clickNodeOrAncestor(share)) {
                      if (share != null) share.recycle();
                      Toast.makeText(this,
                              "A Google Maps Megosztás gombja nem található. " +
                              "Nyisd meg a hely teljes adatlapját, majd próbáld újra.",
                              Toast.LENGTH_LONG).show();
                      finishProcessing();
                      return;
                  }
                  share.recycle();

                  shareCopyActive = true;
                  shareCopyAttempts = 0;
                  Toast.makeText(this,
                          "A helylink másolása és a koordináta visszahozása folyamatban…",
                          Toast.LENGTH_SHORT).show();
                  scheduleShareCopySelection(450L);
              }

              private void scheduleShareCopySelection(long delayMs) {
                  if (!shareCopyActive || shareCopyStepScheduled) return;
                  shareCopyStepScheduled = true;
                  handler.postDelayed(() -> {
                      shareCopyStepScheduled = false;
                      tryCopySharedMapLink();
                  }, delayMs);
              }

              private void tryCopySharedMapLink() {
                  if (!shareCopyActive) return;

                  AccessibilityNodeInfo activeRoot = getRootInActiveWindow();
                  if (activeRoot == null || activeRoot.getPackageName() == null) {
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;
                      finishProcessing();
                      return;
                  }
                  String activePackage = activeRoot.getPackageName().toString();
                  activeRoot.recycle();
                  if (!GOOGLE_MAPS_PACKAGE.equals(activePackage) &&
                          !isShareUiPackage(activePackage)) {
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;
                      finishProcessing();
                      return;
                  }

                  shareCopyAttempts++;
                  AccessibilityNodeInfo copyLink = findControlInAllWindows(
                          "LINK MÁSOLÁSA",
                          "HIVATKOZÁS MÁSOLÁSA",
                          "MÁSOLÁS VÁGÓLAPRA",
                          "MÁSOLÁS",
                          "COPY LINK",
                          "COPY TO CLIPBOARD",
                          "COPIER LE LIEN",
                          "COPIER",
                          "LINK KOPIEREN",
                          "KOPIEREN");

                  if (copyLink != null && clickNodeOrAncestor(copyLink)) {
                      copyLink.recycle();
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;

                      handler.postDelayed(() -> {
                          Intent intent = new Intent(this, MainActivity.class);
                          intent.setAction(MainActivity.ACTION_IMPORT_MAPS_CLIPBOARD);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP |
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(intent);
                          finishProcessing();
                      }, 650L);
                      return;
                  }
                  if (copyLink != null) copyLink.recycle();

                  if (shareCopyAttempts < 16) {
                      scheduleShareCopySelection(300L);
                      return;
                  }

                  shareCopyActive = false;
                  shareCopyStepScheduled = false;
                  Toast.makeText(this,
                          "A Link másolása gombot nem találtam. " +
                          "A megosztási ablakban nyomd meg kézzel a Link másolása/Másolás gombot, " +
                          "majd nyisd meg újra a TomTom Kiszolgálót.",
                          Toast.LENGTH_LONG).show();
                  finishProcessing();
              }

              private AccessibilityNodeInfo findControlInAllWindows(
                      String... keywords) {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return null;

                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;
                      try {
                          CharSequence packageValue = root.getPackageName();
                          String packageName = packageValue == null
                                  ? "" : packageValue.toString();
                          if (!GOOGLE_MAPS_PACKAGE.equals(packageName) &&
                                  !isShareUiPackage(packageName)) {
                              continue;
                          }
                          AccessibilityNodeInfo found = findControlRecursive(
                                  root, keywords);
                          if (found != null) return found;
                      } finally {
                          root.recycle();
                      }
                  }
                  return null;
              }

              private boolean isShareUiPackage(String packageName) {
                  if (packageName == null) return false;
                  String lower = packageName.toLowerCase(Locale.ROOT);
                  return "android".equals(lower) ||
                          lower.contains("intentresolver") ||
                          lower.contains("resolver") ||
                          lower.contains("sharesheet") ||
                          lower.contains("sharelive") ||
                          lower.contains("systemui");
              }

              private AccessibilityNodeInfo findControlRecursive(
                      AccessibilityNodeInfo node,
                      String... keywords) {
                  if (node == null) return null;

                  String combined = clean(
                          String.valueOf(node.getText()) + " " +
                          String.valueOf(node.getContentDescription()) + " " +
                          String.valueOf(node.getHintText()));
                  String normalizedCombined = normalized(combined);

                  for (String keyword : keywords) {
                      if (normalizedCombined.contains(normalized(keyword))) {
                          return AccessibilityNodeInfo.obtain(node);
                      }
                  }

                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          AccessibilityNodeInfo found = findControlRecursive(
                                  child, keywords);
                          if (found != null) return found;
                      } finally {
                          child.recycle();
                      }
                  }
                  return null;
              }

              private boolean clickNodeOrAncestor(
                      AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current =
                          AccessibilityNodeInfo.obtain(node);
                  try {
                      for (int depth = 0; depth < 8 && current != null; depth++) {
                          if (current.isClickable() &&
                                  current.performAction(
                                          AccessibilityNodeInfo.ACTION_CLICK)) {
                              return true;
                          }

                          AccessibilityNodeInfo parent = current.getParent();
                          current.recycle();
                          current = parent;
                      }
                      return false;
                  } finally {
                      if (current != null) current.recycle();
                  }
              }

              private void captureScreenshot() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      handleLines(readVisibleLines(null));
                      return;
                  }

                  takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          getMainExecutor(),
                          new TakeScreenshotCallback() {
                              @Override
                              public void onSuccess(ScreenshotResult screenshot) {
                                  recognizeScreenshot(screenshot);
                              }

                              @Override
                              public void onFailure(int errorCode) {
                                  handleLines(readVisibleLines(null));
                              }
                          });
              }

              private void recognizeScreenshot(ScreenshotResult screenshot) {
                  HardwareBuffer buffer = screenshot.getHardwareBuffer();
                  Bitmap hardwareBitmap = null;
                  Bitmap bitmap = null;
                  try {
                      hardwareBitmap = Bitmap.wrapHardwareBuffer(
                              buffer, screenshot.getColorSpace());
                      if (hardwareBitmap != null) {
                          bitmap = hardwareBitmap.copy(Bitmap.Config.ARGB_8888, false);
                      }
                  } catch (RuntimeException ignored) {
                  } finally {
                      if (hardwareBitmap != null) hardwareBitmap.recycle();
                      buffer.close();
                  }

                  if (bitmap == null) {
                      handleLines(readVisibleLines(null));
                      return;
                  }

                  final Bitmap finalBitmap = bitmap;
                  InputImage image = InputImage.fromBitmap(finalBitmap, 0);
                  Task<Text> task = textRecognizer.process(image);
                  task.addOnSuccessListener(this::handleRecognizedText)
                          .addOnFailureListener(error ->
                                  handleLines(readVisibleLines(null)))
                          .addOnCompleteListener(done -> finalBitmap.recycle());
              }

              private void handleRecognizedText(Text visionText) {
                  List<OcrLine> positioned = new ArrayList<>();
                  for (Text.TextBlock block : visionText.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          String value = clean(line.getText());
                          Rect box = line.getBoundingBox();
                          if (!value.isEmpty() && box != null) {
                              positioned.add(new OcrLine(value, box.top, box.left));
                          }
                      }
                  }

                  positioned.sort((a, b) -> {
                      if (Math.abs(a.top - b.top) <= dp(12)) {
                          return Integer.compare(a.left, b.left);
                      }
                      return Integer.compare(a.top, b.top);
                  });

                  List<String> lines = new ArrayList<>();
                  for (OcrLine line : positioned) lines.add(line.text);
                  handleLines(lines);
              }

              private void handleLines(List<String> lines) {
                  RouteEndpoints endpoints = RouteParser.extract(lines);
                  if (endpoints.pickup == null && endpoints.delivery == null) {
                      Toast.makeText(this,
                              "Nem találtam felrakó/lerakó blokkot. " +
                              "Maradj a fuvarfeladat címes képernyőjén, majd nyomd meg újra az SG gombot.",
                              Toast.LENGTH_LONG).show();
                      finishProcessing();
                      return;
                  }

                  SharedPreferences.Editor editor =
                          getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE).edit();
                  if (endpoints.pickup != null) {
                      editor.putString(MainActivity.KEY_PICKUP_QUERY, endpoints.pickup)
                              .remove(MainActivity.KEY_PICKUP_COORD)
                              .remove(MainActivity.KEY_PICKUP_LABEL);
                  }
                  if (endpoints.delivery != null) {
                      editor.putString(MainActivity.KEY_DELIVERY_QUERY, endpoints.delivery)
                              .remove(MainActivity.KEY_DELIVERY_COORD)
                              .remove(MainActivity.KEY_DELIVERY_LABEL);
                  }
                  editor.remove(MainActivity.KEY_PENDING_TARGET)
                          .remove(MainActivity.KEY_PENDING_INDEX)
                          .remove(MainActivity.KEY_PENDING_QUERY)
                          .apply();

                  Toast.makeText(this,
                          "A képernyőn megtalált címek beolvasva.",
                          Toast.LENGTH_SHORT).show();
                  openEditor();
                  finishProcessing();
              }

              private void openEditor() {
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);
              }

              private List<String> readVisibleLines(String packageFilter) {
                  AccessibilityNodeInfo root = findPackageRoot(packageFilter);
                  if (root == null) return Collections.emptyList();

                  ArrayList<String> lines = new ArrayList<>();
                  try {
                      collectText(root, packageFilter, lines);
                  } finally {
                      root.recycle();
                  }
                  return lines;
              }

              private AccessibilityNodeInfo findPackageRoot(String packageFilter) {
                  if (packageFilter != null) {
                      List<AccessibilityWindowInfo> windows = getWindows();
                      if (windows != null) {
                          for (AccessibilityWindowInfo window : windows) {
                              if (window == null) continue;
                              AccessibilityNodeInfo root = window.getRoot();
                              if (root == null) continue;

                              CharSequence packageName = root.getPackageName();
                              if (packageName != null &&
                                      packageFilter.contentEquals(packageName)) {
                                  return root;
                              }
                              root.recycle();
                          }
                      }
                  }

                  AccessibilityNodeInfo active = getRootInActiveWindow();
                  if (active == null) return null;
                  if (packageFilter == null) return active;

                  CharSequence packageName = active.getPackageName();
                  if (packageName != null &&
                          packageFilter.contentEquals(packageName)) {
                      return active;
                  }
                  active.recycle();
                  return null;
              }

              private void collectText(
                      AccessibilityNodeInfo node,
                      String packageFilter,
                      List<String> output) {
                  if (node == null) return;

                  CharSequence packageName = node.getPackageName();
                  boolean packageAllowed = packageFilter == null ||
                          packageName == null ||
                          packageFilter.contentEquals(packageName);

                  if (packageAllowed) {
                      addText(output, node.getText());
                      addText(output, node.getContentDescription());
                      addText(output, node.getHintText());
                  }

                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectText(child, packageFilter, output);
                      } finally {
                          child.recycle();
                      }
                  }
              }

              private void addText(List<String> output, CharSequence value) {
                  String clean = clean(value == null ? "" : value.toString());
                  if (!clean.isEmpty()) output.add(clean);
              }

              private String findCoordinate(List<String> lines) {
                  if (lines == null || lines.isEmpty()) return null;

                  for (String line : lines) {
                      String coordinate = normalizeCoordinate(line);
                      if (coordinate != null) return coordinate;
                  }

                  String joined = String.join(" ", lines);
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          joined.replace('−', '-'));
                  while (matcher.find()) {
                      String coordinate = normalizeCoordinate(
                              matcher.group(1) + " " + matcher.group(2));
                      if (coordinate != null) return coordinate;
                  }
                  return null;
              }

              private static String normalizeCoordinate(String value) {
                  if (value == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          value.replace('−', '-'));
                  if (!matcher.matches()) return null;
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }

              private static String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }

              private static List<String> parseLines(String source) {
                  ArrayList<String> result = new ArrayList<>();
                  if (source == null || source.isBlank()) return result;
                  for (String line : source.split("\\r?\\n")) {
                      String clean = clean(line);
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return result;
              }

              private static List<String> unique(List<String> source) {
                  LinkedHashSet<String> result = new LinkedHashSet<>();
                  for (String value : source) {
                      String clean = clean(value);
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return new ArrayList<>(result);
              }

              private void finishProcessing() {
                  captureMode = CAPTURE_NONE;
                  captureToken++;
                  processing.set(false);
                  if (floatingButton != null) {
                      floatingButton.setVisibility(View.VISIBLE);
                      floatingButton.setEnabled(true);
                  }
                  updateFloatingButton();
              }

              private static String clean(String value) {
                  if (value == null) return "";
                  return value.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private static String normalized(String value) {
                  String noAccent = Normalizer.normalize(
                          clean(value), Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "");
                  return noAccent.toUpperCase(Locale.ROOT)
                          .replaceAll("[^A-Z0-9]+", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private int dp(int value) {
                  return Math.round(value *
                          getResources().getDisplayMetrics().density);
              }



              private final class DragTouchListener implements View.OnTouchListener {
                  private float downRawX;
                  private float downRawY;
                  private int startX;
                  private int startY;
                  private boolean moved;

                  @Override
                  public boolean onTouch(View view, MotionEvent event) {
                      if (floatingParams == null || windowManager == null) return false;

                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downRawX = event.getRawX();
                              downRawY = event.getRawY();
                              startX = floatingParams.x;
                              startY = floatingParams.y;
                              moved = false;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - downRawX;
                              float dy = event.getRawY() - downRawY;
                              if (Math.abs(dx) > dp(5) || Math.abs(dy) > dp(5)) {
                                  moved = true;
                                  floatingParams.x = Math.max(0, startX - Math.round(dx));
                                  floatingParams.y = startY + Math.round(dy);
                                  try {
                                      windowManager.updateViewLayout(
                                              floatingButton, floatingParams);
                                  } catch (RuntimeException ignored) {
                                  }
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (!moved) view.performClick();
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              return true;

                          default:
                              return false;
                      }
                  }
              }

              private static final class OcrLine {
                  final String text;
                  final int top;
                  final int left;

                  OcrLine(String text, int top, int left) {
                      this.text = text;
                      this.top = top;
                      this.left = left;
                  }
              }

              private static final class RouteEndpoints {
                  final String pickup;
                  final String delivery;

                  RouteEndpoints(String pickup, String delivery) {
                      this.pickup = pickup;
                      this.delivery = delivery;
                  }
              }

              private static final class RouteParser {
                  private static final Pattern POSTAL_PATTERN = Pattern.compile(
                          "\\b(?:[A-Z]{1,3}-)?\\d{4,6}\\b",
                          Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);

                  private static final Pattern INLINE_METADATA_PATTERN = Pattern.compile(
                          "(?i)(?:^|[,;])\\s*(?:AUTRE|OTHER|SONSTIGE|PRODUIT|PRODUCT|" +
                          "MARCHANDISE|GOODS|WARE|ARTICLE|COMMODITY|PULPE|BETTERAVE|" +
                          "COMPTE|ACCOUNT|KONTO|REFERENCE|REF|TELEPHONE|TEL|NOTE|" +
                          "COMMENT|MEGJEGYZES)\\b.*$");

                  private static final Set<String> COUNTRY_TOKENS =
                          new LinkedHashSet<>(Arrays.asList(
                                  "FR", "FRANCE", "FRANCIAORSZAG",
                                  "CH", "SUISSE", "SCHWEIZ", "SWITZERLAND", "SVAJC",
                                  "BE", "BELGIQUE", "BELGIUM",
                                  "DE", "DEUTSCHLAND", "GERMANY", "NEMETORSZAG",
                                  "NL", "NEDERLAND", "NETHERLANDS", "HOLLANDIA",
                                  "LU", "LUXEMBOURG",
                                  "AT", "AUSTRIA", "OSTERREICH", "AUSZTRIA",
                                  "IT", "ITALIA", "ITALY", "OLASZORSZAG",
                                  "ES", "ESPANA", "SPAIN", "SPANYOLORSZAG",
                                  "HU", "HUNGARY", "MAGYARORSZAG",
                                  "PL", "POLAND", "POLSKA", "LENGYELORSZAG",
                                  "CZ", "CZECHIA", "CESKO", "CSEHORSZAG",
                                  "SK", "SLOVAKIA", "SLOVENSKO", "SZLOVAKIA",
                                  "SI", "SLOVENIA", "SLOVENIJA",
                                  "HR", "CROATIA", "HRVATSKA", "HORVATORSZAG",
                                  "RO", "ROMANIA", "ROMANIA",
                                  "BG", "BULGARIA",
                                  "DK", "DENMARK", "DANIA",
                                  "SE", "SWEDEN", "SVERIGE", "SVEDORSZAG",
                                  "NO", "NORWAY", "NORGE", "NORVEGIA",
                                  "FI", "FINLAND", "SUOMI",
                                  "GB", "UK", "UNITED KINGDOM", "NAGY BRITANNIA"));

                  private static final Pattern STREET_PATTERN = Pattern.compile(
                          "(?i)\\b(?:RUE|ROUTE|AVENUE|AV\\.?|BOULEVARD|BD\\.?|" +
                          "CHEMIN|IMPASSE|PLACE|QUAI|STRASSE|STRASSE|STR\\.?|" +
                          "WEG|GASSE|STREET|ROAD|LANE|DRIVE|VIA|VIALE|PIAZZA|" +
                          "UTCA|UT|TER|SOR|KOZ|PARK)\\b");

                  private RouteParser() {
                  }

                  static RouteEndpoints extract(List<String> originalLines) {
                      List<String> lines = new ArrayList<>();
                      if (originalLines != null) {
                          for (String line : originalLines) {
                              String clean = TomTomAccessibilityService.clean(line);
                              if (!clean.isEmpty() &&
                                      !"TT".equalsIgnoreCase(clean) &&
                                      !"+".equals(clean) &&
                                      !"…".equals(clean)) {
                                  lines.add(clean);
                              }
                          }
                      }

                      int pickupMarker = findMarker(lines, PICKUP_MARKERS, 0);
                      int deliveryMarker = findMarker(lines, DELIVERY_MARKERS, 0);

                      String pickup = null;
                      String delivery = null;

                      if (pickupMarker >= 0) {
                          int end = deliveryMarker > pickupMarker
                                  ? deliveryMarker
                                  : lines.size();
                          pickup = extractAddressBlock(
                                  lines, pickupMarker + 1, end);
                      }

                      if (deliveryMarker >= 0) {
                          int nextPickup = findMarker(
                                  lines, PICKUP_MARKERS, deliveryMarker + 1);
                          int end = nextPickup > deliveryMarker
                                  ? nextPickup
                                  : lines.size();
                          delivery = extractAddressBlock(
                                  lines, deliveryMarker + 1, end);
                      }

                      return new RouteEndpoints(pickup, delivery);
                  }

                  private static int findMarker(
                          List<String> lines,
                          List<String> markers,
                          int start) {
                      for (int index = Math.max(0, start);
                           index < lines.size();
                           index++) {
                          String line = normalized(lines.get(index));
                          for (String marker : markers) {
                              String normalizedMarker = normalized(marker);
                              if (line.equals(normalizedMarker) ||
                                      line.startsWith(normalizedMarker + " ") ||
                                      line.contains(" " + normalizedMarker + " ")) {
                                  return index;
                              }
                          }
                      }
                      return -1;
                  }

                  private static String extractAddressBlock(
                          List<String> lines,
                          int start,
                          int end) {
                      ArrayList<String> rawParts = new ArrayList<>();
                      int safeEnd = Math.min(lines.size(), end);

                      for (int index = Math.max(0, start);
                           index < safeEnd && rawParts.size() < 18;
                           index++) {
                          String raw = clean(lines.get(index));
                          String match = normalized(raw);

                          if (raw.isEmpty()) continue;
                          if (isStatusWord(match)) continue;
                          if (isAnyMarker(match)) break;

                          String trimmed = trimMetadata(raw);
                          if (trimmed.isEmpty()) {
                              if (!rawParts.isEmpty()) break;
                              continue;
                          }

                          rawParts.add(trimmed);

                          if (containsCountry(trimmed) &&
                                  containsPostal(String.join(" ", rawParts))) {
                              break;
                          }

                          if (isMetadata(raw, match) && !rawParts.isEmpty()) {
                              break;
                          }
                      }

                      if (rawParts.isEmpty()) return null;

                      String coordinate = findCoordinateStatic(rawParts);
                      if (coordinate != null) return coordinate;

                      return canonicalAddress(rawParts);
                  }

                  private static String canonicalAddress(List<String> rawParts) {
                      ArrayList<String> segments = new ArrayList<>();
                      boolean postalSeen = false;
                      boolean countrySeen = false;

                      outer:
                      for (String raw : rawParts) {
                          String trimmed = trimMetadata(raw);
                          if (trimmed.isEmpty()) continue;

                          for (String piece : trimmed.split("[,;]")) {
                              String segment = clean(piece);
                              if (segment.isEmpty()) continue;

                              String normalizedSegment = normalized(segment);
                              if (isMetadata(segment, normalizedSegment)) break outer;

                              if (isCountryToken(segment)) {
                                  if (postalSeen) {
                                      addUnique(segments, normalizedCountry(segment));
                                      countrySeen = true;
                                  }
                                  break outer;
                              }

                              String inlineCountry = countryAtEnd(segment);
                              if (inlineCountry != null) {
                                  String before = clean(segment.substring(
                                          0, segment.length() - inlineCountry.length()));
                                  if (!before.isEmpty()) {
                                      addUnique(segments, before);
                                      postalSeen = postalSeen || containsPostal(before);
                                  }
                                  if (postalSeen) {
                                      addUnique(segments, normalizedCountry(inlineCountry));
                                      countrySeen = true;
                                  }
                                  break outer;
                              }

                              addUnique(segments, segment);
                              postalSeen = postalSeen || containsPostal(segment);
                          }
                      }

                      if (segments.isEmpty()) return null;

                      int postalIndex = -1;
                      for (int index = 0; index < segments.size(); index++) {
                          if (containsPostal(segments.get(index))) {
                              postalIndex = index;
                              break;
                          }
                      }

                      ArrayList<String> result = new ArrayList<>();
                      if (postalIndex > 0) {
                          ArrayList<String> companyCandidates = new ArrayList<>();
                          ArrayList<String> streetCandidates = new ArrayList<>();

                          for (int index = 0; index < postalIndex; index++) {
                              String segment = segments.get(index);
                              if (looksLikeStreet(segment)) {
                                  streetCandidates.add(segment);
                              } else {
                                  companyCandidates.add(segment);
                              }
                          }

                          String company = chooseCompany(companyCandidates);
                          if (!company.isEmpty()) result.add(company);
                          for (String street : streetCandidates) addUnique(result, street);

                          for (int index = postalIndex; index < segments.size(); index++) {
                              addUnique(result, segments.get(index));
                          }
                      } else {
                          for (String segment : segments) addUnique(result, segment);
                      }

                      String joined = clean(String.join(", ", result));
                      joined = joined.replaceAll("\\s+,", ",")
                              .replaceAll(",\\s*,+", ", ")
                              .replaceAll("\\s{2,}", " ")
                              .replaceAll("[,;\\s]+$", "")
                              .trim();

                      if (!countrySeen && joined.isEmpty()) return null;
                      return joined.isEmpty() ? null : joined;
                  }

                  private static String chooseCompany(List<String> candidates) {
                      if (candidates == null || candidates.isEmpty()) return "";

                      String best = "";
                      int bestScore = Integer.MIN_VALUE;

                      for (String candidate : candidates) {
                          String cleanCandidate = clean(candidate)
                                  .replaceAll("^[\\-–—\\s]+|[\\-–—\\s]+$", "");
                          if (cleanCandidate.isEmpty()) continue;

                          int score = 0;
                          String normalizedCandidate = normalized(cleanCandidate);

                          if (normalizedCandidate.matches(".*\\b(?:AG|SA|SAS|SARL|GMBH|" +
                                  "BV|NV|LTD|SRL|SPA|KG|OHG|KFT|ZRT)\\b.*")) {
                              score += 30;
                          }
                          if (cleanCandidate.length() >= 4 &&
                                  cleanCandidate.length() <= 55) {
                              score += 15;
                          }
                          if (!cleanCandidate.matches(".*\\d.*")) score += 8;
                          score -= Math.max(0, cleanCandidate.length() - 55);

                          if (score > bestScore ||
                                  (score == bestScore &&
                                   cleanCandidate.length() < best.length())) {
                              best = cleanCandidate;
                              bestScore = score;
                          }
                      }

                      return best;
                  }

                  private static boolean looksLikeStreet(String value) {
                      if (value == null || value.isEmpty()) return false;
                      return STREET_PATTERN.matcher(value).find() ||
                              value.matches(".*\\b\\d{1,5}[A-Za-z]?\\b.*");
                  }

                  private static void addUnique(
                          List<String> output,
                          String value) {
                      String cleanValue = clean(value);
                      if (cleanValue.isEmpty()) return;

                      String normalizedValue = normalized(cleanValue);
                      for (String existing : output) {
                          String normalizedExisting = normalized(existing);
                          if (normalizedExisting.equals(normalizedValue)) return;
                      }
                      output.add(cleanValue);
                  }

                  private static String trimMetadata(String raw) {
                      if (raw == null) return "";
                      String cleaned = clean(raw);

                      Matcher metadata = INLINE_METADATA_PATTERN.matcher(cleaned);
                      if (metadata.find()) {
                          cleaned = clean(cleaned.substring(0, metadata.start()));
                      }

                      return cleaned.replaceAll("[,;\\s]+$", "").trim();
                  }

                  private static boolean containsPostal(String value) {
                      return value != null &&
                              POSTAL_PATTERN.matcher(value).find();
                  }

                  private static boolean containsCountry(String value) {
                      if (value == null) return false;
                      for (String piece : value.split("[,;]")) {
                          if (isCountryToken(piece) ||
                                  countryAtEnd(piece) != null) {
                              return true;
                          }
                      }
                      return false;
                  }

                  private static String countryAtEnd(String value) {
                      if (value == null) return null;
                      String cleanValue = clean(value);
                      String normalizedValue = normalized(cleanValue).toUpperCase(Locale.ROOT);

                      for (String country : COUNTRY_TOKENS) {
                          String normalizedCountry =
                                  normalized(country).toUpperCase(Locale.ROOT);
                          if (normalizedValue.equals(normalizedCountry)) {
                              return cleanValue;
                          }
                          if (normalizedValue.endsWith(" " + normalizedCountry)) {
                              int start = cleanValue.length() - country.length();
                              if (start >= 0) return cleanValue.substring(start);
                          }
                      }
                      return null;
                  }

                  private static boolean isCountryToken(String value) {
                      String normalizedValue =
                              normalized(value).toUpperCase(Locale.ROOT);
                      for (String country : COUNTRY_TOKENS) {
                          if (normalizedValue.equals(
                                  normalized(country).toUpperCase(Locale.ROOT))) {
                              return true;
                          }
                      }
                      return false;
                  }

                  private static String normalizedCountry(String value) {
                      String normalizedValue =
                              normalized(value).toUpperCase(Locale.ROOT);
                      if (normalizedValue.equals("FRANCE") ||
                              normalizedValue.equals("FRANCIAORSZAG")) return "FR";
                      if (normalizedValue.equals("SUISSE") ||
                              normalizedValue.equals("SCHWEIZ") ||
                              normalizedValue.equals("SWITZERLAND") ||
                              normalizedValue.equals("SVAJC")) return "CH";
                      if (normalizedValue.equals("BELGIQUE") ||
                              normalizedValue.equals("BELGIUM")) return "BE";
                      if (normalizedValue.equals("DEUTSCHLAND") ||
                              normalizedValue.equals("GERMANY") ||
                              normalizedValue.equals("NEMETORSZAG")) return "DE";
                      return clean(value).toUpperCase(Locale.ROOT);
                  }

                  private static boolean isAnyMarker(String match) {
                      for (String marker : PICKUP_MARKERS) {
                          if (match.equals(normalized(marker))) return true;
                      }
                      for (String marker : DELIVERY_MARKERS) {
                          if (match.equals(normalized(marker))) return true;
                      }
                      return false;
                  }

                  private static boolean isStatusWord(String match) {
                      String padded = " " + match + " ";
                      for (String word : STATUS_WORDS) {
                          String normalizedWord = normalized(word);
                          if (padded.contains(" " + normalizedWord + " ")) return true;
                      }
                      return false;
                  }

                  private static boolean isMetadata(String raw, String match) {
                      if (raw.matches(".*\\b(?:[01]?\\d|2[0-3]):[0-5]\\d\\b.*")) {
                          return true;
                      }
                      if (raw.matches(".*\\b20\\d{2}[-./]\\d{1,2}[-./]\\d{1,2}\\b.*")) {
                          return true;
                      }
                      if (INLINE_METADATA_PATTERN.matcher("," + raw).find()) {
                          return true;
                      }
                      return isHardStop(match);
                  }

                  private static boolean isHardStop(String match) {
                      String padded = " " + match + " ";
                      for (String word : HARD_STOP_WORDS) {
                          String normalizedWord = normalized(word);
                          if (padded.contains(" " + normalizedWord + " ")) return true;
                      }
                      return false;
                  }

                  private static String findCoordinateStatic(List<String> lines) {
                      for (String line : lines) {
                          String coordinate = normalizeCoordinate(line);
                          if (coordinate != null) return coordinate;
                      }
                      Matcher matcher = COORDINATE_PATTERN.matcher(
                              String.join(" ", lines).replace('−', '-'));
                      if (matcher.find()) {
                          return normalizeCoordinate(
                                  matcher.group(1) + " " + matcher.group(2));
                      }
                      return null;
                  }
              }
          }
          EOF

      - name: Verify V098 generated project structure
        run: |
          set -euo pipefail
          MAIN='app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java'
          SERVICE='app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java'
          WEB='app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomWebActivity.java'
          CRED='app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomCredentialStore.java'

          test -s "$MAIN"
          test -s "$SERVICE"
          test -s "$WEB"
          test -s "$CRED"
          grep -F 'rootProject.name = "TomTomKiszolgaloV098"' settings.gradle.kts
          grep -F 'versionCode = 98' app/build.gradle.kts
          grep -F 'versionName = "098"' app/build.gradle.kts
          grep -F 'private static final String VERSION = "V098";' "$MAIN"
          grep -F 'generatedRouteName' "$WEB"
          grep -F 'waitForImportedRoute' "$WEB"
          grep -F 'waitForRouteSyncMenuItem' "$WEB"
          grep -F 'waitForRouteSyncSwitch' "$WEB"
          grep -F 'buildImportedRouteOptionsClickScript' "$WEB"
          grep -F 'buildRouteSyncSwitchScript' "$WEB"
          grep -F 'ROUTE_SYNC_MENU_LABELS' "$WEB"
          grep -F 'SYNC_ROUTE_LABELS' "$WEB"
          grep -F 'ROUTE_OPTIONS_CLICKED' "$WEB"
          grep -F 'SYNC_CLICKED' "$WEB"
          grep -F 'SYNC_ALREADY_ON' "$WEB"
          grep -F 'AFTER_IMPORT_UPLOAD_MS = 1800L' "$WEB"
          grep -F 'AFTER_IMPORTED_ROUTE_MS = 900L' "$WEB"
          grep -F 'AFTER_ROUTE_SYNC_MENU_MS = 1400L' "$WEB"
          grep -F 'Az útvonal importálva és az eszközszinkron bekapcsolva.' "$WEB"
          ! grep -F "dispatchEvent(new PointerEvent" "$WEB"
          ! grep -F "dispatchEvent(new MouseEvent('click'" "$WEB"

          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = [
              Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java'),
              Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java'),
              Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomWebActivity.java'),
              Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomCredentialStore.java'),
          ]
          for path in paths:
              source = path.read_text(encoding='utf-8')
              assert source.rstrip().endswith('}'), path
              assert source.count('{') == source.count('}'), path

          main = paths[0].read_text(encoding='utf-8')
          assert main.count('protected void onCreate(Bundle savedInstanceState)') == 1
          assert main.count('protected void onResume()') == 1
          assert main.count('protected void onPause()') == 1

          web = paths[2].read_text(encoding='utf-8')
          required = [
              'generatedRouteName',
              'getStringExtra(EXTRA_ROUTE_NAME)',
              'waitForHamburger',
              'beginTextMenuSteps',
              'waitForAndClickTextTarget',
              'waitForAndTouchGpxImport',
              'verifyGpxChooserOpened',
              'sendNativeTapToWebView',
              'buildTextTargetLocationScript',
              'waitForImportedRoute',
              'waitForRouteSyncMenuItem',
              'waitForRouteSyncSwitch',
              'buildImportedRouteOptionsClickScript',
              'buildRouteSyncSwitchScript',
              'ROUTE_SYNC_MENU_LABELS',
              'SYNC_ROUTE_LABELS',
              'WAIT_IMPORTED_ROUTE',
              'ROUTE_OPTIONS_CLICKED',
              'ROUTE_ROW_CLICKED',
              'WAIT_SYNC',
              'SYNC_SCROLLED',
              'SYNC_ALREADY_ON',
              'SYNC_CLICKED',
              'GPX_CHOOSER_TIMEOUT_MS = 2500L',
              'GPX_TOUCH_HOLD_MS = 90L',
              'AFTER_IMPORT_UPLOAD_MS = 1800L',
              'AFTER_IMPORTED_ROUTE_MS = 900L',
              'AFTER_ROUTE_SYNC_MENU_MS = 1400L',
              'A GPX-gomb látható, de a TomTom nem indította el a fájlkérést.',
              'Az importált útvonal nem jelent meg időben.',
              'Az Útvonal szinkronizálása menüpont nem jelent meg időben.',
              'A szinkronkapcsoló nem jelent meg időben.',
              'Az útvonal importálva és az eszközszinkron bekapcsolva.',
          ]
          for item in required:
              assert item in web, item

          # A teljes folyamat egyetlen lánc: hamburger -> Saját elemek ->
          # Útvonalak -> natív érintéses GPX-import -> fájlkérés-visszaigazolás ->
          # frissen importált útvonal menüje -> Útvonal szinkronizálása ->
          # szinkronizálási adatlap/kapcsoló. Egyik lépés sem kattint vakon.
          assert '() -> waitForAndTouchGpxImport(' in web
          menu_chain = web.split('private void beginTextMenuSteps', 1)[1].split(
              'private void waitForAndTouchGpxImport', 1)[0]
          assert '() -> waitForImportedRoute(' not in menu_chain
          assert '() -> waitForRouteSyncMenuItem(' in web
          assert '() -> waitForRouteSyncSwitch(' in web
          assert 'finishMenuAutomation(' in web
          assert 'generatedRouteName.isBlank()' in web
          assert 'tapKnownRenderedHamburgerPosition' not in web
          assert 'sendTouchToWebView' not in web
          assert 'MotionEvent.ACTION_DOWN' in web
          assert 'MotionEvent.ACTION_UP' in web
          assert 'InputDevice.SOURCE_TOUCHSCREEN' in web
          assert 'gpxChooserAwaiting' in web
          assert 'new JSONArray(result)' in web
          assert 'buildTextTargetLocationScript(' in web
          assert 'IMPORT_GPX_LABELS,' in web
          locator = web.split('private String buildTextTargetLocationScript', 1)[1].split(
              'private String buildImportedRouteOptionsClickScript', 1)[0]
          assert '.click();' not in locator
          assert 'scrollIntoView' not in locator
          assert "dispatchEvent(new PointerEvent" not in web
          assert "dispatchEvent(new MouseEvent('click'" not in web

          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          print('V098_ROUTE_SYNC_MENU_AUDIT_OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V098 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V098 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V098.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V098.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V098
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V098
          path: |
            artifact/TomTom_Kiszolgalo_V098.apk
            artifact/TomTom_Kiszolgalo_V098.aab
          if-no-files-found: error
