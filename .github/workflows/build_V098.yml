          package hu.pocsaji.tomtomkiszolgalo;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;

          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;

          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;

          final class TomTomCredentialStore {
              private static final String PREFS = "tomtom_login_credentials_v1";
              private static final String KEY_EMAIL = "email";
              private static final String KEY_PASSWORD = "password_encrypted";
              private static final String KEY_ALIAS = "tomtom_login_aes_v1";
              private static final String TRANSFORMATION = "AES/GCM/NoPadding";

              private TomTomCredentialStore() {
              }

              static boolean hasCredentials(Context context) {
                  return !email(context).isEmpty() && !password(context).isEmpty();
              }

              static String email(Context context) {
                  String value = preferences(context).getString(KEY_EMAIL, "");
                  return value == null ? "" : value.trim();
              }

              static String password(Context context) {
                  String encrypted = preferences(context).getString(KEY_PASSWORD, "");
                  if (encrypted == null || encrypted.isEmpty()) return "";
                  try {
                      return decrypt(encrypted);
                  } catch (Exception error) {
                      return "";
                  }
              }

              static void save(Context context, String email, String password)
                      throws Exception {
                  String cleanEmail = email == null ? "" : email.trim();
                  String cleanPassword = password == null ? "" : password;
                  if (cleanEmail.isEmpty() || cleanPassword.isEmpty()) {
                      throw new IllegalArgumentException(
                              "Az e-mail cím és a jelszó is kötelező.");
                  }
                  preferences(context).edit()
                          .putString(KEY_EMAIL, cleanEmail)
                          .putString(KEY_PASSWORD, encrypt(cleanPassword))
                          .apply();
              }

              static void clear(Context context) {
                  preferences(context).edit().clear().apply();
              }

              private static SharedPreferences preferences(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              private static String encrypt(String value) throws Exception {
                  Cipher cipher = Cipher.getInstance(TRANSFORMATION);
                  cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey());
                  byte[] encrypted = cipher.doFinal(
                          value.getBytes(StandardCharsets.UTF_8));
                  return Base64.encodeToString(cipher.getIV(), Base64.NO_WRAP) + ":" +
                          Base64.encodeToString(encrypted, Base64.NO_WRAP);
              }

              private static String decrypt(String value) throws Exception {
                  String[] pieces = value.split(":", 2);
                  if (pieces.length != 2) return "";
                  byte[] iv = Base64.decode(pieces[0], Base64.NO_WRAP);
                  byte[] encrypted = Base64.decode(pieces[1], Base64.NO_WRAP);
                  Cipher cipher = Cipher.getInstance(TRANSFORMATION);
                  cipher.init(
                          Cipher.DECRYPT_MODE,
                          getOrCreateKey(),
                          new GCMParameterSpec(128, iv));
                  return new String(
                          cipher.doFinal(encrypted),
                          StandardCharsets.UTF_8);
              }

              private static SecretKey getOrCreateKey() throws Exception {
                  KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
                  keyStore.load(null);
                  if (keyStore.containsAlias(KEY_ALIAS)) {
                      KeyStore.SecretKeyEntry entry =
                              (KeyStore.SecretKeyEntry) keyStore.getEntry(
                                      KEY_ALIAS, null);
                      return entry.getSecretKey();
                  }

                  KeyGenerator generator = KeyGenerator.getInstance(
                          KeyProperties.KEY_ALGORITHM_AES,
                          "AndroidKeyStore");
                  generator.init(new KeyGenParameterSpec.Builder(
                          KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT |
                                  KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(
                                  KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build());
                  return generator.generateKey();
              }
          }
