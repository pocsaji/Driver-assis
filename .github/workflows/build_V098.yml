                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          if (pendingFileCallback != null) {
                              pendingFileCallback.onReceiveValue(null);
                          }
                          pendingFileCallback = filePathCallback;

                          if (generatedGpxUri != null) {
                              pendingFileCallback.onReceiveValue(
                                      new Uri[]{generatedGpxUri});
                              pendingFileCallback = null;

                              int generation = gpxChooserGeneration;
                              boolean continueAutomation =
                                      gpxChooserAwaiting &&
                                              isCurrentMenuAutomation(generation);
                              gpxChooserAwaiting = false;
                              statusText.setText(
                                      "A fájlkéréshez átadva: " +
                                              displayGpxName());

                              if (continueAutomation) {
                                  webView.postDelayed(
                                          () -> waitForImportedRoute(
                                                  generation,
                                                  0),
                                          AFTER_IMPORT_UPLOAD_MS);
                              }
                              return true;
                          }

                          Intent picker = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          picker.addCategory(Intent.CATEGORY_OPENABLE);
                          picker.setType("*/*");
                          try {
                              startActivityForResult(picker, REQUEST_FILE);
                          } catch (ActivityNotFoundException error) {
                              pendingFileCallback.onReceiveValue(null);
                              pendingFileCallback = null;
                              Toast.makeText(
                                      TomTomWebActivity.this,
                                      "A fájlválasztó nem nyitható meg.",
                                      Toast.LENGTH_LONG).show();
                          }
                          return true;
                      }
                  });
              }

              private void startHamburgerAutomation(boolean manual) {
                  if (!manual &&
                          (menuAutomationRunning || menuAutomationCompleted)) {
                      return;
                  }

                  hamburgerClicked = false;
                  gpxChooserAwaiting = false;
                  gpxChooserGeneration = 0;
                  menuAutomationRunning = true;
                  if (manual) {
                      menuAutomationCompleted = false;
                  }
                  int generation = ++menuAutomationGeneration;
                  statusText.setText(
                          "Automatikus menüfolyamat: várakozás a hamburgergombra...");

                  // A TomTom animált felülete miatt minden kattintás előtt
                  // kötelező fix kirajzolódási idő van. Egy lépés pontosan egy
                  // click eseményt küld; nincs pointer/mouse/click eseménysorozat.
                  webView.postDelayed(
                          () -> waitForHamburger(generation, 0),
                          manual ? 800L : INITIAL_PAGE_SETTLE_MS);
              }

              private void waitForHamburger(
                      int generation,
                      int attempt) {
                  if (!isCurrentMenuAutomation(generation) || hamburgerClicked) {
                      return;
                  }

                  webView.evaluateJavascript(
                          buildRenderedHamburgerClickScript(),
                          result -> {
                              if (!isCurrentMenuAutomation(generation) ||
                                      hamburgerClicked) {
                                  return;
                              }
                              if (result != null && result.contains("CLICKED:")) {
                                  hamburgerClicked = true;
                                  statusText.setText(
                                          "Hamburger megnyomva; fix várakozás a menüre...");
                                  webView.postDelayed(
                                          () -> beginTextMenuSteps(generation),
                                          AFTER_HAMBURGER_MS);
                                  return;
                              }

                              int nextAttempt = attempt + 1;
                              if (nextAttempt < UI_STEP_MAX_ATTEMPTS) {
                                  webView.postDelayed(
                                          () -> waitForHamburger(
                                                  generation,
                                                  nextAttempt),
                                          UI_STEP_RETRY_MS);
                                  return;
                              }

                              // Nem kattintunk vakon egy feltételezett helyre.
                              // Ha a hamburger nem látható, a folyamat megáll.
                              failMenuAutomation(
                                      generation,
                                      "A hamburgergomb nem jelent meg időben.");
                          });
              }

              private void beginTextMenuSteps(int generation) {
                  if (!isCurrentMenuAutomation(generation)) {
                      return;
                  }
                  statusText.setText("Menü kirajzolva; Saját elemek keresése...");
                  waitForAndClickTextTarget(
                          generation,
                          0,
                          "Saját elemek",
                          OWN_ITEMS_LABELS,
                          false,
                          AFTER_OWN_ITEMS_MS,
                          () -> waitForAndClickTextTarget(
                                  generation,
                                  0,
                                  "Útvonalak",
                                  ROUTES_LABELS,
                                  false,
                                  AFTER_ROUTES_MS,
                                  () -> waitForAndTouchGpxImport(
                                          generation,
                                          0)));
              }

              private void waitForAndTouchGpxImport(
                      int generation,
                      int attempt) {
                  if (!isCurrentMenuAutomation(generation) ||
                          gpxChooserAwaiting) {
                      return;
                  }

                  statusText.setText(
                          "GPX-import gomb kirajzolásának ellenőrzése...");
                  webView.evaluateJavascript(
                          buildTextTargetLocationScript(
                                  IMPORT_GPX_LABELS,
                                  true),
                          result -> {
                              if (!isCurrentMenuAutomation(generation) ||
                                      gpxChooserAwaiting) {
                                  return;
                              }

                              float[] ratios = parseTargetRatios(result);
                              if (ratios != null) {
                                  gpxChooserAwaiting = true;
                                  gpxChooserGeneration = generation;
                                  statusText.setText(
                                          "GPX-import gomb látható; natív érintés küldése...");
                                  sendNativeTapToWebView(
                                          ratios[0],
                                          ratios[1],
                                          () -> webView.postDelayed(
                                                  () -> verifyGpxChooserOpened(
                                                          generation,
                                                          attempt),
                                                  GPX_CHOOSER_TIMEOUT_MS));
                                  return;
                              }

                              int nextAttempt = attempt + 1;
                              if (nextAttempt < UI_STEP_MAX_ATTEMPTS) {
                                  webView.postDelayed(
                                          () -> waitForAndTouchGpxImport(
                                                  generation,
                                                  nextAttempt),
                                          UI_STEP_RETRY_MS);
                                  return;
                              }

                              failMenuAutomation(
                                      generation,
                                      "A GPX-import gomb nem jelent meg időben.");
                          });
              }

              private void verifyGpxChooserOpened(
                      int generation,
                      int attempt) {
                  if (!isCurrentMenuAutomation(generation) ||
                          !gpxChooserAwaiting ||
                          gpxChooserGeneration != generation) {
                      return;
                  }

                  gpxChooserAwaiting = false;
                  int nextAttempt = attempt + 1;
                  if (nextAttempt < GPX_NATIVE_TAP_MAX_ATTEMPTS) {
                      statusText.setText(
                              "A fájlkérés nem indult el; a GPX-gomb natív érintésének ismétlése...");
                      webView.postDelayed(
                              () -> waitForAndTouchGpxImport(
                                      generation,
                                      nextAttempt),
                              UI_STEP_RETRY_MS);
                      return;
                  }

                  failMenuAutomation(
                          generation,
                          "A GPX-gomb látható, de a TomTom nem indította el a fájlkérést.");
              }

              private float[] parseTargetRatios(String result) {
                  if (result == null) {
                      return null;
                  }
                  try {
                      JSONArray values = new JSONArray(result);
                      if (values.length() != 2) {
                          return null;
                      }
                      double x = values.getDouble(0);
                      double y = values.getDouble(1);
                      if (!Double.isFinite(x) || !Double.isFinite(y) ||
                              x <= 0.0 || x >= 1.0 ||
                              y <= 0.0 || y >= 1.0) {
                          return null;
                      }
                      return new float[]{(float) x, (float) y};
                  } catch (Exception error) {
                      return null;
                  }
              }

              private void sendNativeTapToWebView(
                      float xRatio,
                      float yRatio,
                      Runnable afterTap) {
                  if (webView == null || webView.getWidth() <= 0 ||
                          webView.getHeight() <= 0) {
                      if (afterTap != null) {
                          afterTap.run();
                      }
                      return;
                  }

                  float x = Math.max(1f, Math.min(
                          webView.getWidth() - 2f,
                          xRatio * webView.getWidth()));
                  float y = Math.max(1f, Math.min(
                          webView.getHeight() - 2f,
                          yRatio * webView.getHeight()));
                  long downTime = SystemClock.uptimeMillis();
                  MotionEvent down = MotionEvent.obtain(
                          downTime,
                          downTime,
                          MotionEvent.ACTION_DOWN,
                          x,
                          y,
                          0);
                  down.setSource(InputDevice.SOURCE_TOUCHSCREEN);
                  webView.dispatchTouchEvent(down);
                  down.recycle();

                  webView.postDelayed(() -> {
                      long upTime = SystemClock.uptimeMillis();
                      MotionEvent up = MotionEvent.obtain(
                              downTime,
                              upTime,
                              MotionEvent.ACTION_UP,
                              x,
                              y,
                              0);
                      up.setSource(InputDevice.SOURCE_TOUCHSCREEN);
                      webView.dispatchTouchEvent(up);
                      up.recycle();
                      if (afterTap != null) {
                          afterTap.run();
                      }
                  }, GPX_TOUCH_HOLD_MS);
              }

              private void waitForImportedRoute(
                      int generation,
                      int attempt) {
                  if (!isCurrentMenuAutomation(generation)) {
                      return;
                  }
                  if (generatedRouteName.isBlank()) {
                      failMenuAutomation(
                              generation,
                              "Az importált útvonal neve nem érkezett meg.");
                      return;
                  }

                  statusText.setText(
                          "GPX feltöltve; az új útvonal menüjének keresése...");
                  webView.evaluateJavascript(
                          buildImportedRouteOptionsClickScript(
                                  generatedRouteName),
                          result -> {
                              if (!isCurrentMenuAutomation(generation)) {
                                  return;
                              }
                              if (result != null &&
                                      result.contains("ROUTE_OPTIONS_CLICKED")) {
                                  statusText.setText(
                                          "Az importált útvonal hárompontos menüje megnyílt; " +
                                                  "az Útvonal szinkronizálása menüpont következik...");
                                  webView.postDelayed(
                                          () -> waitForRouteSyncMenuItem(
                                                  generation,
                                                  0),
                                          AFTER_IMPORTED_ROUTE_MS);
                                  return;
                              }
                              if (result != null &&
                                      result.contains("ROUTE_ROW_CLICKED")) {
                                  statusText.setText(
                                          "Az importált útvonal adatlapja megnyílt; " +
                                                  "várakozás a szinkronkapcsolóra...");
                                  webView.postDelayed(
                                          () -> waitForRouteSyncSwitch(
                                                  generation,
                                                  0),
                                          AFTER_ROUTE_SYNC_MENU_MS);
                                  return;
                              }

                              int nextAttempt = attempt + 1;
                              if (nextAttempt < UI_STEP_MAX_ATTEMPTS) {
                                  webView.postDelayed(
                                          () -> waitForImportedRoute(
                                                  generation,
                                                  nextAttempt),
                                          UI_STEP_RETRY_MS);
                                  return;
                              }

                              failMenuAutomation(
                                      generation,
                                      "Az importált útvonal nem jelent meg időben.");
                          });
              }

              private void waitForRouteSyncMenuItem(
                      int generation,
                      int attempt) {
                  if (!isCurrentMenuAutomation(generation)) {
                      return;
                  }

                  webView.evaluateJavascript(
                          buildTextTargetClickScript(
                                  ROUTE_SYNC_MENU_LABELS,
                                  false),
                          result -> {
                              if (!isCurrentMenuAutomation(generation)) {
                                  return;
                              }
                              if (result != null &&
                                      result.contains("TARGET_CLICKED:")) {
                                  statusText.setText(
                                          "Útvonal szinkronizálása egyszer megnyomva; " +
                                                  "várakozás a következő felületre...");
                                  webView.postDelayed(
                                          () -> waitForRouteSyncSwitch(
                                                  generation,
                                                  0),
                                          AFTER_ROUTE_SYNC_MENU_MS);
                                  return;
                              }

                              int nextAttempt = attempt + 1;
                              if (nextAttempt < UI_STEP_MAX_ATTEMPTS) {
                                  webView.postDelayed(
                                          () -> waitForRouteSyncMenuItem(
                                                  generation,
                                                  nextAttempt),
                                          UI_STEP_RETRY_MS);
                                  return;
                              }

                              failMenuAutomation(
                                      generation,
                                      "Az Útvonal szinkronizálása menüpont nem jelent meg időben.");
                          });
              }

              private void waitForRouteSyncSwitch(
                      int generation,
                      int attempt) {
                  if (!isCurrentMenuAutomation(generation)) {
                      return;
                  }

                  statusText.setText(
                          "A szinkronizálási felület és a kapcsoló keresése...");
                  webView.evaluateJavascript(
                          buildRouteSyncSwitchScript(),
                          result -> {
                              if (!isCurrentMenuAutomation(generation)) {
                                  return;
                              }
                              if (result != null &&
                                      result.contains("SYNC_ALREADY_ON")) {
                                  finishMenuAutomation(
                                          generation,
                                          "Az útvonal importálva; az eszközszinkron már be volt kapcsolva.");
                                  return;
                              }
                              if (result != null &&
                                      result.contains("SYNC_SCROLLED")) {
                                  webView.postDelayed(
                                          () -> waitForRouteSyncSwitch(
                                                  generation,
                                                  attempt),
                                          350L);
                                  return;
                              }
                              if (result != null &&
                                      result.contains("SYNC_CLICKED")) {
                                  webView.postDelayed(
                                          () -> finishMenuAutomation(
                                                  generation,
                                                  "Az útvonal importálva és az eszközszinkron bekapcsolva."),
                                          650L);
                                  return;
                              }

                              int nextAttempt = attempt + 1;
                              if (nextAttempt < UI_STEP_MAX_ATTEMPTS) {
                                  webView.postDelayed(
                                          () -> waitForRouteSyncSwitch(
                                                  generation,
                                                  nextAttempt),
                                          UI_STEP_RETRY_MS);
                                  return;
                              }

                              failMenuAutomation(
                                      generation,
                                      "A szinkronkapcsoló nem jelent meg időben.");
                          });
              }

              private void waitForAndClickTextTarget(
                      int generation,
                      int attempt,
                      String stepName,
                      String[] labels,
                      boolean containsMatch,
                      long afterClickDelayMs,
                      Runnable onSuccess) {
                  if (!isCurrentMenuAutomation(generation)) {
                      return;
                  }

                  webView.evaluateJavascript(
                          buildTextTargetClickScript(labels, containsMatch),
                          result -> {
                              if (!isCurrentMenuAutomation(generation)) {
                                  return;
                              }
                              if (result != null &&
                                      result.contains("TARGET_CLICKED:")) {
                                  if (afterClickDelayMs > 0L) {
                                      statusText.setText(
                                              stepName +
                                                      " egyszer megnyomva; fix várakozás a kirajzolásra...");
                                      webView.postDelayed(
                                              onSuccess,
                                              afterClickDelayMs);
                                  } else {
                                      webView.post(onSuccess);
                                  }
                                  return;
                              }

                              int nextAttempt = attempt + 1;
                              if (nextAttempt < UI_STEP_MAX_ATTEMPTS) {
                                  webView.postDelayed(
                                          () -> waitForAndClickTextTarget(
                                                  generation,
                                                  nextAttempt,
                                                  stepName,
                                                  labels,
                                                  containsMatch,
                                                  afterClickDelayMs,
                                                  onSuccess),
                                          UI_STEP_RETRY_MS);
                                  return;
                              }

                              failMenuAutomation(
                                      generation,
                                      "Nem jelent meg időben: " + stepName + ".");
                          });
              }

              private boolean isCurrentMenuAutomation(int generation) {
                  return webView != null &&
                          !isFinishing() &&
                          menuAutomationRunning &&
                          generation == menuAutomationGeneration;
              }

              private void finishMenuAutomation(
                      int generation,
                      String message) {
                  if (!isCurrentMenuAutomation(generation)) {
                      return;
                  }
                  menuAutomationRunning = false;
                  menuAutomationCompleted = true;
                  gpxChooserAwaiting = false;
                  statusText.setText(message);
              }

              private void failMenuAutomation(
                      int generation,
                      String message) {
                  if (generation != menuAutomationGeneration) {
                      return;
                  }
                  menuAutomationRunning = false;
                  menuAutomationCompleted = false;
                  gpxChooserAwaiting = false;
                  statusText.setText(message);
              }

              private String buildRenderedHamburgerClickScript() {
                  return "(function(){" +
                          "function visible(e,r){" +
                          "if(!e||!r||r.width<18||r.height<18)return false;" +
                          "var s=window.getComputedStyle(e);" +
                          "return s.display!=='none'&&s.visibility!=='hidden'&&" +
                          "Number(s.opacity||1)>0&&r.bottom>0&&r.right>0&&" +
                          "r.top<window.innerHeight&&r.left<window.innerWidth;}" +
                          "var nodes=document.querySelectorAll(" +
                          "'button,[role=\"button\"],a,[tabindex]');" +
                          "var best=null,bestScore=1e9,bestRect=null;" +
                          "for(var i=0;i<nodes.length;i++){" +
                          "var e=nodes[i],r=e.getBoundingClientRect();" +
                          "if(!visible(e,r)||r.left<0||r.top<0||" +
                          "r.right>145||r.bottom>125)continue;" +
                          "var cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2;" +
                          "if(cx>72||cy>72)continue;" +
                          "var score=cx*4+cy+r.left*2+r.top;" +
                          "if(score<bestScore){best=e;bestScore=score;bestRect=r;}" +
                          "}" +
                          "if(!best){" +
                          "var p=document.elementFromPoint(28,28);" +
                          "while(p&&p!==document.body){" +
                          "if(p.matches&&p.matches(" +
                          "'button,[role=\"button\"],a,[tabindex]')){" +
                          "var pr=p.getBoundingClientRect();" +
                          "if(visible(p,pr)&&pr.right<=145&&pr.bottom<=125){" +
                          "best=p;bestRect=pr;break;}}p=p.parentElement;}}" +
                          "if(!best||!bestRect)return 'WAIT';" +
                          "var x=(bestRect.left+bestRect.right)/2;" +
                          "var y=(bestRect.top+bestRect.bottom)/2;" +
                          "try{best.focus({preventScroll:true});}catch(ignore){}" +
                          "best.click();" +
                          "return 'CLICKED:'+Math.round(x)+','+Math.round(y);" +
                          "})();";
              }

              private String buildTextTargetClickScript(
                      String[] labels,
                      boolean containsMatch) {
                  String wanted = labelsToJavaScriptArray(labels);
                  return "(function(){" +
                          "var wanted=" + wanted + ";" +
                          "var containsMatch=" + containsMatch + ";" +
                          "function norm(v){return String(v||'')" +
                          ".replace(/\\u00a0/g,' ')" +
                          ".replace(/[‐‑‒–—―]/g,'-')" +
                          ".replace(/\\s+/g,' ').trim()" +
                          ".toLocaleLowerCase('hu-HU');}" +
                          "function visible(e,r){" +
                          "if(!e||!r||r.width<18||r.height<14)return false;" +
                          "var s=window.getComputedStyle(e);" +
                          "return s.display!=='none'&&s.visibility!=='hidden'&&" +
                          "Number(s.opacity||1)>0&&r.bottom>0&&r.right>0&&" +
                          "r.top<window.innerHeight&&r.left<window.innerWidth;}" +
                          "function disabled(e){return !!(e.disabled||" +
                          "e.getAttribute('aria-disabled')==='true');}" +
                          "function clickable(e){return !!(e&&e.matches&&" +
                          "e.matches('button,a,[role=\"button\"],[role=\"tab\"]," +
                          "[tabindex],li,label,input[type=\"file\"]'));}" +
                          "function matches(t){" +
                          "for(var j=0;j<wanted.length;j++){" +
                          "var w=norm(wanted[j]);" +
                          "if(t===w||(containsMatch&&t.indexOf(w)>=0))return j;}" +
                          "return -1;}" +
                          "var all=document.querySelectorAll('body *');" +
                          "var best=null,bestRect=null,bestScore=1e18,bestMatch=-1;" +
                          "for(var i=0;i<all.length;i++){" +
                          "var e=all[i];" +
                          "var text=norm((e.getAttribute('aria-label')||'')+' '+" +
                          "(e.getAttribute('title')||'')+' '+" +
                          "(e.innerText||e.textContent||'')+' '+(e.value||''));" +
                          "var match=matches(text);if(match<0)continue;" +
                          "var er=e.getBoundingClientRect();if(!visible(e,er))continue;" +
                          "var target=e;" +
                          "for(var n=0;n<8&&target&&target!==document.body;n++){" +
                          "var tr=target.getBoundingClientRect();" +
                          "var style=window.getComputedStyle(target);" +
                          "if(visible(target,tr)&&!disabled(target)&&" +
                          "(clickable(target)||style.cursor==='pointer'||target.onclick)){" +
                          "break;}target=target.parentElement;}" +
                          "if(!target||target===document.body)target=e;" +
                          "var r=target.getBoundingClientRect();" +
                          "if(!visible(target,r)||disabled(target))continue;" +
                          "var area=r.width*r.height;" +
                          "var exact=(text===norm(wanted[match]))?0:1000000;" +
                          "var score=exact+area+r.top*2+r.left;" +
                          "if(score<bestScore){best=target;bestRect=r;" +
                          "bestScore=score;bestMatch=match;}}" +
                          "if(!best||!bestRect)return 'WAIT_TARGET';" +
                          "try{best.scrollIntoView({block:'center',inline:'nearest'});}" +
                          "catch(ignore){}" +
                          "bestRect=best.getBoundingClientRect();" +
                          "if(!visible(best,bestRect))return 'WAIT_TARGET';" +
                          "var x=(bestRect.left+bestRect.right)/2;" +
                          "var y=(bestRect.top+bestRect.bottom)/2;" +
                          "try{best.focus({preventScroll:true});}catch(ignore){}" +
                          "best.click();" +
                          "return 'TARGET_CLICKED:'+bestMatch+':' +" +
                          "Math.round(x)+','+Math.round(y);" +
                          "})();";
              }

