              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  loadState();
                  handleIncomingIntent(getIntent());
                  handler.postDelayed(
                          this::promptForGoogleApiKeyIfMissing, 350L);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String incomingAction = intent == null ? null : intent.getAction();
                  handleIncomingIntent(intent);
                  handler.postDelayed(() -> {
                      loadState();
                      if (!ACTION_IMPORT_MAPS_CLIPBOARD.equals(incomingAction) &&
                              !Intent.ACTION_SEND.equals(incomingAction)) {
                          autoGeocodeMissingPoints();
                      }
                  }, 150L);
              }

              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;

                  if (ACTION_IMPORT_MAPS_CLIPBOARD.equals(intent.getAction())) {
                      intent.setAction(null);
                      handler.postDelayed(
                              this::importMapsLinkFromClipboard,
                              500L);
                      return;
                  }

                  handleIncomingShare(intent);
              }

              private void importMapsLinkFromClipboard() {
                  ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);

                  if (clipboard == null || !clipboard.hasPrimaryClip()) {
                      Toast.makeText(this,
                              "A Google Maps nem másolt helylinket. " +
                              "Nyisd meg újra a pontos helyet, majd nyomd meg a + gombot.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  ClipData clip = clipboard.getPrimaryClip();
                  if (clip == null || clip.getItemCount() == 0) {
                      Toast.makeText(this,
                              "A vágólapon nincs feldolgozható Google Maps link.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  CharSequence value = clip.getItemAt(0).coerceToText(this);
                  String shared = value == null ? "" : value.toString().trim();

                  if (shared.isEmpty()) {
                      Toast.makeText(this,
                              "A Google Maps üres linket másolt.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  Toast.makeText(this,
                          "A Google Maps koordináta beolvasása folyamatban…",
                          Toast.LENGTH_LONG).show();

                  new Thread(() -> resolveSharedPlace(
                          shared, ""), "maps-clipboard-resolver").start();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshTomTomLoginButton();
                  loadState();
                  handler.postDelayed(
                          this::autoGeocodeMissingPoints, 250L);
              }

              @Override
              protected void onPause() {
                  saveQueriesAndWaypoints();
                  super.onPause();
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {
                  super.onRequestPermissionsResult(
                          requestCode, permissions, grantResults);
                  if (requestCode != REQUEST_ROUTE_LOCATION) return;

                  if ((checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION) ==
                                          PackageManager.PERMISSION_GRANTED ||
                           checkSelfPermission(
                                  Manifest.permission.ACCESS_COARSE_LOCATION) ==
                                          PackageManager.PERMISSION_GRANTED) &&
                          pendingRouteTargets != null) {
                      ArrayList<String> targets =
                              new ArrayList<>(pendingRouteTargets);
                      pendingRouteTargets = null;
                      resolveCurrentLocationAndSave(targets);
                  } else {
                      pendingRouteTargets = null;
                      Toast.makeText(this,
                              "Az aktuális indulási ponthoz helyhozzáférés szükséges.",
                              Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onDestroy() {
                  stopPendingLocationRequest();
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }

