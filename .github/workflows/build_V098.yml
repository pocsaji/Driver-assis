              private void showCredentialsDialog(boolean firstSetup) {
                  if (credentialPromptShown && firstSetup) return;
                  credentialPromptShown = true;

                  EditText email = new EditText(this);
                  email.setHint("TomTom e-mail cím");
                  email.setSingleLine(true);
                  email.setTextColor(Color.WHITE);
                  email.setHintTextColor(Color.rgb(130, 140, 150));
                  email.setInputType(
                          InputType.TYPE_CLASS_TEXT |
                                  InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                  email.setText(TomTomCredentialStore.email(this));

                  EditText password = new EditText(this);
                  password.setHint("TomTom jelszó");
                  password.setSingleLine(true);
                  password.setTextColor(Color.WHITE);
                  password.setHintTextColor(Color.rgb(130, 140, 150));
                  password.setInputType(
                          InputType.TYPE_CLASS_TEXT |
                                  InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  password.setText(TomTomCredentialStore.password(this));

                  LinearLayout holder = new LinearLayout(this);
                  holder.setOrientation(LinearLayout.VERTICAL);
                  holder.setPadding(dp(20), dp(6), dp(20), 0);
                  holder.addView(email, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));
                  LinearLayout.LayoutParams passwordParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT);
                  passwordParams.topMargin = dp(8);
                  holder.addView(password, passwordParams);

                  AlertDialog dialog = new AlertDialog.Builder(this)
                          .setTitle("TomTom bejelentkezési adatok")
                          .setMessage(
                                  "Egyszer kell megadni. Az e-mail cím helyben, " +
                                  "a jelszó Android Keystore titkosítással kerül " +
                                  "elmentésre ezen a telefonon.")
                          .setView(holder)
                          .setPositiveButton("MENTÉS", null)
                          .setNegativeButton("MÉGSE", null)
                          .setNeutralButton("TÖRLÉS", null)
                          .create();

                  dialog.setOnShowListener(ignored -> {
                      dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                              .setOnClickListener(v -> {
                                  try {
                                      TomTomCredentialStore.save(
                                              this,
                                              email.getText().toString(),
                                              password.getText().toString());
                                      dialog.dismiss();
                                      refreshStatus();
                                      fillSavedCredentials();
                                  } catch (Exception error) {
                                      email.setError(error.getMessage());
                                  }
                              });
                      dialog.getButton(AlertDialog.BUTTON_NEUTRAL)
                              .setOnClickListener(v -> {
                                  TomTomCredentialStore.clear(this);
                                  email.setText("");
                                  password.setText("");
                                  refreshStatus();
                                  dialog.dismiss();
                              });
                  });
                  dialog.setOnDismissListener(ignored ->
                          credentialPromptShown = false);
                  dialog.show();
              }

              private void fillSavedCredentials() {
                  String email = TomTomCredentialStore.email(this);
                  String password = TomTomCredentialStore.password(this);
                  if (email.isEmpty() || password.isEmpty()) {
                      showCredentialsDialog(true);
                      return;
                  }

                  String script = "(function(){" +
                          "function setValue(el,val){" +
                          "if(!el){return false;}" +
                          "var proto=Object.getPrototypeOf(el);" +
                          "var d=Object.getOwnPropertyDescriptor(proto,'value');" +
                          "if(d&&d.set){d.set.call(el,val);}else{el.value=val;}" +
                          "el.dispatchEvent(new Event('input',{bubbles:true}));" +
                          "el.dispatchEvent(new Event('change',{bubbles:true}));" +
                          "return true;}" +
                          "var e=document.querySelector(" +
                          "'input[type=email],input[autocomplete=username]," +
                          "input[name*=email i],input[name*=user i]');" +
                          "var p=document.querySelector(" +
                          "'input[type=password],input[autocomplete=current-password]');" +
                          "var er=setValue(e," + JSONObject.quote(email) + ");" +
                          "var pr=setValue(p," + JSONObject.quote(password) + ");" +
                          "return (er?'E':'')+(pr?'P':'');" +
                          "})();";

                  webView.evaluateJavascript(script, result -> {
                      if (result != null &&
                              (result.contains("E") || result.contains("P"))) {
                          statusText.setText(
                                  "A mentett TomTom-adatok beillesztve. " +
                                  "A belépés gombot kézzel nyomd meg.");
                      }
                  });
              }

              private void acceptCookieBanner() {
                  String script = "(function(){" +
                          "var words=['accept all','allow all','agree all'," +
                          "'összes elfogadása','mindent elfogad','elfogadom'," +
                          "'tout accepter','accepter tout','alle akzeptieren'," +
