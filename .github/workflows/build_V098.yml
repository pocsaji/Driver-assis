                      JSONObject result,
                      String... acceptedTypes) {
                  JSONArray components = result.optJSONArray("address_components");
                  if (components == null) return "";

                  for (String acceptedType : acceptedTypes) {
                      for (int index = 0; index < components.length(); index++) {
                          JSONObject component = components.optJSONObject(index);
                          if (component == null) continue;
                          JSONArray types = component.optJSONArray("types");
                          if (types == null) continue;
                          for (int typeIndex = 0; typeIndex < types.length(); typeIndex++) {
                              if (acceptedType.equals(types.optString(typeIndex))) {
                                  return cleanQuery(component.optString("long_name", ""));
                              }
                          }
                      }
                  }
                  return "";
              }

              private String googleAddressComponentShort(
                      JSONObject result,
                      String acceptedType) {
                  JSONArray components = result.optJSONArray("address_components");
                  if (components == null) return "";

                  for (int index = 0; index < components.length(); index++) {
                      JSONObject component = components.optJSONObject(index);
                      if (component == null) continue;
