              private void openNextPointForReview() {
                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);

                  ArrayList<ReviewPoint> points = new ArrayList<>();
                  points.add(new ReviewPoint(
                          TARGET_PICKUP,
                          -1,
                          "Felrakó",
                          preferences.getString(KEY_PICKUP_QUERY, ""),
                          preferences.getString(KEY_PICKUP_COORD, "")));

                  List<String> waypoints = cleanLines(
                          preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> waypointLabels = cleanLines(
                          preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  for (int index = 0; index < waypoints.size(); index++) {
                      points.add(new ReviewPoint(
                              TARGET_WAYPOINT,
                              index,
                              index < waypointLabels.size()
                                      ? waypointLabels.get(index)
                                      : "Köztes " + (index + 1),
                              waypoints.get(index),
                              waypoints.get(index)));
                  }

                  points.add(new ReviewPoint(
                          TARGET_DELIVERY,
                          -1,
                          "Lerakó",
                          preferences.getString(KEY_DELIVERY_QUERY, ""),
                          preferences.getString(KEY_DELIVERY_COORD, "")));

                  ArrayList<ReviewPoint> usable = new ArrayList<>();
                  for (ReviewPoint point : points) {
                      if (!cleanQuery(point.query).isBlank() ||
                              normalizeCoordinate(point.coordinate) != null) {
                          usable.add(point);
                      }
                  }

                  if (usable.isEmpty()) {
                      Toast.makeText(this,
                              "Nincs ellenőrizhető cím.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  int cursor = preferences.getInt(KEY_REVIEW_CURSOR, 0);
                  if (cursor < 0 || cursor >= usable.size()) cursor = 0;
                  ReviewPoint point = usable.get(cursor);
                  preferences.edit()
                          .putInt(KEY_REVIEW_CURSOR, (cursor + 1) % usable.size())
                          .apply();

                  String coordinate = normalizeCoordinate(point.coordinate);
                  if (coordinate != null) {
                      openMapsForPoint(point, coordinate, true);
                  } else {
                      openMapsForPoint(point, cleanAddressQuery(point.query), false);
                  }
              }

              private void openMapsForPoint(
                      ReviewPoint point,
                      String value,
                      boolean exactCoordinate) {
                  if (value == null || value.isBlank()) return;

                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString(KEY_PENDING_TARGET, point.target)
                          .putInt(KEY_PENDING_INDEX, point.index)
                          .putString(KEY_PENDING_QUERY, cleanAddressQuery(point.query))
                          .apply();

                  String mapsQuery = exactCoordinate
                          ? value.replace(' ', ',')
                          : value;
                  Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0?q=" + Uri.encode(mapsQuery)));
                  intent.setPackage(GOOGLE_MAPS_PACKAGE);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);

                  try {
                      startActivity(intent);
                      Toast.makeText(this,
                              exactCoordinate
                                      ? point.label +
                                              ": a TomTomnak küldendő koordinátát nyitottam meg."
                                      : point.label +
                                              ": még nincs koordináta, ezért a címet kerestem meg.",
                              Toast.LENGTH_LONG).show();
                  } catch (ActivityNotFoundException | SecurityException error) {
                      Toast.makeText(this,
                              "A Google Maps nem nyitható meg.",
                              Toast.LENGTH_LONG).show();
                  }
              }

