              private void saveGeocodedEndpoint(
                      String target,
                      SharedPlace place,
                      String warning) {
                  SharedPreferences.Editor editor =
                          getSharedPreferences(PREFS, MODE_PRIVATE).edit();
                  if (TARGET_PICKUP.equals(target)) {
                      editor.putString(KEY_PICKUP_COORD, place.coordinate)
                              .putString(KEY_PICKUP_LABEL, place.label)
                              .putString(KEY_PICKUP_WARNING, warning == null ? "" : warning);
                  } else if (TARGET_DELIVERY.equals(target)) {
                      editor.putString(KEY_DELIVERY_COORD, place.coordinate)
                              .putString(KEY_DELIVERY_LABEL, place.label)
                              .putString(KEY_DELIVERY_WARNING, warning == null ? "" : warning);
