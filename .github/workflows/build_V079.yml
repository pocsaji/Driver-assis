          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          print('V079_MOBILE_TOMTOM_MENU_AUDIT_OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V079 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V079 release files
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V079.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V079.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V079
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V079
          path: |
            artifact/TomTom_Kiszolgalo_V079.apk
            artifact/TomTom_Kiszolgalo_V079.aab
          if-no-files-found: error
