              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  connectedInstance = this;
                  AccessibilityServiceInfo info = getServiceInfo();
                  if (info != null) {
                      info.flags |= AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS |
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS;
                      setServiceInfo(info);
                  }
                  textRecognizer = TextRecognition.getClient(
                          TextRecognizerOptions.DEFAULT_OPTIONS);
                  // A régi, közvetlen TomTom-képernyővezérlés maradék állapota törölhető.
                  // A jelenlegi webes GPX-feltöltés állapotát viszont nem töröljük:
                  // egy szolgáltatás-újracsatlakozás nem szakíthatja félbe a felhasználó kérését.
                  getSharedPreferences("tomtom_automation_v069", MODE_PRIVATE)
                          .edit().clear().apply();
                  removeFloatingButton();
                  createFloatingButton();
                  if (isWebUploadActive()) {
                      startWebUploadFromPreferences();
                  }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null || event.getPackageName() == null) return;

                  String packageName = event.getPackageName().toString();
                  if (GOOGLE_MAPS_PACKAGE.equals(packageName)) {
                      foregroundPackage = packageName;
                  } else if (!hasPendingMapTarget() &&
                          (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                           event.getEventType() == AccessibilityEvent.TYPE_WINDOWS_CHANGED)) {
                      foregroundPackage = packageName;
                  }

                  updateFloatingButton();

                  if (shareCopyActive &&
                          (GOOGLE_MAPS_PACKAGE.equals(packageName) ||
                           isShareUiPackage(packageName))) {
                      scheduleShareCopySelection(180L);
                  }

                  if (!isWebUploadActive()) return;
                  if (webUploadStage == WEB_STAGE_IDLE) {
                      startWebUploadFromPreferences();
                      return;
                  }

                  boolean expectedFilePicker =
                          isWebFilePickerPackage(packageName) &&
                          webUploadStage == WEB_STAGE_PICK_FILE &&
                          webFilePickerArmedUntil > 0L &&
                          SystemClock.uptimeMillis() <=
                                  webFilePickerArmedUntil;
                  if (isWebBrowserPackage(packageName) ||
                          expectedFilePicker ||
                          event.getEventType() ==
                                  AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                          event.getEventType() ==
                                  AccessibilityEvent.TYPE_WINDOWS_CHANGED) {
                      scheduleWebUploadStep(160L);
                  }
              }

              @Override
              public void onInterrupt() {
                  /*
                   * Az Android ablak- vagy alkalmazásváltáskor is meghívhatja ezt.
                   * Ez nem valódi leállítási parancs, ezért a felhasználó által
                   * elindított webes GPX-feltöltést itt tilos törölni.
                   */
                  if (captureMode != CAPTURE_NONE || shareCopyActive) {
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;
                      captureToken++;
                      finishProcessing();
                  }
              }

              @Override
              public void onDestroy() {
                  if (connectedInstance == this) connectedInstance = null;
                  handler.removeCallbacks(webUploadStepRunnable);
                  webUploadStepScheduled = false;
                  handler.removeCallbacksAndMessages(null);
                  shareCopyActive = false;
                  shareCopyStepScheduled = false;
                  removeFloatingButton();
                  if (textRecognizer != null) textRecognizer.close();
                  super.onDestroy();
              }

              private void createFloatingButton() {
                  if (floatingButton != null) return;
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  floatingButton = new Button(this);
                  floatingButtonMode = "";
                  floatingButton.setText("SG");
                  floatingButton.setTextSize(18);
                  floatingButton.setTextColor(Color.WHITE);
                  floatingButton.setAllCaps(false);
                  setButtonColor(Color.rgb(0, 150, 75));

                  floatingParams = new WindowManager.LayoutParams(
                          dp(74),
                          dp(74),
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  floatingParams.gravity = Gravity.END | Gravity.CENTER_VERTICAL;
                  floatingParams.x = dp(14);
                  floatingParams.y = 0;

                  floatingButton.setOnClickListener(v -> handleFloatingClick());
                  floatingButton.setOnTouchListener(new DragTouchListener());

                  try {
                      windowManager.addView(floatingButton, floatingParams);
                      updateFloatingButton();
                  } catch (RuntimeException error) {
                      floatingButton = null;
                  }
              }

              private void removeFloatingButton() {
                  if (windowManager != null && floatingButton != null) {
                      try {
                          windowManager.removeView(floatingButton);
                      } catch (RuntimeException ignored) {
                      }
                  }
                  floatingButton = null;
                  floatingParams = null;
                  floatingButtonMode = "";
              }

              private void updateFloatingButton() {
                  if (floatingButton == null) return;

                  String mode;
                  if (isWebUploadActive()) {
                      mode = "stop";
                  } else if (processing.get()) {
                      mode = "busy";
                  } else {
                      boolean mapsMode = hasPendingMapTarget() ||
                              GOOGLE_MAPS_PACKAGE.equals(foregroundPackage) ||
                              isGoogleMapsWindowVisible();
                      mode = mapsMode ? "maps" : "scan";
                  }

                  if (mode.equals(floatingButtonMode)) return;
                  floatingButtonMode = mode;

                  if ("stop".equals(mode)) {
                      floatingButton.setText("STOP");
                      floatingButton.setContentDescription(
                              "A futó automatizálás leállítása");
                      setButtonColor(Color.rgb(190, 45, 45));
                  } else if ("busy".equals(mode)) {
                      floatingButton.setText("…");
                      floatingButton.setContentDescription(
                              "Feldolgozás folyamatban; megnyomva leállítható");
                      setButtonColor(Color.rgb(230, 145, 35));
                  } else if ("maps".equals(mode)) {
                      floatingButton.setText("+");
                      floatingButton.setContentDescription(
                              "A Google Maps kiválasztott helyének megosztása a TomTom Kiszolgálóval");
                      setButtonColor(Color.rgb(44, 116, 214));
                  } else {
                      floatingButton.setText("SG");
                      floatingButton.setContentDescription(
                              "Felrakó és lerakó címének felismerése");
                      setButtonColor(Color.rgb(0, 150, 75));
                  }
              }

              private boolean hasPendingMapTarget() {
                  String target = getSharedPreferences(
                          MainActivity.PREFS, MODE_PRIVATE)
                          .getString(MainActivity.KEY_PENDING_TARGET, "");
                  return MainActivity.TARGET_PICKUP.equals(target) ||
                          MainActivity.TARGET_DELIVERY.equals(target) ||
                          MainActivity.TARGET_WAYPOINT.equals(target);
              }

              private boolean isGoogleMapsWindowVisible() {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return false;

                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;
                      try {
                          CharSequence packageName = root.getPackageName();
                          if (packageName != null &&
                                  GOOGLE_MAPS_PACKAGE.contentEquals(packageName)) {
                              return true;
                          }
                      } finally {
                          root.recycle();
                      }
                  }
                  return false;
              }

              private void setButtonColor(int color) {
                  if (floatingButton == null) return;
                  android.graphics.drawable.GradientDrawable background =
                          new android.graphics.drawable.GradientDrawable();
                  background.setShape(
                          android.graphics.drawable.GradientDrawable.OVAL);
                  background.setColor(color);
                  background.setStroke(dp(2), Color.WHITE);
                  floatingButton.setBackground(background);
              }

              private void handleFloatingClick() {
                  if (isWebUploadActive()) {
                      failWebUpload("A TomTom webes feltöltés leállítva.");
                      return;
                  }
                  if (processing.get()) {
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;
                      finishProcessing();
                      Toast.makeText(this,
                              "A folyamat leállítva.",
                              Toast.LENGTH_SHORT).show();
                      return;
                  }

                  boolean pendingMap = hasPendingMapTarget();
                  boolean mapsVisible = isGoogleMapsWindowVisible();

                  if (pendingMap) {
                      if (!mapsVisible) {
                          Toast.makeText(this,
                                  "Térj vissza a Google Maps pontos helyadatlapjára, " +
                                  "majd nyomd meg a + gombot.",
                                  Toast.LENGTH_LONG).show();
                          return;
                      }

                      String directCoordinate =
                              findCoordinateInGoogleMapsSearchField();
                      if (directCoordinate != null) {
                          if (!processing.compareAndSet(false, true)) return;
                          updateFloatingButton();
                          savePendingCoordinateDirect(directCoordinate);
                          finishProcessing();
                          return;
                      }

                      startMapShareFlow();
                      return;
                  }

                  if (!processing.compareAndSet(false, true)) return;

                  captureMode = CAPTURE_ROUTE;
                  captureToken++;
                  final int token = captureToken;
                  updateFloatingButton();

                  handler.postDelayed(() -> {
                      if (processing.get() && captureToken == token) {
                          Toast.makeText(this,
                                  "A fuvarfeladat beolvasása nem fejeződött be. " +
                                  "Az SG gombot visszaállítottam.",
                                  Toast.LENGTH_LONG).show();
                          finishProcessing();
                      }
                  }, 10000L);

                  if (floatingButton != null) {
                      floatingButton.setVisibility(View.INVISIBLE);
                  }
                  handler.postDelayed(this::captureScreenshot, 180L);
              }

              private String findCoordinateInGoogleMapsSearchField() {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return null;

                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;

                      try {
                          CharSequence packageName = root.getPackageName();
                          if (packageName == null ||
                                  !GOOGLE_MAPS_PACKAGE.contentEquals(packageName)) {
                              continue;
                          }

                          String coordinate = findCoordinateInSearchNode(root);
                          if (coordinate != null) return coordinate;
                      } finally {
                          root.recycle();
                      }
                  }
                  return null;
              }

              private String findCoordinateInSearchNode(
                      AccessibilityNodeInfo node) {
                  if (node == null) return null;

                  CharSequence className = node.getClassName();
                  String viewId = node.getViewIdResourceName();
                  boolean searchField = node.isEditable() ||
                          (className != null &&
                           className.toString().contains("EditText")) ||
                          (viewId != null &&
                           viewId.toLowerCase(Locale.ROOT).contains("search"));

                  if (searchField) {
                      String coordinate = exactCoordinate(node.getText());
                      if (coordinate == null) {
                          coordinate = exactCoordinate(
                                  node.getContentDescription());
                      }
                      if (coordinate != null) return coordinate;
                  }

                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          String coordinate = findCoordinateInSearchNode(child);
                          if (coordinate != null) return coordinate;
                      } finally {
                          child.recycle();
                      }
                  }
                  return null;
              }

              private String exactCoordinate(CharSequence value) {
                  if (value == null) return null;
                  String candidate = value.toString()
                          .replace('−', '-')
                          .trim();
                  if (candidate.isEmpty()) return null;

                  Matcher matcher = COORDINATE_PATTERN.matcher(candidate);
                  if (!matcher.find()) return null;
                  if (!candidate.substring(0, matcher.start()).trim().isEmpty() ||
                          !candidate.substring(matcher.end()).trim().isEmpty()) {
                      return null;
                  }

                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (Math.abs(latitude) > 90d ||
                              Math.abs(longitude) > 180d) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }

              private void savePendingCoordinateDirect(String coordinate) {
                  SharedPreferences preferences =
                          getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
                  String target = preferences.getString(
                          MainActivity.KEY_PENDING_TARGET, "");
                  int pendingIndex = preferences.getInt(
                          MainActivity.KEY_PENDING_INDEX, -1);

                  SharedPreferences.Editor editor = preferences.edit();

                  if (MainActivity.TARGET_PICKUP.equals(target)) {
                      editor.putString(
                                      MainActivity.KEY_PICKUP_COORD, coordinate)
                              .remove(MainActivity.KEY_PICKUP_LABEL);
                  } else if (MainActivity.TARGET_DELIVERY.equals(target)) {
                      editor.putString(
                                      MainActivity.KEY_DELIVERY_COORD, coordinate)
                              .remove(MainActivity.KEY_DELIVERY_LABEL);
                  } else if (MainActivity.TARGET_WAYPOINT.equals(target)) {
                      List<String> coordinates = cleanStoredLines(
                              preferences.getString(
                                      MainActivity.KEY_WAYPOINTS, ""));
                      List<String> labels = cleanStoredLines(
                              preferences.getString(
                                      MainActivity.KEY_WAYPOINT_LABELS, ""));

                      while (labels.size() < coordinates.size()) {
                          labels.add("Köztes " + (labels.size() + 1));
                      }

                      if (pendingIndex >= 0 &&
                              pendingIndex < coordinates.size()) {
                          coordinates.set(pendingIndex, coordinate);
                      } else {
                          coordinates.add(coordinate);
                          labels.add("Köztes " + coordinates.size());
                      }

                      editor.putString(
                                      MainActivity.KEY_WAYPOINTS,
                                      String.join("\n", coordinates))
                              .putString(
                                      MainActivity.KEY_WAYPOINT_LABELS,
                                      String.join("\n", labels));
                  } else {
                      Toast.makeText(this,
                              "Nincs kijelölt felrakó, lerakó vagy köztes pont.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  editor.remove(MainActivity.KEY_PENDING_TARGET)
                          .remove(MainActivity.KEY_PENDING_INDEX)
                          .remove(MainActivity.KEY_PENDING_QUERY)
                          .putInt(MainActivity.KEY_REVIEW_CURSOR, 0)
                          .apply();

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);

                  Toast.makeText(this,
                          "Koordináta beillesztve: " + coordinate,
                          Toast.LENGTH_LONG).show();
              }

              private List<String> cleanStoredLines(String value) {
                  ArrayList<String> lines = new ArrayList<>();
                  if (value == null || value.isBlank()) return lines;

                  for (String line : value.split("\\r?\\n")) {
                      String clean = line.trim();
                      if (!clean.isEmpty()) lines.add(clean);
                  }
                  return lines;
              }

              private void startMapShareFlow() {
                  if (!processing.compareAndSet(false, true)) return;

                  updateFloatingButton();

                  AccessibilityNodeInfo share = findControlInAllWindows(
                          "MEGOSZTÁS",
                          "SHARE",
                          "PARTAGER",
                          "TEILEN",
                          "CONDIVIDI",
                          "COMPARTIR");
                  if (share == null || !clickNodeOrAncestor(share)) {
                      if (share != null) share.recycle();
                      Toast.makeText(this,
                              "A Google Maps Megosztás gombja nem található. " +
                              "Nyisd meg a hely teljes adatlapját, majd próbáld újra.",
                              Toast.LENGTH_LONG).show();
                      finishProcessing();
                      return;
                  }
                  share.recycle();

                  shareCopyActive = true;
                  shareCopyAttempts = 0;
                  Toast.makeText(this,
                          "A helylink másolása és a koordináta visszahozása folyamatban…",
                          Toast.LENGTH_SHORT).show();
                  scheduleShareCopySelection(450L);
              }

              private void scheduleShareCopySelection(long delayMs) {
                  if (!shareCopyActive || shareCopyStepScheduled) return;
                  shareCopyStepScheduled = true;
                  handler.postDelayed(() -> {
                      shareCopyStepScheduled = false;
                      tryCopySharedMapLink();
                  }, delayMs);
              }

              private void tryCopySharedMapLink() {
                  if (!shareCopyActive) return;

                  AccessibilityNodeInfo activeRoot = getRootInActiveWindow();
                  if (activeRoot == null || activeRoot.getPackageName() == null) {
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;
                      finishProcessing();
                      return;
                  }
                  String activePackage = activeRoot.getPackageName().toString();
                  activeRoot.recycle();
                  if (!GOOGLE_MAPS_PACKAGE.equals(activePackage) &&
                          !isShareUiPackage(activePackage)) {
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;
                      finishProcessing();
                      return;
                  }

                  shareCopyAttempts++;
                  AccessibilityNodeInfo copyLink = findControlInAllWindows(
                          "LINK MÁSOLÁSA",
                          "HIVATKOZÁS MÁSOLÁSA",
                          "MÁSOLÁS VÁGÓLAPRA",
                          "MÁSOLÁS",
                          "COPY LINK",
                          "COPY TO CLIPBOARD",
                          "COPIER LE LIEN",
                          "COPIER",
                          "LINK KOPIEREN",
                          "KOPIEREN");

                  if (copyLink != null && clickNodeOrAncestor(copyLink)) {
                      copyLink.recycle();
                      shareCopyActive = false;
                      shareCopyStepScheduled = false;

                      handler.postDelayed(() -> {
                          Intent intent = new Intent(this, MainActivity.class);
                          intent.setAction(MainActivity.ACTION_IMPORT_MAPS_CLIPBOARD);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP |
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(intent);
                          finishProcessing();
                      }, 650L);
                      return;
                  }
                  if (copyLink != null) copyLink.recycle();

                  if (shareCopyAttempts < 16) {
                      scheduleShareCopySelection(300L);
                      return;
                  }

                  shareCopyActive = false;
                  shareCopyStepScheduled = false;
                  Toast.makeText(this,
                          "A Link másolása gombot nem találtam. " +
                          "A megosztási ablakban nyomd meg kézzel a Link másolása/Másolás gombot, " +
                          "majd nyisd meg újra a TomTom Kiszolgálót.",
                          Toast.LENGTH_LONG).show();
                  finishProcessing();
              }

              private AccessibilityNodeInfo findControlInAllWindows(
                      String... keywords) {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return null;

                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) continue;
                      try {
                          CharSequence packageValue = root.getPackageName();
                          String packageName = packageValue == null
                                  ? "" : packageValue.toString();
                          if (!GOOGLE_MAPS_PACKAGE.equals(packageName) &&
                                  !isShareUiPackage(packageName)) {
                              continue;
                          }
                          AccessibilityNodeInfo found = findControlRecursive(
                                  root, keywords);
                          if (found != null) return found;
                      } finally {
                          root.recycle();
                      }
                  }
                  return null;
              }

              private boolean isShareUiPackage(String packageName) {
                  if (packageName == null) return false;
                  String lower = packageName.toLowerCase(Locale.ROOT);
                  return "android".equals(lower) ||
                          lower.contains("intentresolver") ||
                          lower.contains("resolver") ||
                          lower.contains("sharesheet") ||
                          lower.contains("sharelive") ||
                          lower.contains("systemui");
              }

              private AccessibilityNodeInfo findControlRecursive(
                      AccessibilityNodeInfo node,
                      String... keywords) {
                  if (node == null) return null;

                  String combined = clean(
                          String.valueOf(node.getText()) + " " +
                          String.valueOf(node.getContentDescription()) + " " +
                          String.valueOf(node.getHintText()));
                  String normalizedCombined = normalized(combined);

                  for (String keyword : keywords) {
                      if (normalizedCombined.contains(normalized(keyword))) {
                          return AccessibilityNodeInfo.obtain(node);
                      }
                  }

                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          AccessibilityNodeInfo found = findControlRecursive(
                                  child, keywords);
                          if (found != null) return found;
                      } finally {
                          child.recycle();
                      }
                  }
                  return null;
              }

              private boolean clickNodeOrAncestor(
                      AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current =
                          AccessibilityNodeInfo.obtain(node);
                  try {
                      for (int depth = 0; depth < 8 && current != null; depth++) {
                          if (current.isClickable() &&
                                  current.performAction(
                                          AccessibilityNodeInfo.ACTION_CLICK)) {
                              return true;
                          }

                          AccessibilityNodeInfo parent = current.getParent();
                          current.recycle();
                          current = parent;
                      }
                      return false;
                  } finally {
                      if (current != null) current.recycle();
                  }
              }

              private void captureScreenshot() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      handleLines(readVisibleLines(null));
                      return;
                  }

                  takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          getMainExecutor(),
                          new TakeScreenshotCallback() {
                              @Override
                              public void onSuccess(ScreenshotResult screenshot) {
                                  recognizeScreenshot(screenshot);
                              }

                              @Override
                              public void onFailure(int errorCode) {
                                  handleLines(readVisibleLines(null));
                              }
                          });
              }

              private void recognizeScreenshot(ScreenshotResult screenshot) {
                  HardwareBuffer buffer = screenshot.getHardwareBuffer();
                  Bitmap hardwareBitmap = null;
                  Bitmap bitmap = null;
                  try {
                      hardwareBitmap = Bitmap.wrapHardwareBuffer(
                              buffer, screenshot.getColorSpace());
                      if (hardwareBitmap != null) {
                          bitmap = hardwareBitmap.copy(Bitmap.Config.ARGB_8888, false);
                      }
                  } catch (RuntimeException ignored) {
                  } finally {
                      if (hardwareBitmap != null) hardwareBitmap.recycle();
                      buffer.close();
                  }

                  if (bitmap == null) {
                      handleLines(readVisibleLines(null));
                      return;
                  }

                  final Bitmap finalBitmap = bitmap;
                  InputImage image = InputImage.fromBitmap(finalBitmap, 0);
                  Task<Text> task = textRecognizer.process(image);
                  task.addOnSuccessListener(this::handleRecognizedText)
                          .addOnFailureListener(error ->
                                  handleLines(readVisibleLines(null)))
                          .addOnCompleteListener(done -> finalBitmap.recycle());
              }

              private void handleRecognizedText(Text visionText) {
                  List<OcrLine> positioned = new ArrayList<>();
                  for (Text.TextBlock block : visionText.getTextBlocks()) {
                      for (Text.Line line : block.getLines()) {
                          String value = clean(line.getText());
                          Rect box = line.getBoundingBox();
                          if (!value.isEmpty() && box != null) {
                              positioned.add(new OcrLine(value, box.top, box.left));
                          }
                      }
                  }

                  positioned.sort((a, b) -> {
                      if (Math.abs(a.top - b.top) <= dp(12)) {
                          return Integer.compare(a.left, b.left);
                      }
                      return Integer.compare(a.top, b.top);
                  });

                  List<String> lines = new ArrayList<>();
                  for (OcrLine line : positioned) lines.add(line.text);
                  handleLines(lines);
              }

              private void handleLines(List<String> lines) {
                  RouteEndpoints endpoints = RouteParser.extract(lines);
                  if (endpoints.pickup == null && endpoints.delivery == null) {
                      Toast.makeText(this,
                              "Nem találtam felrakó/lerakó blokkot. " +
                              "Maradj a fuvarfeladat címes képernyőjén, majd nyomd meg újra az SG gombot.",
                              Toast.LENGTH_LONG).show();
                      finishProcessing();
                      return;
                  }

                  SharedPreferences.Editor editor =
                          getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE).edit();
                  if (endpoints.pickup != null) {
                      editor.putString(MainActivity.KEY_PICKUP_QUERY, endpoints.pickup)
                              .remove(MainActivity.KEY_PICKUP_COORD)
                              .remove(MainActivity.KEY_PICKUP_LABEL);
                  }
                  if (endpoints.delivery != null) {
                      editor.putString(MainActivity.KEY_DELIVERY_QUERY, endpoints.delivery)
                              .remove(MainActivity.KEY_DELIVERY_COORD)
                              .remove(MainActivity.KEY_DELIVERY_LABEL);
                  }
                  editor.remove(MainActivity.KEY_PENDING_TARGET)
                          .remove(MainActivity.KEY_PENDING_INDEX)
                          .remove(MainActivity.KEY_PENDING_QUERY)
                          .apply();

                  Toast.makeText(this,
                          "A képernyőn megtalált címek beolvasva.",
                          Toast.LENGTH_SHORT).show();
                  openEditor();
                  finishProcessing();
              }

              private void openEditor() {
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);
              }

              private List<String> readVisibleLines(String packageFilter) {
                  AccessibilityNodeInfo root = findPackageRoot(packageFilter);
                  if (root == null) return Collections.emptyList();

                  ArrayList<String> lines = new ArrayList<>();
                  try {
                      collectText(root, packageFilter, lines);
                  } finally {
                      root.recycle();
                  }
                  return lines;
              }

              private AccessibilityNodeInfo findPackageRoot(String packageFilter) {
                  if (packageFilter != null) {
                      List<AccessibilityWindowInfo> windows = getWindows();
                      if (windows != null) {
                          for (AccessibilityWindowInfo window : windows) {
                              if (window == null) continue;
                              AccessibilityNodeInfo root = window.getRoot();
                              if (root == null) continue;

                              CharSequence packageName = root.getPackageName();
                              if (packageName != null &&
                                      packageFilter.contentEquals(packageName)) {
                                  return root;
                              }
                              root.recycle();
                          }
                      }
                  }

                  AccessibilityNodeInfo active = getRootInActiveWindow();
                  if (active == null) return null;
                  if (packageFilter == null) return active;

                  CharSequence packageName = active.getPackageName();
                  if (packageName != null &&
                          packageFilter.contentEquals(packageName)) {
                      return active;
                  }
                  active.recycle();
                  return null;
              }

              private void collectText(
                      AccessibilityNodeInfo node,
                      String packageFilter,
                      List<String> output) {
                  if (node == null) return;

                  CharSequence packageName = node.getPackageName();
                  boolean packageAllowed = packageFilter == null ||
                          packageName == null ||
                          packageFilter.contentEquals(packageName);

                  if (packageAllowed) {
                      addText(output, node.getText());
                      addText(output, node.getContentDescription());
                      addText(output, node.getHintText());
                  }

                  for (int index = 0; index < node.getChildCount(); index++) {
                      AccessibilityNodeInfo child = node.getChild(index);
                      if (child == null) continue;
                      try {
                          collectText(child, packageFilter, output);
                      } finally {
                          child.recycle();
                      }
                  }
              }

              private void addText(List<String> output, CharSequence value) {
                  String clean = clean(value == null ? "" : value.toString());
                  if (!clean.isEmpty()) output.add(clean);
              }

              private String findCoordinate(List<String> lines) {
                  if (lines == null || lines.isEmpty()) return null;

                  for (String line : lines) {
                      String coordinate = normalizeCoordinate(line);
                      if (coordinate != null) return coordinate;
                  }

                  String joined = String.join(" ", lines);
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          joined.replace('−', '-'));
                  while (matcher.find()) {
                      String coordinate = normalizeCoordinate(
                              matcher.group(1) + " " + matcher.group(2));
                      if (coordinate != null) return coordinate;
                  }
                  return null;
              }

              private static String normalizeCoordinate(String value) {
                  if (value == null) return null;
                  Matcher matcher = COORDINATE_PATTERN.matcher(
                          value.replace('−', '-'));
                  if (!matcher.matches()) return null;
                  try {
                      double latitude = Double.parseDouble(matcher.group(1));
                      double longitude = Double.parseDouble(matcher.group(2));
                      if (latitude < -90.0 || latitude > 90.0 ||
                              longitude < -180.0 || longitude > 180.0) {
                          return null;
                      }
                      return plain(latitude) + " " + plain(longitude);
                  } catch (NumberFormatException ignored) {
                      return null;
                  }
              }

              private static String plain(double value) {
                  return BigDecimal.valueOf(value)
                          .setScale(6, RoundingMode.HALF_UP)
                          .stripTrailingZeros()
                          .toPlainString();
              }

              private static List<String> parseLines(String source) {
                  ArrayList<String> result = new ArrayList<>();
                  if (source == null || source.isBlank()) return result;
                  for (String line : source.split("\\r?\\n")) {
                      String clean = clean(line);
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return result;
              }

              private static List<String> unique(List<String> source) {
                  LinkedHashSet<String> result = new LinkedHashSet<>();
                  for (String value : source) {
                      String clean = clean(value);
                      if (!clean.isEmpty()) result.add(clean);
                  }
                  return new ArrayList<>(result);
              }

              private void finishProcessing() {
                  captureMode = CAPTURE_NONE;
                  captureToken++;
                  processing.set(false);
                  if (floatingButton != null) {
                      floatingButton.setVisibility(View.VISIBLE);
                      floatingButton.setEnabled(true);
                  }
                  updateFloatingButton();
              }

              private static String clean(String value) {
                  if (value == null) return "";
                  return value.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private static String normalized(String value) {
                  String noAccent = Normalizer.normalize(
                          clean(value), Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "");
                  return noAccent.toUpperCase(Locale.ROOT)
                          .replaceAll("[^A-Z0-9]+", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private int dp(int value) {
                  return Math.round(value *
                          getResources().getDisplayMetrics().density);
              }



              private final class DragTouchListener implements View.OnTouchListener {
                  private float downRawX;
                  private float downRawY;
                  private int startX;
                  private int startY;
                  private boolean moved;

                  @Override
                  public boolean onTouch(View view, MotionEvent event) {
                      if (floatingParams == null || windowManager == null) return false;

                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downRawX = event.getRawX();
                              downRawY = event.getRawY();
                              startX = floatingParams.x;
                              startY = floatingParams.y;
                              moved = false;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - downRawX;
                              float dy = event.getRawY() - downRawY;
                              if (Math.abs(dx) > dp(5) || Math.abs(dy) > dp(5)) {
                                  moved = true;
                                  floatingParams.x = Math.max(0, startX - Math.round(dx));
                                  floatingParams.y = startY + Math.round(dy);
                                  try {
                                      windowManager.updateViewLayout(
                                              floatingButton, floatingParams);
                                  } catch (RuntimeException ignored) {
                                  }
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (!moved) view.performClick();
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              return true;

                          default:
                              return false;
                      }
                  }
              }

              private static final class OcrLine {
                  final String text;
                  final int top;
                  final int left;

                  OcrLine(String text, int top, int left) {
                      this.text = text;
                      this.top = top;
                      this.left = left;
                  }
              }

              private static final class RouteEndpoints {
                  final String pickup;
                  final String delivery;

                  RouteEndpoints(String pickup, String delivery) {
                      this.pickup = pickup;
                      this.delivery = delivery;
                  }
              }

              private static final class RouteParser {
                  private static final Pattern POSTAL_PATTERN = Pattern.compile(
                          "\\b(?:[A-Z]{1,3}-)?\\d{4,6}\\b",
                          Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);

                  private static final Pattern INLINE_METADATA_PATTERN = Pattern.compile(
                          "(?i)(?:^|[,;])\\s*(?:AUTRE|OTHER|SONSTIGE|PRODUIT|PRODUCT|" +
                          "MARCHANDISE|GOODS|WARE|ARTICLE|COMMODITY|PULPE|BETTERAVE|" +
                          "COMPTE|ACCOUNT|KONTO|REFERENCE|REF|TELEPHONE|TEL|NOTE|" +
                          "COMMENT|MEGJEGYZES)\\b.*$");

                  private static final Set<String> COUNTRY_TOKENS =
                          new LinkedHashSet<>(Arrays.asList(
                                  "FR", "FRANCE", "FRANCIAORSZAG",
                                  "CH", "SUISSE", "SCHWEIZ", "SWITZERLAND", "SVAJC",
                                  "BE", "BELGIQUE", "BELGIUM",
                                  "DE", "DEUTSCHLAND", "GERMANY", "NEMETORSZAG",
                                  "NL", "NEDERLAND", "NETHERLANDS", "HOLLANDIA",
                                  "LU", "LUXEMBOURG",
                                  "AT", "AUSTRIA", "OSTERREICH", "AUSZTRIA",
                                  "IT", "ITALIA", "ITALY", "OLASZORSZAG",
                                  "ES", "ESPANA", "SPAIN", "SPANYOLORSZAG",
                                  "HU", "HUNGARY", "MAGYARORSZAG",
                                  "PL", "POLAND", "POLSKA", "LENGYELORSZAG",
                                  "CZ", "CZECHIA", "CESKO", "CSEHORSZAG",
                                  "SK", "SLOVAKIA", "SLOVENSKO", "SZLOVAKIA",
                                  "SI", "SLOVENIA", "SLOVENIJA",
                                  "HR", "CROATIA", "HRVATSKA", "HORVATORSZAG",
                                  "RO", "ROMANIA", "ROMANIA",
                                  "BG", "BULGARIA",
                                  "DK", "DENMARK", "DANIA",
                                  "SE", "SWEDEN", "SVERIGE", "SVEDORSZAG",
                                  "NO", "NORWAY", "NORGE", "NORVEGIA",
                                  "FI", "FINLAND", "SUOMI",
                                  "GB", "UK", "UNITED KINGDOM", "NAGY BRITANNIA"));

                  private static final Pattern STREET_PATTERN = Pattern.compile(
                          "(?i)\\b(?:RUE|ROUTE|AVENUE|AV\\.?|BOULEVARD|BD\\.?|" +
                          "CHEMIN|IMPASSE|PLACE|QUAI|STRASSE|STRASSE|STR\\.?|" +
                          "WEG|GASSE|STREET|ROAD|LANE|DRIVE|VIA|VIALE|PIAZZA|" +
                          "UTCA|UT|TER|SOR|KOZ|PARK)\\b");

                  private RouteParser() {
                  }

                  static RouteEndpoints extract(List<String> originalLines) {
                      List<String> lines = new ArrayList<>();
                      if (originalLines != null) {
                          for (String line : originalLines) {
                              String clean = TomTomAccessibilityService.clean(line);
                              if (!clean.isEmpty() &&
                                      !"TT".equalsIgnoreCase(clean) &&
                                      !"+".equals(clean) &&
                                      !"…".equals(clean)) {
                                  lines.add(clean);
                              }
                          }
                      }

                      int pickupMarker = findMarker(lines, PICKUP_MARKERS, 0);
                      int deliveryMarker = findMarker(lines, DELIVERY_MARKERS, 0);

                      String pickup = null;
                      String delivery = null;

                      if (pickupMarker >= 0) {
                          int end = deliveryMarker > pickupMarker
                                  ? deliveryMarker
                                  : lines.size();
                          pickup = extractAddressBlock(
                                  lines, pickupMarker + 1, end);
                      }

                      if (deliveryMarker >= 0) {
                          int nextPickup = findMarker(
                                  lines, PICKUP_MARKERS, deliveryMarker + 1);
                          int end = nextPickup > deliveryMarker
                                  ? nextPickup
                                  : lines.size();
                          delivery = extractAddressBlock(
                                  lines, deliveryMarker + 1, end);
                      }

                      return new RouteEndpoints(pickup, delivery);
                  }

                  private static int findMarker(
                          List<String> lines,
                          List<String> markers,
                          int start) {
                      for (int index = Math.max(0, start);
                           index < lines.size();
                           index++) {
                          String line = normalized(lines.get(index));
                          for (String marker : markers) {
                              String normalizedMarker = normalized(marker);
                              if (line.equals(normalizedMarker) ||
                                      line.startsWith(normalizedMarker + " ") ||
                                      line.contains(" " + normalizedMarker + " ")) {
                                  return index;
                              }
                          }
                      }
                      return -1;
                  }

                  private static String extractAddressBlock(
                          List<String> lines,
                          int start,
                          int end) {
                      ArrayList<String> rawParts = new ArrayList<>();
                      int safeEnd = Math.min(lines.size(), end);

                      for (int index = Math.max(0, start);
                           index < safeEnd && rawParts.size() < 18;
                           index++) {
                          String raw = clean(lines.get(index));
                          String match = normalized(raw);

                          if (raw.isEmpty()) continue;
                          if (isStatusWord(match)) continue;
                          if (isAnyMarker(match)) break;

                          String trimmed = trimMetadata(raw);
                          if (trimmed.isEmpty()) {
                              if (!rawParts.isEmpty()) break;
                              continue;
                          }

                          rawParts.add(trimmed);

                          if (containsCountry(trimmed) &&
                                  containsPostal(String.join(" ", rawParts))) {
                              break;
                          }

                          if (isMetadata(raw, match) && !rawParts.isEmpty()) {
                              break;
                          }
                      }

                      if (rawParts.isEmpty()) return null;

                      String coordinate = findCoordinateStatic(rawParts);
                      if (coordinate != null) return coordinate;

                      return canonicalAddress(rawParts);
                  }

                  private static String canonicalAddress(List<String> rawParts) {
                      ArrayList<String> segments = new ArrayList<>();
                      boolean postalSeen = false;
                      boolean countrySeen = false;

                      outer:
                      for (String raw : rawParts) {
                          String trimmed = trimMetadata(raw);
                          if (trimmed.isEmpty()) continue;

                          for (String piece : trimmed.split("[,;]")) {
                              String segment = clean(piece);
                              if (segment.isEmpty()) continue;

                              String normalizedSegment = normalized(segment);
                              if (isMetadata(segment, normalizedSegment)) break outer;

                              if (isCountryToken(segment)) {
                                  if (postalSeen) {
                                      addUnique(segments, normalizedCountry(segment));
                                      countrySeen = true;
                                  }
                                  break outer;
                              }

                              String inlineCountry = countryAtEnd(segment);
                              if (inlineCountry != null) {
                                  String before = clean(segment.substring(
                                          0, segment.length() - inlineCountry.length()));
                                  if (!before.isEmpty()) {
                                      addUnique(segments, before);
                                      postalSeen = postalSeen || containsPostal(before);
                                  }
                                  if (postalSeen) {
                                      addUnique(segments, normalizedCountry(inlineCountry));
                                      countrySeen = true;
                                  }
                                  break outer;
                              }

                              addUnique(segments, segment);
                              postalSeen = postalSeen || containsPostal(segment);
                          }
                      }

                      if (segments.isEmpty()) return null;

                      int postalIndex = -1;
                      for (int index = 0; index < segments.size(); index++) {
                          if (containsPostal(segments.get(index))) {
                              postalIndex = index;
                              break;
                          }
                      }

                      ArrayList<String> result = new ArrayList<>();
                      if (postalIndex > 0) {
                          ArrayList<String> companyCandidates = new ArrayList<>();
                          ArrayList<String> streetCandidates = new ArrayList<>();

                          for (int index = 0; index < postalIndex; index++) {
                              String segment = segments.get(index);
                              if (looksLikeStreet(segment)) {
                                  streetCandidates.add(segment);
                              } else {
                                  companyCandidates.add(segment);
                              }
                          }

                          String company = chooseCompany(companyCandidates);
                          if (!company.isEmpty()) result.add(company);
                          for (String street : streetCandidates) addUnique(result, street);

                          for (int index = postalIndex; index < segments.size(); index++) {
                              addUnique(result, segments.get(index));
                          }
                      } else {
                          for (String segment : segments) addUnique(result, segment);
                      }

                      String joined = clean(String.join(", ", result));
                      joined = joined.replaceAll("\\s+,", ",")
                              .replaceAll(",\\s*,+", ", ")
                              .replaceAll("\\s{2,}", " ")
                              .replaceAll("[,;\\s]+$", "")
                              .trim();

                      if (!countrySeen && joined.isEmpty()) return null;
                      return joined.isEmpty() ? null : joined;
                  }

                  private static String chooseCompany(List<String> candidates) {
                      if (candidates == null || candidates.isEmpty()) return "";

                      String best = "";
                      int bestScore = Integer.MIN_VALUE;

                      for (String candidate : candidates) {
                          String cleanCandidate = clean(candidate)
                                  .replaceAll("^[\\-–—\\s]+|[\\-–—\\s]+$", "");
                          if (cleanCandidate.isEmpty()) continue;

                          int score = 0;
                          String normalizedCandidate = normalized(cleanCandidate);

                          if (normalizedCandidate.matches(".*\\b(?:AG|SA|SAS|SARL|GMBH|" +
                                  "BV|NV|LTD|SRL|SPA|KG|OHG|KFT|ZRT)\\b.*")) {
                              score += 30;
                          }
                          if (cleanCandidate.length() >= 4 &&
                                  cleanCandidate.length() <= 55) {
                              score += 15;
                          }
                          if (!cleanCandidate.matches(".*\\d.*")) score += 8;
                          score -= Math.max(0, cleanCandidate.length() - 55);

                          if (score > bestScore ||
                                  (score == bestScore &&
                                   cleanCandidate.length() < best.length())) {
                              best = cleanCandidate;
                              bestScore = score;
                          }
                      }

                      return best;
                  }

                  private static boolean looksLikeStreet(String value) {
                      if (value == null || value.isEmpty()) return false;
                      return STREET_PATTERN.matcher(value).find() ||
                              value.matches(".*\\b\\d{1,5}[A-Za-z]?\\b.*");
                  }

                  private static void addUnique(
                          List<String> output,
                          String value) {
                      String cleanValue = clean(value);
                      if (cleanValue.isEmpty()) return;

                      String normalizedValue = normalized(cleanValue);
                      for (String existing : output) {
                          String normalizedExisting = normalized(existing);
                          if (normalizedExisting.equals(normalizedValue)) return;
                      }
                      output.add(cleanValue);
                  }

                  private static String trimMetadata(String raw) {
                      if (raw == null) return "";
                      String cleaned = clean(raw);

                      Matcher metadata = INLINE_METADATA_PATTERN.matcher(cleaned);
                      if (metadata.find()) {
                          cleaned = clean(cleaned.substring(0, metadata.start()));
                      }

                      return cleaned.replaceAll("[,;\\s]+$", "").trim();
                  }

                  private static boolean containsPostal(String value) {
                      return value != null &&
                              POSTAL_PATTERN.matcher(value).find();
                  }

                  private static boolean containsCountry(String value) {
                      if (value == null) return false;
                      for (String piece : value.split("[,;]")) {
                          if (isCountryToken(piece) ||
                                  countryAtEnd(piece) != null) {
                              return true;
                          }
                      }
                      return false;
                  }

                  private static String countryAtEnd(String value) {
                      if (value == null) return null;
                      String cleanValue = clean(value);
                      String normalizedValue = normalized(cleanValue).toUpperCase(Locale.ROOT);

                      for (String country : COUNTRY_TOKENS) {
                          String normalizedCountry =
                                  normalized(country).toUpperCase(Locale.ROOT);
                          if (normalizedValue.equals(normalizedCountry)) {
                              return cleanValue;
                          }
                          if (normalizedValue.endsWith(" " + normalizedCountry)) {
                              int start = cleanValue.length() - country.length();
                              if (start >= 0) return cleanValue.substring(start);
                          }
                      }
                      return null;
                  }

                  private static boolean isCountryToken(String value) {
                      String normalizedValue =
                              normalized(value).toUpperCase(Locale.ROOT);
                      for (String country : COUNTRY_TOKENS) {
                          if (normalizedValue.equals(
                                  normalized(country).toUpperCase(Locale.ROOT))) {
                              return true;
                          }
                      }
                      return false;
                  }

                  private static String normalizedCountry(String value) {
                      String normalizedValue =
                              normalized(value).toUpperCase(Locale.ROOT);
                      if (normalizedValue.equals("FRANCE") ||
                              normalizedValue.equals("FRANCIAORSZAG")) return "FR";
                      if (normalizedValue.equals("SUISSE") ||
                              normalizedValue.equals("SCHWEIZ") ||
                              normalizedValue.equals("SWITZERLAND") ||
                              normalizedValue.equals("SVAJC")) return "CH";
                      if (normalizedValue.equals("BELGIQUE") ||
                              normalizedValue.equals("BELGIUM")) return "BE";
                      if (normalizedValue.equals("DEUTSCHLAND") ||
                              normalizedValue.equals("GERMANY") ||
                              normalizedValue.equals("NEMETORSZAG")) return "DE";
                      return clean(value).toUpperCase(Locale.ROOT);
                  }

                  private static boolean isAnyMarker(String match) {
                      for (String marker : PICKUP_MARKERS) {
                          if (match.equals(normalized(marker))) return true;
                      }
                      for (String marker : DELIVERY_MARKERS) {
                          if (match.equals(normalized(marker))) return true;
                      }
                      return false;
                  }

                  private static boolean isStatusWord(String match) {
                      String padded = " " + match + " ";
                      for (String word : STATUS_WORDS) {
                          String normalizedWord = normalized(word);
                          if (padded.contains(" " + normalizedWord + " ")) return true;
                      }
                      return false;
                  }

                  private static boolean isMetadata(String raw, String match) {
                      if (raw.matches(".*\\b(?:[01]?\\d|2[0-3]):[0-5]\\d\\b.*")) {
                          return true;
                      }
                      if (raw.matches(".*\\b20\\d{2}[-./]\\d{1,2}[-./]\\d{1,2}\\b.*")) {
                          return true;
                      }
                      if (INLINE_METADATA_PATTERN.matcher("," + raw).find()) {
                          return true;
                      }
                      return isHardStop(match);
                  }

                  private static boolean isHardStop(String match) {
                      String padded = " " + match + " ";
                      for (String word : HARD_STOP_WORDS) {
                          String normalizedWord = normalized(word);
                          if (padded.contains(" " + normalizedWord + " ")) return true;
                      }
                      return false;
                  }

                  private static String findCoordinateStatic(List<String> lines) {
                      for (String line : lines) {
                          String coordinate = normalizeCoordinate(line);
                          if (coordinate != null) return coordinate;
                      }
                      Matcher matcher = COORDINATE_PATTERN.matcher(
                              String.join(" ", lines).replace('−', '-'));
                      if (matcher.find()) {
                          return normalizeCoordinate(
                                  matcher.group(1) + " " + matcher.group(2));
                      }
                      return null;
                  }
              }

              private boolean isWebUploadActive() {
                  return getSharedPreferences(MainActivity.TOMTOM_UPLOAD_PREFS, MODE_PRIVATE)
                          .getBoolean(MainActivity.KEY_TOMTOM_UPLOAD_ACTIVE, false);
              }

              private void startWebUploadFromPreferences() {
                  SharedPreferences preferences = getSharedPreferences(
                          MainActivity.TOMTOM_UPLOAD_PREFS, MODE_PRIVATE);
                  if (!preferences.getBoolean(
                          MainActivity.KEY_TOMTOM_UPLOAD_ACTIVE, false)) {
                      return;
                  }

                  String fileName = preferences.getString(
                          MainActivity.KEY_TOMTOM_FILE_NAME, "");
                  String routeName = preferences.getString(
                          MainActivity.KEY_TOMTOM_ROUTE_NAME, "");
                  String requestVersion = preferences.getString(
                          MainActivity.KEY_TOMTOM_UPLOAD_VERSION, "");
                  long requestedAt = preferences.getLong(
                          MainActivity.KEY_TOMTOM_UPLOAD_REQUESTED_AT, 0L);
                  long requestAge = System.currentTimeMillis() - requestedAt;
                  if (!VERSION.equals(requestVersion) ||
                          requestedAt <= 0L ||
                          requestAge < 0L || requestAge > WEB_TOTAL_TIMEOUT_MS) {
                      failWebUpload("A korábbi, félbemaradt TomTom-feltöltést töröltem.");
                      return;
                  }
                  if (fileName == null || fileName.isBlank() ||
                          routeName == null || routeName.isBlank()) {
                      failWebUpload("Hiányzik a feltöltendő GPX fájl neve.");
                      return;
                  }

                  String requestedFile = fileName.trim();
                  String requestedRoute = routeName.trim();
                  if (webUploadStage != WEB_STAGE_IDLE &&
                          requestedFile.equals(webFileName) &&
                          requestedRoute.equals(webRouteName)) {
                      scheduleWebUploadStep(250L);
                      return;
                  }

                  webFileName = requestedFile;
                  webRouteName = requestedRoute;
                  webUploadStage = WEB_STAGE_OPEN_MENU;
                  webUploadStartedAt = System.currentTimeMillis();
                  webFileSelectedAt = 0L;
                  webLastActionAt = 0L;
                  webLastActionSignature = "";
                  webGeneration++;
                  webGestureInFlight = false;
                  webTargetRouteSeen = false;
                  webSyncClickSent = false;
                  webSyncClickAt = 0L;
                  webFilePickerArmedUntil = 0L;
                  webUnexpectedPackageSince = 0L;
                  webPickerSearchEntered = false;
                  handler.removeCallbacks(webUploadStepRunnable);
                  webUploadStepScheduled = false;
                  updateFloatingButton();
                  scheduleWebUploadStep(350L);
              }

              private void scheduleWebUploadStep(long delayMs) {
                  if (webUploadStage == WEB_STAGE_IDLE ||
                          webUploadStepScheduled) {
                      return;
                  }
                  webUploadStepScheduled = true;
                  handler.postDelayed(
                          webUploadStepRunnable,
                          Math.max(60L, delayMs));
              }

              private void runWebUploadStep() {
                  webUploadStepScheduled = false;
                  if (webUploadStage == WEB_STAGE_IDLE ||
                          !isWebUploadActive()) {
                      return;
                  }

                  long nowWall = System.currentTimeMillis();
                  long nowUptime = SystemClock.uptimeMillis();
                  if (nowWall - webUploadStartedAt > WEB_TOTAL_TIMEOUT_MS) {
                      failWebUpload(
                              "A TomTom feltöltés négy percen belül nem fejeződött be.");
                      return;
                  }

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null || root.getPackageName() == null) {
                      if (root != null) root.recycle();
                      scheduleWebUploadStep(250L);
                      return;
                  }

                  try {
                      String packageName = root.getPackageName().toString();
                      if (isWebBrowserPackage(packageName)) {
                          webUnexpectedPackageSince = 0L;
                          if (webUploadStage == WEB_STAGE_PICK_FILE &&
                                  webFilePickerArmedUntil > 0L &&
                                  nowUptime > webFilePickerArmedUntil) {
                              webFilePickerArmedUntil = 0L;
                              webUploadStage = WEB_STAGE_OPEN_IMPORT;
                              webLastActionSignature = "";
                          }
                          handleTomTomWebPage(root);
                          return;
                      }

                      if (isWebFilePickerPackage(packageName)) {
                          boolean pickerExpected =
                                  webUploadStage == WEB_STAGE_PICK_FILE &&
                                  webFilePickerArmedUntil > 0L &&
                                  nowUptime <= webFilePickerArmedUntil;
                          if (!pickerExpected) {
                              failWebUpload(
                                      "A fájlkezelő nem a mostani TomTom-importból nyílt meg; az automatizálást leállítottam.");
                              return;
                          }
                          webUnexpectedPackageSince = 0L;
                          handleWebFilePicker(root);
                          return;
                      }

                      if (webUnexpectedPackageSince == 0L) {
                          webUnexpectedPackageSince = nowUptime;
                      }
                      if (nowUptime - webUnexpectedPackageSince >= 1800L) {
                          failWebUpload(
                                  "A TomTom-oldal elhagyása miatt az automatizálást leállítottam.");
                      } else {
                          scheduleWebUploadStep(250L);
                      }
                  } finally {
                      root.recycle();
                  }
              }

              private void handleWebFilePicker(AccessibilityNodeInfo root) {
                  if (webUploadStage != WEB_STAGE_PICK_FILE ||
                          webFilePickerArmedUntil <= 0L ||
                          SystemClock.uptimeMillis() > webFilePickerArmedUntil) {
                      failWebUpload(
                              "A fájlválasztó engedélyezési ideje lejárt; az automatizálást leállítottam.");
                      return;
                  }

                  AccessibilityNodeInfo file = webFindActionNode(
                          root,
                          webFileName,
                          webFileName.replaceFirst("(?i)\\.gpx$", ""));
                  if (webPerformClickOnce(file)) {
                      webFilePickerArmedUntil = 0L;
                      webUploadStage = WEB_STAGE_WAIT_IMPORT;
                      webFileSelectedAt = System.currentTimeMillis();
                      scheduleWebUploadStep(900L);
                      return;
                  }

                  if (!webPickerSearchEntered) {
                      AccessibilityNodeInfo downloads = webFindActionNode(
                              root,
                              "letöltések",
                              "downloads",
                              "download",
                              "téléchargements",
                              "heruntergeladen",
                              "descargas");
                      if (webPerformClickOnce(downloads)) {
                          scheduleWebUploadStep(350L);
                          return;
                      }

                      AccessibilityNodeInfo search = webFindActionNode(
                              root,
                              "keresés",
                              "keresés a fájlokban",
                              "search",
                              "rechercher",
                              "suchen",
                              "buscar");
                      if (webPerformClickOnce(search)) {
                          scheduleWebUploadStep(250L);
                          return;
                      }

                      AccessibilityNodeInfo editor =
                              webFindEditableNode(root);
                      if (editor != null &&
                              webSetNodeText(editor, webFileName)) {
                          webPickerSearchEntered = true;
                          scheduleWebUploadStep(500L);
                          return;
                      }
                  } else {
                      AccessibilityNodeInfo editor =
                              webFindEditableNode(root);
                      if (editor != null) {
                          if (webNodeText(editor).isBlank()) {
                              webSetNodeText(editor, webFileName);
                          } else {
                              editor.recycle();
                          }
                      }
                  }

                  scheduleWebUploadStep(300L);
              }

              private void handleTomTomWebPage(
                      AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo cookie = webFindActionNode(
                          root,
                          "összes elfogadása",
                          "elfogadom",
                          "accept all",
                          "accept",
                          "tout accepter",
                          "alle akzeptieren",
                          "aceptar todo");
                  if (webPerformClickOnce(cookie)) {
                      scheduleWebUploadStep(550L);
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_OPEN_MENU) {
                      if (webMyItemsDialogVisible(root)) {
                          webUploadStage = WEB_STAGE_OPEN_ROUTES;
                          webLastActionSignature = "";
                          scheduleWebUploadStep(140L);
                          return;
                      }

                      /*
                       * Mobilnézet: először mindig a valódi bal felső hamburger
                       * menüt nyitjuk meg. Ha a menü már nyitva van, a Saját
                       * elemek sorra lépünk tovább.
                       */
                      if (webSideMenuVisible(root)) {
                          AccessibilityNodeInfo myItemsNow =
                                  webFindExactTextNode(
                                          root,
                                          "saját elemek",
                                          "my items",
                                          "mes éléments",
                                          "meine elemente");
                          if (webPerformClickOnce(myItemsNow) ||
                                  dispatchWebRelativeTap(
                                          0.27f,
                                          0.253f,
                                          "mobile-my-items-row")) {
                              webUploadStage = WEB_STAGE_OPEN_MY_ITEMS;
                              webLastActionSignature = "";
                              scheduleWebUploadStep(520L);
                              return;
                          }
                      }

                      if (webOpenMainMenuLeftOfSearch(root) ||
                              dispatchWebRelativeTap(
                                      0.112f,
                                      0.164f,
                                      "mobile-main-menu")) {
                          scheduleWebUploadStep(520L);
                          return;
                      }

                      scheduleWebUploadStep(260L);
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_OPEN_MY_ITEMS) {
                      if (webMyItemsDialogVisible(root)) {
                          webUploadStage = WEB_STAGE_OPEN_ROUTES;
                          webLastActionSignature = "";
                          scheduleWebUploadStep(180L);
                          return;
                      }

                      if (webSideMenuVisible(root)) {
                          AccessibilityNodeInfo myItems =
                                  webFindExactTextNode(
                                          root,
                                          "saját elemek",
                                          "my items",
                                          "mes éléments",
                                          "meine elemente");
                          if (webPerformClickOnce(myItems) ||
                                  dispatchWebRelativeTap(
                                          0.27f,
                                          0.253f,
                                          "mobile-my-items-row")) {
                              scheduleWebUploadStep(520L);
                              return;
                          }
                      }

                      webUploadStage = WEB_STAGE_OPEN_MENU;
                      webLastActionSignature = "";
                      scheduleWebUploadStep(260L);
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_OPEN_ROUTES) {
                      AccessibilityNodeInfo panel =
                              webFindMyItemsPanel(root);
                      if (panel == null) {
                          webUploadStage = WEB_STAGE_OPEN_MENU;
                          webLastActionSignature = "";
                          scheduleWebUploadStep(260L);
                          return;
                      }

                      try {
                          AccessibilityNodeInfo importVisible =
                                  webFindExactTextNode(
                                          panel,
                                          "gpx-fájl importálása",
                                          "gpx fájl importálása",
                                          "gpx importálása",
                                          "import gpx file",
                                          "import a gpx file",
                                          "importer un fichier gpx",
                                          "importer fichier gpx",
                                          "gpx-datei importieren",
                                          "gpx datei importieren",
                                          "importar archivo gpx");
                          if (importVisible != null) {
                              importVisible.recycle();
                              webUploadStage = WEB_STAGE_OPEN_IMPORT;
                              webLastActionSignature = "";
                              scheduleWebUploadStep(160L);
                              return;
                          }

                          /*
                           * Csak a Saját elemek ablak Útvonalak fülét keressük,
                           * ezért a háttérben lévő kék útvonaltervező ikon nem
                           * választható ki tévedésből.
                           */
                          AccessibilityNodeInfo routes =
                                  webFindExactTextNode(
                                          panel,
                                          "útvonalak",
                                          "my routes",
                                          "routes",
                                          "itinéraires",
                                          "routen");
                          if (webPerformClickOnce(routes) ||
                                  dispatchWebRelativeTap(
                                          0.64f,
                                          0.245f,
                                          "mobile-my-items-routes-tab")) {
                              scheduleWebUploadStep(520L);
                              return;
                          }
                      } finally {
                          panel.recycle();
                      }

                      scheduleWebUploadStep(280L);
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_OPEN_IMPORT) {
                      AccessibilityNodeInfo panel =
                              webFindMyItemsPanel(root);
                      if (panel == null) {
                          webUploadStage = WEB_STAGE_OPEN_MENU;
                          webLastActionSignature = "";
                          scheduleWebUploadStep(260L);
                          return;
                      }

                      try {
                          AccessibilityNodeInfo importButton =
                                  webFindExactTextNode(
                                          panel,
                                          "gpx-fájl importálása",
                                          "gpx fájl importálása",
                                          "gpx importálása",
                                          "import gpx file",
                                          "import a gpx file",
                                          "importer un fichier gpx",
                                          "importer fichier gpx",
                                          "gpx-datei importieren",
                                          "gpx datei importieren",
                                          "importar archivo gpx");
                          if (webPerformClickOnce(importButton) ||
                                  dispatchWebRelativeTap(
                                          0.61f,
                                          0.306f,
                                          "mobile-gpx-import")) {
                              webFilePickerArmedUntil =
                                      SystemClock.uptimeMillis() + 7000L;
                              webUploadStage = WEB_STAGE_PICK_FILE;
                              scheduleWebUploadStep(650L);
                              return;
                          }
                      } finally {
                          panel.recycle();
                      }

                      webUploadStage = WEB_STAGE_OPEN_ROUTES;
                      webLastActionSignature = "";
                      scheduleWebUploadStep(260L);
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_PICK_FILE) {
                      if (webFilePickerArmedUntil <= 0L ||
                              SystemClock.uptimeMillis() >
                                      webFilePickerArmedUntil) {
                          webFilePickerArmedUntil = 0L;
                          webUploadStage = WEB_STAGE_OPEN_IMPORT;
                          webLastActionSignature = "";
                          scheduleWebUploadStep(250L);
                      } else {
                          scheduleWebUploadStep(300L);
                      }
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_WAIT_IMPORT) {
                      AccessibilityNodeInfo route =
                              webFindActionNode(root, webRouteName);
                      if (route != null) {
                          webTargetRouteSeen = true;
                          if (openWebRouteMenu(route)) {
                              route.recycle();
                              webUploadStage = WEB_STAGE_SYNC;
                              scheduleWebUploadStep(500L);
                              return;
                          }
                          if (webPerformClickOnce(route)) {
                              webUploadStage = WEB_STAGE_OPEN_ROUTE;
                              scheduleWebUploadStep(650L);
                              return;
                          }
                      }

                      // Régi útvonal miatt soha nem tekintjük késznek a feltöltést.
                      // Kizárólag a most létrehozott, pontos nevű útvonal megjelenését várjuk.
                      scheduleWebUploadStep(500L);
                      return;
                  }

                  if (webUploadStage == WEB_STAGE_OPEN_ROUTE ||
                          webUploadStage == WEB_STAGE_SYNC) {
                      if (!webTargetRouteSeen) {
                          webUploadStage = WEB_STAGE_WAIT_IMPORT;
                          scheduleWebUploadStep(400L);
                          return;
                      }

                      AccessibilityNodeInfo alreadySynced = webFindActionNode(
                              root,
                              "szinkronizálás leállítása",
                              "útvonal szinkronizálásának leállítása",
                              "stop synchronizing route",
                              "stop synchronising route",
                              "synchronisierung beenden",
                              "arrêter la synchronisation");
                      if (alreadySynced != null) {
                          alreadySynced.recycle();
                          completeWebUpload();
                          return;
                      }

                      AccessibilityNodeInfo synchronize = webFindActionNode(
                              root,
                              "útvonal szinkronizálása",
                              "szinkronizálás bekapcsolása",
                              "szinkronizálás az eszközzel",
                              "szinkronizálás az eszközökkel",
                              "synchronize route",
                              "synchronise route",
                              "sync this route",
                              "sync route",
                              "sync with devices",
                              "route synchronisieren",
                              "synchroniser l'itinéraire");
                      if (!webSyncClickSent && webPerformClickOnce(synchronize)) {
                          webSyncClickSent = true;
                          webSyncClickAt = SystemClock.uptimeMillis();
                          webUploadStage = WEB_STAGE_SYNC;
                          scheduleWebUploadStep(900L);
                          return;
                      }

                      if (webSyncClickSent &&
                              SystemClock.uptimeMillis() - webSyncClickAt >= 2200L) {
                          completeWebUpload();
                          return;
                      }

                      AccessibilityNodeInfo route =
                              webFindActionNode(root, webRouteName);
                      if (route != null) {
                          if (openWebRouteMenu(route)) {
                              route.recycle();
                              webUploadStage = WEB_STAGE_SYNC;
                              scheduleWebUploadStep(500L);
                              return;
                          }
                          route.recycle();
                      }

                      scheduleWebUploadStep(450L);
                  }
              }

              private boolean webOpenMainMenuLeftOfSearch(
                      AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo search = webFindActionNode(
                          root,
                          "vissza a kereséshez",
                          "back to search",
                          "retour à la recherche",
                          "zurück zur suche",
                          "volver a la búsqueda");
                  if (search == null) return false;

                  Rect searchBounds = new Rect();
                  try {
                      search.getBoundsInScreen(searchBounds);
                  } finally {
                      search.recycle();
                  }
                  if (searchBounds.isEmpty()) return false;

                  AccessibilityNodeInfo menu =
                          webFindControlLeftOfSearch(root, searchBounds);
                  if (menu != null && webPerformClickOnce(menu)) {
                      return true;
                  }

                  /*
                   * Mobilnézetben a hamburger a keresőmező bal oldalán marad.
                   * Ezért itt nem dp-ben számolunk: a hamburger helyét a tényleges
                   * keresőmező magasságából vezetjük le. A képernyőn a hamburger
                   * közepe nagyjából 0,62 keresőmező-magassággal van a mező bal
                   * széle előtt, ugyanazon a függőleges középvonalon.
                   */
                  float offset = Math.max(
                          4.0f, searchBounds.height() * 0.62f);
                  float x = Math.max(
                          2.0f, searchBounds.left - offset);
                  float y = searchBounds.exactCenterY();
                  return dispatchWebPointTap(
                          x, y, "tomtom-hamburger-adaptive-mobile");
              }

              private AccessibilityNodeInfo webFindControlLeftOfSearch(
                      AccessibilityNodeInfo root,
                      Rect searchBounds) {
                  if (root == null || searchBounds == null ||
                          searchBounds.isEmpty()) {
                      return null;
                  }

                  ArrayDeque<AccessibilityNodeInfo> queue =
                          new ArrayDeque<>();
                  queue.add(AccessibilityNodeInfo.obtain(root));
                  AccessibilityNodeInfo best = null;
                  int bestScore = Integer.MAX_VALUE;
                  int visited = 0;

                  /*
                   * Minden méret a tényleges, mobil keresőmezőből ered.
                   * Így a mobilnézet gombját sem szűrjük ki
                   * egy telefon-sűrűségből számolt túl nagy dp-határral.
                   */
                  int minSide = Math.max(3, searchBounds.height() / 6);
                  int maxSide = Math.max(24, searchBounds.height() * 3);
                  int verticalTolerance = Math.max(
                          6, searchBounds.height());
                  int maxLeftDistance = Math.max(
                          24, searchBounds.height() * 3);

                  try {
                      while (!queue.isEmpty() &&
                              visited++ < WEB_MAX_NODES) {
                          AccessibilityNodeInfo node = queue.removeFirst();
                          try {
                              if (node.isVisibleToUser() && node.isEnabled()) {
                                  Rect bounds = new Rect();
                                  node.getBoundsInScreen(bounds);
                                  int horizontalDistance =
                                          searchBounds.left - bounds.centerX();
                                  if (!bounds.isEmpty() &&
                                          bounds.width() >= minSide &&
                                          bounds.height() >= minSide &&
                                          bounds.width() <= maxSide &&
                                          bounds.height() <= maxSide &&
                                          horizontalDistance > 0 &&
                                          horizontalDistance <= maxLeftDistance &&
                                          Math.abs(bounds.centerY() -
                                                  searchBounds.centerY()) <=
                                                  verticalTolerance) {
                                      boolean actionable = node.isClickable() ||
                                              webHasAction(node,
                                                      AccessibilityNodeInfo.ACTION_CLICK);
                                      int score =
                                              Math.abs(bounds.centerY() -
                                                      searchBounds.centerY()) * 5 +
                                              horizontalDistance * 2 +
                                              (actionable ? 0 : 80);
                                      if (score < bestScore) {
                                          if (best != null) best.recycle();
                                          best = AccessibilityNodeInfo.obtain(node);
                                          bestScore = score;
                                      }
                                  }
                              }

                              for (int index = 0;
                                   index < node.getChildCount();
                                   index++) {
                                  AccessibilityNodeInfo child =
                                          node.getChild(index);
                                  if (child != null) queue.addLast(child);
                              }
                          } finally {
                              node.recycle();
                          }
                      }
                      AccessibilityNodeInfo result = best;
                      best = null;
                      return result;
                  } finally {
                      if (best != null) best.recycle();
                      while (!queue.isEmpty()) {
                          queue.removeFirst().recycle();
                      }
                  }
              }

              private boolean dispatchWebRelativeTap(
                      float xRatio,
                      float yRatio,
                      String signature) {
                  int screenWidth =
                          getResources().getDisplayMetrics().widthPixels;
                  int screenHeight =
                          getResources().getDisplayMetrics().heightPixels;
                  return dispatchWebPointTap(
                          screenWidth * xRatio,
                          screenHeight * yRatio,
                          signature);
              }

              private boolean dispatchWebPointTap(
                      float x,
                      float y,
                      String signature) {
                  if (webGestureInFlight ||
                          !isWebUploadActive() ||
                          webUploadStage == WEB_STAGE_IDLE) {
                      return false;
                  }
                  int screenWidth =
                          getResources().getDisplayMetrics().widthPixels;
                  int screenHeight =
                          getResources().getDisplayMetrics().heightPixels;
                  if (x <= 0 || x >= screenWidth ||
                          y <= 0 || y >= screenHeight) {
                      return false;
                  }

                  long now = SystemClock.uptimeMillis();
                  if (webLastActionAt > 0L) {
                      long elapsed = now - webLastActionAt;
                      if (elapsed < WEB_ACTION_COOLDOWN_MS) return false;
                      if (signature.equals(webLastActionSignature) &&
                              elapsed < WEB_SAME_ACTION_COOLDOWN_MS) {
                          return false;
                      }
                  }

                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(
                                          new GestureDescription.StrokeDescription(
                                                  path, 0L, 70L))
                                  .build();
                  final int generation = webGeneration;
                  webGestureInFlight = true;
                  boolean accepted = dispatchGesture(
                          gesture,
                          new GestureResultCallback() {
                              @Override
                              public void onCompleted(
                                      GestureDescription gestureDescription) {
                                  webGestureInFlight = false;
                                  if (generation == webGeneration &&
                                          isWebUploadActive()) {
                                      scheduleWebUploadStep(450L);
                                  }
                              }

                              @Override
                              public void onCancelled(
                                      GestureDescription gestureDescription) {
                                  webGestureInFlight = false;
                                  if (generation == webGeneration &&
                                          isWebUploadActive()) {
                                      scheduleWebUploadStep(350L);
                                  }
                              }
                          },
                          handler);
                  if (!accepted) {
                      webGestureInFlight = false;
                      return false;
                  }
                  webLastActionAt = now;
                  webLastActionSignature = signature;
                  return true;
              }

              private boolean openWebRouteMenu(
                      AccessibilityNodeInfo routeNode) {
                  if (routeNode == null) return false;
                  AccessibilityNodeInfo container =
                          AccessibilityNodeInfo.obtain(routeNode);
                  try {
                      for (int depth = 0;
                           container != null && depth < 5;
                           depth++) {
                          AccessibilityNodeInfo menu = webFindActionNode(
                                  container,
                                  "további lehetőségek",
                                  "további műveletek",
                                  "more options",
                                  "route options",
                                  "plus d'options",
                                  "weitere optionen",
                                  "más opciones");
                          if (menu != null && webPerformClickOnce(menu)) {
                              return true;
                          }
                          AccessibilityNodeInfo parent = container.getParent();
                          container.recycle();
                          container = parent;
                      }
                      return false;
                  } finally {
                      if (container != null) container.recycle();
                  }
              }

              private boolean webSideMenuVisible(
                      AccessibilityNodeInfo root) {
                  return webHasExactText(root,
                          "saját elemek",
                          "my items",
                          "mes éléments",
                          "meine elemente") &&
                          webHasExactText(root,
                                  "beállítások",
                                  "settings",
                                  "paramètres",
                                  "einstellungen");
              }

              private boolean webMyItemsDialogVisible(
                      AccessibilityNodeInfo root) {
                  return webHasExactText(root,
                          "saját elemek",
                          "my items",
                          "mes éléments",
                          "meine elemente") &&
                          webHasExactText(root,
                                  "helyek",
                                  "places",
                                  "lieux",
                                  "orte") &&
                          webHasExactText(root,
                                  "útvonalak",
                                  "my routes",
                                  "routes",
                                  "itinéraires",
                                  "routen");
              }


              private AccessibilityNodeInfo webFindMyItemsPanel(
                      AccessibilityNodeInfo root) {
                  AccessibilityNodeInfo title = webFindExactTextNode(
                          root,
                          "saját elemek",
                          "my items",
                          "mes éléments",
                          "meine elemente");
                  if (title == null) return null;

                  AccessibilityNodeInfo current = title;
                  try {
                      for (int depth = 0;
                           current != null && depth < 9;
                           depth++) {
                          if (webHasExactText(
                                      current,
                                      "helyek",
                                      "places",
                                      "lieux",
                                      "orte") &&
                                  webHasExactText(
                                          current,
                                          "útvonalak",
                                          "my routes",
                                          "routes",
                                          "itinéraires",
                                          "routen")) {
                              return AccessibilityNodeInfo.obtain(current);
                          }
                          AccessibilityNodeInfo parent = current.getParent();
                          current.recycle();
                          current = parent;
                      }
                      return null;
                  } finally {
                      if (current != null) current.recycle();
                  }
              }

              private boolean webHasExactText(
                      AccessibilityNodeInfo root,
                      String... terms) {
                  AccessibilityNodeInfo node =
                          webFindExactTextNode(root, terms);
                  if (node == null) return false;
                  node.recycle();
                  return true;
              }

              private AccessibilityNodeInfo webFindExactTextNode(
                      AccessibilityNodeInfo root,
                      String... terms) {
                  if (root == null || terms == null || terms.length == 0) {
                      return null;
                  }

                  ArrayDeque<AccessibilityNodeInfo> queue =
                          new ArrayDeque<>();
                  queue.add(AccessibilityNodeInfo.obtain(root));
                  int visited = 0;
                  try {
                      while (!queue.isEmpty() &&
                              visited++ < WEB_MAX_NODES) {
                          AccessibilityNodeInfo node =
                                  queue.removeFirst();
                          try {
                              if (node.isVisibleToUser()) {
                                  String actual = webNormalize(
                                          webNodeText(node));
                                  for (String term : terms) {
                                      String wanted = webNormalize(term);
                                      if (!wanted.isBlank() &&
                                              actual.equals(wanted)) {
                                          return AccessibilityNodeInfo.obtain(
                                                  node);
                                      }
                                  }
                              }

                              for (int index = 0;
                                   index < node.getChildCount();
                                   index++) {
                                  AccessibilityNodeInfo child =
                                          node.getChild(index);
                                  if (child != null) {
                                      queue.addLast(child);
                                  }
                              }
                          } finally {
                              node.recycle();
                          }
                      }
                      return null;
                  } finally {
                      while (!queue.isEmpty()) {
                          queue.removeFirst().recycle();
                      }
                  }
              }

              private AccessibilityNodeInfo webFindActionNode(
                      AccessibilityNodeInfo root,
                      String... terms) {
                  if (root == null || terms == null || terms.length == 0) {
                      return null;
                  }

                  ArrayDeque<AccessibilityNodeInfo> queue = new ArrayDeque<>();
                  queue.add(AccessibilityNodeInfo.obtain(root));
                  AccessibilityNodeInfo partial = null;
                  int visited = 0;

                  try {
                      while (!queue.isEmpty() && visited++ < WEB_MAX_NODES) {
                          AccessibilityNodeInfo node = queue.removeFirst();
                          try {
                              if (node.isVisibleToUser()) {
                                  String combined = webNormalize(
                                          webNodeText(node) + " " +
                                          String.valueOf(node.getViewIdResourceName()));
                                  for (String term : terms) {
                                      String wanted = webNormalize(term);
                                      if (wanted.isBlank()) continue;
                                      if (combined.equals(wanted)) {
                                          if (partial != null) partial.recycle();
                                          return AccessibilityNodeInfo.obtain(node);
                                      }
                                      if (wanted.length() >= 4 &&
                                              combined.contains(wanted) &&
                                              partial == null) {
                                          partial = AccessibilityNodeInfo.obtain(node);
                                      }
                                  }
                              }

                              for (int index = 0;
                                   index < node.getChildCount();
                                   index++) {
                                  AccessibilityNodeInfo child = node.getChild(index);
                                  if (child != null) queue.addLast(child);
                              }
                          } finally {
                              node.recycle();
                          }
                      }
                      return partial;
                  } finally {
                      while (!queue.isEmpty()) queue.removeFirst().recycle();
                  }
              }

              private AccessibilityNodeInfo webFindEditableNode(
                      AccessibilityNodeInfo root) {
                  if (root == null) return null;

                  ArrayDeque<AccessibilityNodeInfo> queue = new ArrayDeque<>();
                  queue.add(AccessibilityNodeInfo.obtain(root));
                  int visited = 0;
                  try {
                      while (!queue.isEmpty() && visited++ < WEB_MAX_NODES) {
                          AccessibilityNodeInfo node = queue.removeFirst();
                          try {
                              if (node.isVisibleToUser() &&
                                      (node.isEditable() ||
                                       "android.widget.EditText".contentEquals(
                                               node.getClassName()))) {
                                  return AccessibilityNodeInfo.obtain(node);
                              }
                              for (int index = 0;
                                   index < node.getChildCount();
                                   index++) {
                                  AccessibilityNodeInfo child = node.getChild(index);
                                  if (child != null) queue.addLast(child);
                              }
                          } finally {
                              node.recycle();
                          }
                      }
                      return null;
                  } finally {
                      while (!queue.isEmpty()) queue.removeFirst().recycle();
                  }
              }

              private boolean webSetNodeText(
                      AccessibilityNodeInfo node,
                      String value) {
                  if (node == null || value == null) return false;
                  try {
                      Bundle arguments = new Bundle();
                      arguments.putCharSequence(
                              AccessibilityNodeInfo
                                      .ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                              value);
                      return node.performAction(
                              AccessibilityNodeInfo.ACTION_SET_TEXT,
                              arguments);
                  } finally {
                      node.recycle();
                  }
              }

              private boolean webPerformClickOnce(
                      AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  String signature = webUploadStage + ":" +
                          webNormalize(webNodeText(node) + " " +
                                  String.valueOf(node.getViewIdResourceName()));
                  long now = SystemClock.uptimeMillis();
                  try {
                      if (webGestureInFlight) return false;
                      if (webLastActionAt > 0L) {
                          long elapsed = now - webLastActionAt;
                          if (elapsed < WEB_ACTION_COOLDOWN_MS) return false;
                          if (signature.equals(webLastActionSignature) &&
                                  elapsed < WEB_SAME_ACTION_COOLDOWN_MS) {
                              return false;
                          }
                      }

                      boolean clicked = webPerformAccessibilityClick(node);
                      if (!clicked) {
                          clicked = dispatchWebNodeTap(node, signature);
                      }
                      if (!clicked) return false;

                      webLastActionAt = now;
                      webLastActionSignature = signature;
                      return true;
                  } finally {
                      node.recycle();
                  }
              }

              private boolean webNodeOrAncestorSelected(
                      AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  AccessibilityNodeInfo current =
                          AccessibilityNodeInfo.obtain(node);
                  try {
                      for (int depth = 0;
                           current != null && depth < 6;
                           depth++) {
                          if (current.isSelected() || current.isChecked()) {
                              return true;
                          }
                          AccessibilityNodeInfo parent =
                                  current.getParent();
                          current.recycle();
                          current = parent;
                      }
                      return false;
                  } finally {
                      if (current != null) current.recycle();
                  }
              }

              private boolean webPerformAccessibilityClick(
                      AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current =
                          AccessibilityNodeInfo.obtain(node);
                  try {
                      for (int depth = 0;
                           current != null && depth < 8;
                           depth++) {
                          if (current.isVisibleToUser() &&
                                  current.isEnabled() &&
                                  (current.isClickable() ||
                                   webHasAction(current,
                                           AccessibilityNodeInfo.ACTION_CLICK)) &&
                                  current.performAction(
                                          AccessibilityNodeInfo.ACTION_CLICK)) {
                              return true;
                          }
                          AccessibilityNodeInfo parent = current.getParent();
                          current.recycle();
                          current = parent;
                      }
                      return false;
                  } finally {
                      if (current != null) current.recycle();
                  }
              }

              private boolean dispatchWebNodeTap(
                      AccessibilityNodeInfo node,
                      String signature) {
                  if (node == null || webGestureInFlight ||
                          !isWebUploadActive() ||
                          webUploadStage == WEB_STAGE_IDLE) {
                      return false;
                  }

                  Rect bounds = new Rect();
                  node.getBoundsInScreen(bounds);
                  int screenWidth = getResources().getDisplayMetrics().widthPixels;
                  int screenHeight = getResources().getDisplayMetrics().heightPixels;
                  if (!node.isVisibleToUser() || !node.isEnabled() ||
                          bounds.isEmpty() ||
                          bounds.centerX() <= 0 || bounds.centerX() >= screenWidth ||
                          bounds.centerY() <= 0 || bounds.centerY() >= screenHeight ||
                          (bounds.width() > screenWidth * 0.96f &&
                           bounds.height() > screenHeight * 0.35f)) {
                      return false;
                  }

                  Path path = new Path();
                  path.moveTo(bounds.exactCenterX(), bounds.exactCenterY());
                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(new GestureDescription.StrokeDescription(
                                          path, 0L, 70L))
                                  .build();

                  final int generation = webGeneration;
                  final int expectedStage = webUploadStage;
                  webGestureInFlight = true;
                  boolean accepted = dispatchGesture(
                          gesture,
                          new GestureResultCallback() {
                              @Override
                              public void onCompleted(
                                      GestureDescription gestureDescription) {
                                  webGestureInFlight = false;
                                  if (generation == webGeneration &&
                                          expectedStage == webUploadStage &&
                                          isWebUploadActive()) {
                                      scheduleWebUploadStep(550L);
                                  }
                              }

                              @Override
                              public void onCancelled(
                                      GestureDescription gestureDescription) {
                                  webGestureInFlight = false;
                                  if (generation == webGeneration &&
                                          isWebUploadActive()) {
                                      scheduleWebUploadStep(400L);
                                  }
                              }
                          },
                          handler);
                  if (!accepted) {
                      webGestureInFlight = false;
                      return false;
                  }
                  webLastActionSignature = signature;
                  return true;
              }

              private boolean webHasAction(
                      AccessibilityNodeInfo node,
                      int actionId) {
                  if (node == null) return false;
                  for (AccessibilityNodeInfo.AccessibilityAction action :
                          node.getActionList()) {
                      if (action != null && action.getId() == actionId) {
                          return true;
                      }
                  }
                  return false;
              }

              private String webNodeText(
                      AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder value = new StringBuilder();
                  if (node.getText() != null) {
                      value.append(node.getText()).append(' ');
                  }
                  if (node.getContentDescription() != null) {
                      value.append(
                              node.getContentDescription()).append(' ');
                  }
                  return value.toString().trim();
              }

              private String webNormalize(String value) {
                  if (value == null) return "";
                  return Normalizer.normalize(
                                  value.toLowerCase(Locale.ROOT),
                                  Normalizer.Form.NFD)
                          .replaceAll("\\p{M}+", "")
                          .replaceAll("[^a-z0-9]+", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
              }

              private boolean isWebBrowserPackage(
                      String packageName) {
                  if (packageName == null) return false;
                  for (String candidate :
                          WEB_BROWSER_PACKAGES) {
                      if (candidate.equals(packageName)) {
                          return true;
                      }
                  }
                  return packageName
                          .toLowerCase(Locale.ROOT)
                          .contains("browser");
              }

              private boolean isWebFilePickerPackage(
                      String packageName) {
                  if (packageName == null) return false;
                  String lower =
                          packageName.toLowerCase(Locale.ROOT);
                  return lower.contains("documentsui") ||
                          lower.contains("myfiles") ||
                          lower.contains("filepicker") ||
                          lower.contains("picker") ||
                          lower.contains("documents");
              }

              private void completeWebUpload() {
                  resetWebUploadRequest();
                  Toast.makeText(
                          this,
                          "A GPX feltöltve, az útvonal szinkronizálása bekapcsolva.",
                          Toast.LENGTH_LONG).show();
              }

              private void failWebUpload(String message) {
                  resetWebUploadRequest();
                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_LONG).show();
              }

              private void resetWebUploadRequest() {
                  getSharedPreferences(
                          MainActivity.TOMTOM_UPLOAD_PREFS,
                          MODE_PRIVATE).edit()
                          .putBoolean(
                                  MainActivity.KEY_TOMTOM_UPLOAD_ACTIVE,
                                  false)
                          .remove(
                                  MainActivity.KEY_TOMTOM_FILE_NAME)
                          .remove(
                                  MainActivity.KEY_TOMTOM_ROUTE_NAME)
                          .remove(
                                  MainActivity.KEY_TOMTOM_UPLOAD_VERSION)
                          .remove(
                                  MainActivity.KEY_TOMTOM_UPLOAD_REQUESTED_AT)
                          .apply();
                  webGeneration++;
                  webUploadStage = WEB_STAGE_IDLE;
                  webUploadStepScheduled = false;
                  webPickerSearchEntered = false;
                  webGestureInFlight = false;
                  webTargetRouteSeen = false;
                  webSyncClickSent = false;
                  webSyncClickAt = 0L;
                  webFilePickerArmedUntil = 0L;
                  webUnexpectedPackageSince = 0L;
                  webUploadStartedAt = 0L;
                  webFileSelectedAt = 0L;
                  webLastActionAt = 0L;
                  webLastActionSignature = "";
                  webFileName = "";
                  webRouteName = "";
                  handler.removeCallbacks(webUploadStepRunnable);
                  updateFloatingButton();
              }

          }
          EOF

