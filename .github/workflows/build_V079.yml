              private void loadState() {
                  if (pickupEditor == null) return;
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);

                  setEditorText(pickupEditor,
                          preferences.getString(KEY_PICKUP_QUERY, ""));
                  setEditorText(deliveryEditor,
                          preferences.getString(KEY_DELIVERY_QUERY, ""));
                  setEditorText(waypointEditor,
                          preferences.getString(KEY_WAYPOINTS, ""));

                  updateStatus(preferences);
              }

              private void setEditorText(EditText editor, String value) {
                  String safe = value == null ? "" : value;
                  if (!safe.equals(editor.getText().toString())) {
                      editor.setText(safe);
                      editor.setSelection(editor.length());
                  }
              }

              private void saveQueriesAndWaypoints() {
                  if (pickupEditor == null) return;

                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String pickup = cleanAddressQuery(
                          pickupEditor.getText().toString());
                  String delivery = cleanAddressQuery(
                          deliveryEditor.getText().toString());
                  String oldPickup = preferences.getString(KEY_PICKUP_QUERY, "");
                  String oldDelivery = preferences.getString(KEY_DELIVERY_QUERY, "");

                  SharedPreferences.Editor editor = preferences.edit()
                          .putString(KEY_PICKUP_QUERY, pickup)
                          .putString(KEY_DELIVERY_QUERY, delivery)
                          .putString(KEY_WAYPOINTS,
                                  String.join("\n", cleanLines(
                                          waypointEditor.getText().toString())));

                  if (!pickup.equals(oldPickup)) {
                      editor.remove(KEY_PICKUP_COORD)
                              .remove(KEY_PICKUP_LABEL)
                              .remove(KEY_PICKUP_WARNING)
                              .putInt(KEY_REVIEW_CURSOR, 0);
                  }
                  if (!delivery.equals(oldDelivery)) {
                      editor.remove(KEY_DELIVERY_COORD)
                              .remove(KEY_DELIVERY_LABEL)
                              .remove(KEY_DELIVERY_WARNING)
                              .putInt(KEY_REVIEW_CURSOR, 0);
                  }

                  List<String> waypointLines = cleanLines(
                          waypointEditor.getText().toString());
                  List<String> labels = cleanLines(
                          preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  if (labels.size() != waypointLines.size()) {
                      ArrayList<String> generic = new ArrayList<>();
                      for (int index = 0; index < waypointLines.size(); index++) {
                          generic.add("Köztes " + (index + 1));
                      }
                      editor.putString(KEY_WAYPOINT_LABELS,
                              String.join("\n", generic));
                  }

                  editor.apply();
              }

              private void updateStatus(SharedPreferences preferences) {
                  String pickupQuery = preferences.getString(KEY_PICKUP_QUERY, "");
                  String pickupCoord = preferences.getString(KEY_PICKUP_COORD, "");
                  String pickupLabelValue = preferences.getString(KEY_PICKUP_LABEL, "");
                  String pickupWarning = preferences.getString(KEY_PICKUP_WARNING, "");

                  String deliveryQuery = preferences.getString(KEY_DELIVERY_QUERY, "");
                  String deliveryCoord = preferences.getString(KEY_DELIVERY_COORD, "");
                  String deliveryLabelValue = preferences.getString(KEY_DELIVERY_LABEL, "");
                  String deliveryWarning = preferences.getString(KEY_DELIVERY_WARNING, "");

                  pickupStatus.setText(endpointStatus(
                          "Felrakó", pickupQuery, pickupLabelValue, pickupCoord, pickupWarning));
                  pickupStatus.setTextColor(pickupWarning.isBlank()
                          ? Color.rgb(220, 225, 232)
                          : Color.rgb(255, 75, 75));
                  deliveryStatus.setText(endpointStatus(
                          "Lerakó", deliveryQuery, deliveryLabelValue, deliveryCoord, deliveryWarning));
                  deliveryStatus.setTextColor(deliveryWarning.isBlank()
                          ? Color.rgb(220, 225, 232)
                          : Color.rgb(255, 75, 75));

                  List<String> waypoints = cleanLines(
                          preferences.getString(KEY_WAYPOINTS, ""));
                  List<String> labels = cleanLines(
                          preferences.getString(KEY_WAYPOINT_LABELS, ""));

                  if (waypoints.isEmpty()) {
                      waypointStatus.setText("Nincs köztes pont.");
                  } else {
                      StringBuilder summary = new StringBuilder();
                      for (int index = 0; index < waypoints.size(); index++) {
                          String label = index < labels.size()
                                  ? labels.get(index)
                                  : "Köztes " + (index + 1);
                          if (summary.length() > 0) summary.append('\n');
                          summary.append(index + 1)
                                  .append(". ")
                                  .append(label)
                                  .append('\n')
                                  .append(waypoints.get(index));
                      }
                      waypointStatus.setText(summary.toString());
                  }

                  boolean pickupReady = normalizeCoordinate(pickupCoord) != null;
                  boolean deliveryReady = normalizeCoordinate(deliveryCoord) != null;
                  boolean ready = allCoordinates(waypoints) &&
                          (pickupReady || deliveryReady || !waypoints.isEmpty());

                  finishButton.setEnabled(ready);
                  finishButton.setAlpha(ready ? 1f : 0.45f);

                  boolean uncertain = (pickupReady && !pickupWarning.isBlank()) ||
                          (deliveryReady && !deliveryWarning.isBlank());
                  if (ready && uncertain) {
                      statusText.setTextColor(Color.rgb(255, 65, 65));
                      statusText.setText(
                              "⚠ BIZONYTALAN KOORDINÁTA – KÉZI GOOGLE MAPS ELLENŐRZÉS SZÜKSÉGES!\n" +
                              (pickupReady && !pickupWarning.isBlank()
                                      ? "Felrakó: " + pickupWarning + "\n" : "") +
                              (deliveryReady && !deliveryWarning.isBlank()
                                      ? "Lerakó: " + deliveryWarning + "\n" : "") +
                              "\nA TomTom útvonal sorrendje:\n" +
                              routePreview(preferences));
                  } else if (ready) {
                      statusText.setTextColor(Color.rgb(70, 210, 115));
                      statusText.setText(
                              "ELLENŐRIZVE – a TomTom útvonal sorrendje:\n" +
                              routePreview(preferences));
                  } else {
                      statusText.setTextColor(Color.rgb(235, 190, 85));
                      statusText.setText(
                              "Legalább egy felrakó, lerakó vagy köztes koordináta szükséges.");
                  }
              }

              private String endpointStatus(
                      String role,
                      String query,
                      String label,
                      String coordinate,
                      String warning) {
                  String normalized = normalizeCoordinate(coordinate);
                  if (normalized != null) {
                      String safeLabel = label.isBlank()
                              ? summarizeQuery(query)
                              : label;
                      if (warning != null && !warning.isBlank()) {
                          return "⚠ " + role + " – BIZONYTALAN TALÁLAT\n" +
                                  warning + "\nKÉZI ELLENŐRZÉS SZÜKSÉGES\n" +
                                  safeLabel + "\n" + normalized;
                      }
                      return role + " – " + safeLabel + "\n" + normalized;
                  }
                  if (query.isBlank()) {
                      return role + " – nincs adat.";
                  }
                  return role + " – ellenőrzésre vár\n" + summarizeQuery(query);
              }

              private String routePreview(SharedPreferences preferences) {
                  ArrayList<String> lines = new ArrayList<>();
                  if (normalizeCoordinate(preferences.getString(KEY_PICKUP_COORD, "")) != null) {
                      lines.add("Felrakó – " + safeLabel(
                              preferences.getString(KEY_PICKUP_LABEL, ""),
                              preferences.getString(KEY_PICKUP_QUERY, ""),
                              "Felrakó"));
                  }
                  List<String> waypointLabels = cleanLines(
                          preferences.getString(KEY_WAYPOINT_LABELS, ""));
                  List<String> waypoints = cleanLines(
                          preferences.getString(KEY_WAYPOINTS, ""));
                  for (int index = 0; index < waypoints.size(); index++) {
                      String label = index < waypointLabels.size()
                              ? waypointLabels.get(index)
                              : "Köztes " + (index + 1);
                      lines.add("Köztes " + (index + 1) + " – " + label);
                  }
                  if (normalizeCoordinate(preferences.getString(KEY_DELIVERY_COORD, "")) != null) {
                      lines.add("Lerakó – " + safeLabel(
                              preferences.getString(KEY_DELIVERY_LABEL, ""),
                              preferences.getString(KEY_DELIVERY_QUERY, ""),
                              "Lerakó"));
                  }
                  return String.join("\n", lines);
              }

              private void resolveNextUnverifiedPoint() {
                  String apiKey = getSavedGoogleApiKey();
                  if (GOOGLE_API_KEY_PATTERN.matcher(apiKey).matches()) {
                      autoGeocodeMissingPoints();
                  } else {
                      openNextPointForReview();
                  }
              }

              private void autoGeocodeMissingPoints() {
                  if (geocodingInProgress) return;
                  String apiKey = getSavedGoogleApiKey();
                  if (!GOOGLE_API_KEY_PATTERN.matcher(apiKey).matches()) return;

                  saveQueriesAndWaypoints();
                  SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);

                  String pickupCoord = normalizeCoordinate(
                          preferences.getString(KEY_PICKUP_COORD, ""));
                  String pickupQuery = preferences.getString(KEY_PICKUP_QUERY, "");
                  if (pickupCoord == null && !pickupQuery.isBlank()) {
                      geocodeAddressWithGoogle(TARGET_PICKUP, pickupQuery, apiKey);
                      return;
                  }

                  String deliveryCoord = normalizeCoordinate(
                          preferences.getString(KEY_DELIVERY_COORD, ""));
                  String deliveryQuery = preferences.getString(KEY_DELIVERY_QUERY, "");
                  if (deliveryCoord == null && !deliveryQuery.isBlank()) {
                      geocodeAddressWithGoogle(TARGET_DELIVERY, deliveryQuery, apiKey);
                  }
              }

              private void geocodeAddressWithGoogle(
                      String target,
                      String rawQuery,
                      String apiKey) {
                  String query = cleanAddressQuery(rawQuery);
                  if (query.isBlank()) return;
                  geocodingInProgress = true;

                  new Thread(() -> {
                      try {
                          SharedPlace place = null;
                          Exception placesError = null;

                          try {
                              place = searchPlaceWithGooglePlaces(query, apiKey);
                          } catch (Exception error) {
                              placesError = error;
                          }

                          if (place == null && hasStreetAddressEvidence(query)) {
                              String addressQuery = addressOnlyQuery(query);
                              place = geocodeStreetAddressWithGoogle(addressQuery, apiKey, query);
                          }

                          if (place == null) {
                              String detail = placesError == null
                                      ? ""
                                      : cleanQuery(placesError.getMessage());
                              throw new IOException(
                                      "A Google Places nem talált biztos céget vagy telephelyet." +
                                      (detail.isBlank() ? "" : "\n" + detail));
                          }

                          PlaceValidation validation = validateSelectedPlace(place, query);
                          if (validation.reject) {
                              throw new IOException(validation.message +
                                      "\nA másik országban lévő koordinátát NEM mentettem.");
                          }

                          SharedPlace finalPlace = place;
                          saveGeocodedEndpoint(target, finalPlace, validation.warning);
                          runOnUiThread(() -> {
                              geocodingInProgress = false;
                              loadState();
                              Toast.makeText(
                                      MainActivity.this,
                                      (TARGET_PICKUP.equals(target)
                                              ? "Felrakó"
                                              : "Lerakó") +
                                              (validation.warning.isBlank()
                                                      ? " helye elkészült:\n"
                                                      : " helye BIZONYTALAN – kézi ellenőrzés kell:\n") +
                                              finalPlace.label + "\n" +
                                              finalPlace.coordinate,
                                      validation.warning.isBlank()
                                              ? Toast.LENGTH_SHORT
                                              : Toast.LENGTH_LONG).show();
                              autoGeocodeMissingPoints();
                          });
                      } catch (Exception error) {
                          runOnUiThread(() -> {
                              geocodingInProgress = false;
                              loadState();
                              Toast.makeText(
                                      MainActivity.this,
                                      cleanQuery(error.getMessage()) +
                                              "\nA Google Maps gombbal kézzel is kiválasztható a hely.",
                                      Toast.LENGTH_LONG).show();
                          });
                      }
                  }, "google-place-resolution").start();
              }

              private SharedPlace searchPlaceWithGooglePlaces(
                      String query,
                      String apiKey) throws Exception {
                  URL url = new URL(
                          "https://places.googleapis.com/v1/places:searchText");
                  HttpURLConnection connection =
                          (HttpURLConnection) url.openConnection();
                  connection.setRequestMethod("POST");
                  connection.setDoOutput(true);
                  connection.setConnectTimeout(12000);
                  connection.setReadTimeout(12000);
                  connection.setRequestProperty(
                          "Content-Type", "application/json; charset=UTF-8");
                  connection.setRequestProperty("Accept", "application/json");
                  connection.setRequestProperty("X-Goog-Api-Key", apiKey);
                  connection.setRequestProperty(
                          "X-Goog-FieldMask",
                          "places.displayName,places.formattedAddress," +
                          "places.location,places.addressComponents,places.types");

                  JSONObject request = new JSONObject();
                  request.put("textQuery", query);
                  request.put("pageSize", 10);
                  String expectedCountry = extractCountryCode(query);
                  if (!expectedCountry.isBlank()) {
                      request.put("regionCode", expectedCountry);
                  }

                  byte[] payload = request.toString()
                          .getBytes(StandardCharsets.UTF_8);
                  connection.setFixedLengthStreamingMode(payload.length);
                  connection.getOutputStream().write(payload);

                  int httpStatus = connection.getResponseCode();
                  InputStream stream = httpStatus >= 400
                          ? connection.getErrorStream()
                          : connection.getInputStream();
                  String body = readLimited(stream, 524288);
                  connection.disconnect();

                  JSONObject root = new JSONObject(body);
                  if (httpStatus >= 400) {
                      JSONObject error = root.optJSONObject("error");
                      String detail = error == null
                              ? "HTTP " + httpStatus
                              : cleanQuery(error.optString(
                                      "message", "HTTP " + httpStatus));
                      throw new IOException("Google Places: " + detail);
                  }

                  JSONArray places = root.optJSONArray("places");
                  if (places == null || places.length() == 0) return null;

                  SharedPlace best = null;
                  int bestScore = Integer.MIN_VALUE;

                  for (int index = 0; index < places.length(); index++) {
                      JSONObject result = places.optJSONObject(index);
                      if (result == null) continue;

                      JSONObject location = result.optJSONObject("location");
                      if (location == null ||
                              !location.has("latitude") ||
                              !location.has("longitude")) {
                          continue;
                      }

                      String coordinate = normalizeCoordinate(
                              location.optDouble("latitude") + " " +
                              location.optDouble("longitude"));
                      if (coordinate == null) continue;

                      String country = placesAddressComponentShort(
                              result, "country");
                      if (!expectedCountry.isBlank() &&
                              !country.isBlank() &&
                              !expectedCountry.equals(country)) {
                          continue;
                      }

                      String city = placesAddressComponent(
                              result,
                              "locality",
                              "postal_town",
                              "administrative_area_level_3");
                      String postal = placesAddressComponent(
                              result, "postal_code");
                      JSONObject displayNameObject =
                              result.optJSONObject("displayName");
                      String displayName = displayNameObject == null
                              ? ""
                              : cleanQuery(displayNameObject.optString("text", ""));
                      String formatted = cleanQuery(
                              result.optString("formattedAddress", ""));

                      String label = displayName;
                      if (label.isBlank()) label = formatted;
                      if (!label.isBlank() && !city.isBlank() &&
                              !normalized(label).contains(normalized(city))) {
                          label = label + " – " + city;
                      }
                      if (label.isBlank()) label = summarizeQuery(query);

                      SharedPlace candidate = new SharedPlace(
                              label,
                              query,
                              coordinate,
                              city,
                              postal,
                              country);

                      int score = placeMatchScore(
                              result, candidate, query, displayName, formatted);
                      if (score > bestScore) {
                          bestScore = score;
                          best = candidate;
                      }
                  }

                  return best;
              }

              private SharedPlace geocodeStreetAddressWithGoogle(
                      String addressQuery,
                      String apiKey,
                      String originalQuery) throws Exception {
                  if (addressQuery.isBlank()) return null;

                  URL url = new URL(
                          "https://maps.googleapis.com/maps/api/geocode/json" +
                          "?address=" + Uri.encode(addressQuery) +
                          "&language=hu&key=" + Uri.encode(apiKey));
                  HttpURLConnection connection =
                          (HttpURLConnection) url.openConnection();
                  connection.setConnectTimeout(12000);
                  connection.setReadTimeout(12000);
                  connection.setRequestProperty("Accept", "application/json");

                  int httpStatus = connection.getResponseCode();
                  InputStream stream = httpStatus >= 400
                          ? connection.getErrorStream()
                          : connection.getInputStream();
                  String body = readLimited(stream, 262144);
                  connection.disconnect();

                  JSONObject root = new JSONObject(body);
                  String status = root.optString("status", "UNKNOWN_ERROR");
                  if (!"OK".equals(status)) {
                      String detail = cleanQuery(
                              root.optString("error_message", ""));
                      throw new IOException(
                              "Google Geocoding: " + status +
                              (detail.isBlank() ? "" : " – " + detail));
                  }

                  JSONArray results = root.optJSONArray("results");
                  if (results == null || results.length() == 0) return null;

                  JSONObject result = results.getJSONObject(0);
                  JSONObject location = result
                          .getJSONObject("geometry")
                          .getJSONObject("location");
                  String coordinate = normalizeCoordinate(
                          location.getDouble("lat") + " " +
                          location.getDouble("lng"));
                  if (coordinate == null) return null;

                  String city = googleAddressComponent(result,
                          "locality", "postal_town",
                          "administrative_area_level_3");
                  String postal = googleAddressComponent(result, "postal_code");
                  String country = googleAddressComponentShort(result, "country");
                  String formatted = cleanQuery(
                          result.optString("formatted_address", addressQuery));
                  String company = extractCompanyHint(originalQuery);
                  String label = company.isBlank()
                          ? formatted
                          : (city.isBlank()
                                  ? company
                                  : company + " – " + city);

                  return new SharedPlace(
                          label,
                          originalQuery,
                          coordinate,
                          city,
                          postal,
                          country);
              }

              private int placeMatchScore(
                      JSONObject result,
                      SharedPlace candidate,
                      String query,
                      String displayName,
                      String formattedAddress) {
                  int score = 0;
                  String expectedCountry = extractCountryCode(query);
                  String expectedPostal = extractPostalCode(query);
                  String expectedCity = extractCity(query);
                  String company = extractCompanyHint(query);

                  if (!expectedCountry.isBlank() &&
                          expectedCountry.equals(candidate.countryCode)) {
                      score += 180;
                  }

                  if (!expectedPostal.isBlank() &&
                          !candidate.postalCode.isBlank()) {
                      score += postalCodesCompatible(
                              expectedPostal, candidate.postalCode) ? 90 : -25;
                  }

                  if (!expectedCity.isBlank() && !candidate.city.isBlank()) {
                      score += sameCity(expectedCity, candidate.city) ? 65 : -15;
                  }

                  if (!company.isBlank() && !displayName.isBlank()) {
                      String expectedName = normalized(company);
                      String foundName = normalized(displayName);
                      if (expectedName.equals(foundName)) {
                          score += 260;
                      } else if (expectedName.contains(foundName) ||
                              foundName.contains(expectedName)) {
                          score += 210;
                      } else {
                          score += tokenOverlapScore(company, displayName) * 35;
                      }
                  }

                  score += tokenOverlapScore(
                          query, displayName + " " + formattedAddress) * 5;

                  if (isAdministrativeOnlyPlace(result)) {
                      score -= 300;
                  }

                  return score;
              }

              private int tokenOverlapScore(String expected, String found) {
                  String left = normalized(expected);
                  String right = normalized(found);
                  if (left.isBlank() || right.isBlank()) return 0;

                  int score = 0;
                  for (String token : left.split(" ")) {
                      if (token.length() < 3 ||
                              token.matches("\\d+") ||
                              COUNTRY_TOKEN_PATTERN.matcher(
                                      token.toUpperCase(Locale.ROOT)).matches()) {
                          continue;
                      }
                      if ((" " + right + " ").contains(" " + token + " ") ||
                              right.contains(token)) {
                          score++;
                      }
                  }
                  return score;
              }

              private boolean isAdministrativeOnlyPlace(JSONObject result) {
                  JSONArray types = result.optJSONArray("types");
                  if (types == null || types.length() == 0) return false;

                  boolean administrative = false;
                  for (int index = 0; index < types.length(); index++) {
                      String type = types.optString(index, "");
                      if (type.equals("locality") ||
                              type.equals("postal_code") ||
                              type.equals("sublocality") ||
                              type.startsWith("sublocality_level_") ||
                              type.startsWith("administrative_area_level_")) {
                          administrative = true;
                          continue;
                      }
                      if (!type.equals("political") &&
                              !type.equals("geocode")) {
                          return false;
                      }
                  }
                  return administrative;
              }

              private String extractCompanyHint(String query) {
                  String clean = cleanAddressQuery(query);
                  if (clean.isBlank()) return "";

                  String first = cleanQuery(clean.split(",", 2)[0]);
                  if (first.isBlank() ||
                          POSTAL_CODE_PATTERN.matcher(first).find()) {
                      return "";
                  }

                  String normalizedFirst = normalized(first);
                  if (normalizedFirst.matches("^\\d+.*") ||
                          containsStreetWord(normalizedFirst)) {
                      return "";
                  }
                  return first;
              }

              private String addressOnlyQuery(String query) {
                  String clean = cleanAddressQuery(query);
                  String company = extractCompanyHint(clean);
                  if (company.isBlank()) return clean;

                  int comma = clean.indexOf(',');
                  if (comma < 0 || comma + 1 >= clean.length()) return clean;
                  return cleanQuery(clean.substring(comma + 1));
              }

              private boolean hasStreetAddressEvidence(String query) {
                  String address = addressOnlyQuery(query);
                  String withoutPostal = POSTAL_CODE_PATTERN.matcher(address)
                          .replaceAll(" ");
                  if (withoutPostal.matches(".*\\b\\d{1,5}[A-Za-z]?\\b.*")) {
                      return true;
                  }
                  return containsStreetWord(normalized(withoutPostal));
              }

              private boolean containsStreetWord(String normalizedValue) {
                  String padded = " " + normalizedValue + " ";
                  String[] words = {
                          " route ", " rue ", " chemin ", " avenue ",
                          " boulevard ", " impasse ", " quai ", " place ",
                          " street ", " road ", " lane ", " drive ",
                          " strasse ", " straße ", " platz ", " weg ",
                          " gasse ", " allee ", " allée ", " laan ",
                          " straat ", " ulica ", " ul ", " utca ", " ut "
                  };
                  for (String word : words) {
                      if (padded.contains(word)) return true;
                  }
                  return false;
              }

              private String placesAddressComponent(
                      JSONObject result,
                      String... acceptedTypes) {
                  JSONArray components = result.optJSONArray("addressComponents");
                  if (components == null) return "";

                  for (String acceptedType : acceptedTypes) {
                      for (int index = 0; index < components.length(); index++) {
                          JSONObject component = components.optJSONObject(index);
                          if (component == null) continue;
                          JSONArray types = component.optJSONArray("types");
                          if (types == null) continue;
                          for (int typeIndex = 0;
                                  typeIndex < types.length();
                                  typeIndex++) {
                              if (acceptedType.equals(
                                      types.optString(typeIndex))) {
                                  return cleanQuery(component.optString(
                                          "longText", ""));
