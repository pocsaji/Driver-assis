                              : countryCode.toUpperCase(Locale.ROOT);
                  }
              }

              private static final class PlaceValidation {
                  final boolean reject;
                  final String warning;
                  final String message;

                  private PlaceValidation(boolean reject, String warning, String message) {
                      this.reject = reject;
                      this.warning = warning == null ? "" : warning;
                      this.message = message == null ? "" : message;
                  }

                  static PlaceValidation accept() {
                      return new PlaceValidation(false, "", "");
                  }

                  static PlaceValidation warning(String warning) {
                      return new PlaceValidation(false, warning, warning);
                  }

                  static PlaceValidation reject(String message) {
                      return new PlaceValidation(true, "", message);
                  }
              }
