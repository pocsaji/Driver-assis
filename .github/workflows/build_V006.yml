      - name: Audit Driver Assist V006 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          base_paths = sorted(java_root.glob('*.java'))
          database_paths = sorted((java_root / 'database').glob('*.java'))
          assert len(base_paths) == 6, base_paths
          assert len(database_paths) == 4, database_paths

          for path in base_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist;'), path
              assert source.rstrip().endswith('}'), path
          for path in database_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist.database;'), path
              assert source.rstrip().endswith('}'), path

          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          settings = Path('settings.gradle.kts').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')
          main = (java_root / 'MainActivity.java').read_text(encoding='utf-8')
          service = (java_root / 'TomTomAccessibilityService.java').read_text(encoding='utf-8')
          database_activity = (java_root / 'database/DatabaseManagementActivity.java').read_text(encoding='utf-8')
          database_store = (java_root / 'database/LocationDatabase.java').read_text(encoding='utf-8')
          transfer = (java_root / 'database/DatabaseTransfer.java').read_text(encoding='utf-8')
          poi_list = (java_root / 'database/PoiListActivity.java').read_text(encoding='utf-8')

          assert 'versionCode = 6' in gradle
          assert 'versionName = "006"' in gradle
          assert 'DriverAssistV006' in settings
          assert 'Driver Assist V006' in manifest
          assert 'Driver Assist V006' in strings
          assert 'private static final String VERSION = "V006";' in main
