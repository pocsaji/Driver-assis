      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"

      - name: Build signed Driver Assist V006 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle fordítás indul"
          gradle --no-daemon --console=plain assembleRelease bundleRelease --stacktrace
          echo "Gradle fordítás befejezve"

      - name: Collect Driver Assist V006 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V006.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V006.aab
          ls -lah artifact

      - name: Upload Driver Assist V006
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V006
          path: |
            artifact/Driver_Assist_V006.apk
            artifact/Driver_Assist_V006.aab
          if-no-files-found: error
          retention-days: 14
