              'minimumX = -(panelWidth - visibleStrip)',
              'KÖVETKEZŐ PONT ▶',
              'KÖVETKEZŐ SZAKASZ ▶'
          ]:
              assert required in external_overlay, required
          for required in [
              '<package android:name="com.waze" />',
              'android:name=".ExternalNavigationOverlayService"',
              'User-started floating Google Maps and Waze route panel'
          ]:
              assert required in manifest, required
          for required in [
              'new int[]{0, 4}', 'new int[]{4, 8}', 'new int[]{8, 9}',
              'tenPointsUseThreeOverlappingSegments',
              'sixPointsUseTwoConnectedSegments'
          ]:
              assert required in external_test, required
          clear_flow = section(main, 'private void clearAll()', 'private int dp(int value)')
          assert 'ExternalNavigationOverlayService.class' in clear_flow

          # Korábbi V060 UI/overlay/DB javítások megmaradtak.
          ui = section(main, 'private void buildUi()', 'private void applySamsungNavigationBarClearance')
          for required in ['"KERESÉS"', '"↑ FELHŐBE\\nMENTÉS"', '"↓ FELHŐBŐL\\nBETÖLTÉS"', '"TÖRLÉS /\\nÚJ KEZDÉS"', '"KÜLDÉS\\nNAVIGÁCIÓRA"', 'showNavigationMenu()', 'actionColumn.addView(settingsButton, buttonParams())']:
              assert required in ui, required
          assert 'smallestScreenWidthDp >= 600' in main
          for required in ['LEBEGŐ VÁGÓLAP', 'Settings.canDrawOverlays(this)', 'RouteClipboardOverlayService.ACTION_START']:
              assert required in main, required
          for required in ['MINIMUM_VISIBLE_STRIP_DP = 59', 'FLAG_LAYOUT_NO_LIMITS', 'minimumX = -(panelWidth - visibleStrip)', 'setPrimaryClip(']:
              assert required in overlay, required
          assert 'AUTO_MERGE_METERS' in database
          assert 'addPoiToRoute' in poi_search
          
          print('DRIVER_ASSIST_V067_SOURCE_AUDIT_OK')
