              'return true;',
              'private boolean routeAlreadyContains(SharedPlace place)',
              'private void clearRouteInsertionPendingState('
          ]:
              assert required in insert_flow, required
          assert 'Ez a hely már szerepel az útvonalban.' not in insert_flow
          saved_poi_flow = section(main, 'private void showSavedPoiRouteQuestion(', 'private void showRouteInsertionPositionDialog(')
          for required in [
              'boolean scanQueuePending = hasPendingScanQueue();',
              'if (routeAlreadyContains(persistedPlace))',
              'finishSavedPoiRouteDecision(scanQueuePending);',
              'finishDecision,',
              'finishDecision.run()',
              'completeCurrentScannedAddress();'
          ]:
              assert required in saved_poi_flow, required
          scan_dialog = section(main, 'private void showScannedResolvedPlaceDialog(', 'private void showScannedAddressMapFallback(')
          assert scan_dialog.count('this::completeCurrentScannedAddress') >= 2
          general_results = section(main, 'private void showGeneralDatabaseResults(', 'private String insertionPositionLabel(')
          assert '? this::completeCurrentScannedAddress' in general_results
          map_capture = section(main, 'private void approveCapturedMapPoint(', 'private void advanceRouteReviewAfterApproval()')
          assert 'if (scanQueuePending) {' in map_capture and 'completeCurrentScannedAddress();' in map_capture
          
          # V067 Google Maps és Waze integráció: a korábbi három navigációs ág változatlanul megmarad,
          # az új ágak kizárólag kanonikus 1..N sorrendet használnak.
          external_flow = section(main, 'private void showNavigationMenu()', 'private void startRouteClipboardOverlay()')
          for required in [
              '"TOMTOM INDÍTÁSA"', '"KÜLDÉS iGO-RA"', '"LEBEGŐ VÁGÓLAP"',
              '"GOOGLE MAPS"', '"WAZE"',
              'ExternalNavigationOverlayService.MODE_GOOGLE_MAPS',
              'ExternalNavigationOverlayService.MODE_WAZE',
              'ExternalNavigationPlan.googleMapsRanges(',
              'for (ReviewPoint point : routePoints)',
              'labels.add((point.index + 1) + ". " + label);'
          ]:
              assert required in external_flow, required
          assert 'tomTomClipboardInputOrder(routePoints)' not in section(
              main,
              'private String createExternalNavigationPayload(',
              'private boolean isApplicationInstalled('
          )
          for required in [
              'GOOGLE_MAPS_MAX_POINTS_PER_SEGMENT = 5',
              'start + GOOGLE_MAPS_MAX_POINTS_PER_SEGMENT - 1',
              'result.add(new int[]{start, end});',
              'start = end;'
          ]:
              assert required in external_plan, required
          for required in [
              'MODE_WAZE = "waze"',
              'MODE_GOOGLE_MAPS = "google_maps"',
              'WAZE_PACKAGE = "com.waze"',
              'GOOGLE_MAPS_PACKAGE = "com.google.android.apps.maps"',
              'https://waze.com/ul',
              'https://www.google.com/maps/dir/',
              'builder.appendQueryParameter(',
