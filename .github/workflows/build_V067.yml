              assert required in ui, required
          for required in ['KEY_SCAN_PROCESSING_ACTIVE', 'KEY_SCAN_PROCESSING_MESSAGE', 'refreshBackgroundWorkIndicator()', 'ADATBÁZIS-KERESÉS FOLYAMATBAN', 'POI-ADATBÁZIS FRISSÍTÉSE FOLYAMATBAN']:
              assert required in main, required
          for required in ['publishScanProcessing(', 'FELDOLGOZÁS FOLYAMATBAN', 'publishScanProcessing(false, "")']:
