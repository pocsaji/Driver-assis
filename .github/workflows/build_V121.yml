      - name: Verify V121 direct TomTom route automation
        shell: bash
        run: |
          set -euo pipefail
          MAIN='app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java'
          SERVICE='app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java'
          MANIFEST='app/src/main/AndroidManifest.xml'
          ACCESS='app/src/main/res/xml/accessibility_service_config.xml'

          grep -F 'rootProject.name = "TomTomKiszolgaloV121"' settings.gradle.kts
          grep -F 'versionCode = 121' app/build.gradle.kts
          grep -F 'versionName = "121"' app/build.gradle.kts
          grep -F 'TomTom Kiszolgáló V121' "$MANIFEST"
          grep -F 'private static final String VERSION = "V121";' "$MAIN"
          grep -F 'private static final String VERSION = "V121";' "$SERVICE"
          grep -F 'com.tomtom.gplay.navapp' "$MANIFEST"
          grep -F 'com.tomtom.gplay.navapp' "$ACCESS"
          grep -F 'TomTomAccessibilityService.beginTomTomRoute(targets)' "$MAIN"
          grep -F 'KÉSZ – ÚTVONAL BEÍRÁSA A TOMTOMBA' "$MAIN"
          grep -F 'közvetlen TomTom útvonalbevitel' "$MAIN"
          grep -F 'public static boolean beginTomTomRoute' "$SERVICE"
          grep -F 'Szélesség Hosszúság' "$SERVICE"
          grep -F 'Locale.US, "%.6f %.6f"' "$SERVICE"
          grep -F 'TT_OPEN_INITIAL_SEARCH' "$SERVICE"
          grep -F 'TT_OPEN_ADD_STOP_SEARCH' "$SERVICE"
          grep -F 'Megálló hozzáadása' "$SERVICE"
          grep -F 'TT_SELECT_INITIAL_RESULT' "$SERVICE"
          grep -F 'TT_CONFIRM_VEHICLE' "$SERVICE"
          grep -F 'TT_START_INITIAL_ROUTE' "$SERVICE"
          grep -F 'TT_SELECT_STOP_RESULT' "$SERVICE"
          grep -F 'tapRatio(0.36f, 0.155f);' "$SERVICE"
          grep -F 'tapRatio(0.80f, 0.90f);' "$SERVICE"
          grep -F 'tapRatio(0.905f, 0.585f);' "$SERVICE"
          grep -F 'Hozzáadás' "$SERVICE"
          grep -F 'Vezetés' "$SERVICE"
          grep -F 'tomTomReverseIndex = tomTomRoute.size() - 2;' "$SERVICE"
          grep -F 'android:canPerformGestures="true"' "$ACCESS"

          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = list(Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo').glob('*.java'))
          for path in paths:
              source = path.read_text(encoding='utf-8')
              assert source.rstrip().endswith('}'), path
              assert source.count('{') == source.count('}'), path

          main = Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/MainActivity.java').read_text(encoding='utf-8')
          service = Path('app/src/main/java/hu/pocsaji/tomtomkiszolgalo/TomTomAccessibilityService.java').read_text(encoding='utf-8')
          route_method = main.split('private void openVerifiedRoute()', 1)[1].split(
              'private void resolveCurrentLocationAndSave', 1)[0]
          assert 'beginTomTomRoute(targets)' in route_method
          assert 'saveTomTomGpxToDownloads(targets)' not in route_method
          assert '"%.6f %.6f"' in service
          assert 'TT_CHOOSE_INITIAL_COORDINATE_MODE' in service
          assert 'TT_CHOOSE_STOP_COORDINATE_MODE' in service
          assert service.count('public static boolean beginTomTomRoute(') == 1
          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          print('V121_DIRECT_TOMTOM_AUTOMATION_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed TomTom Kiszolgalo V121 APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect V121 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/TomTom_Kiszolgalo_V121.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/TomTom_Kiszolgalo_V121.aab
          ls -lah artifact

      - name: Upload TomTom Kiszolgalo V121
        uses: actions/upload-artifact@v4
        with:
          name: TomTom_Kiszolgalo_V121
          path: |
            artifact/TomTom_Kiszolgalo_V121.apk
            artifact/TomTom_Kiszolgalo_V121.aab
          if-no-files-found: error
