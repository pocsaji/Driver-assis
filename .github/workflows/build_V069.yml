              'DOWNLOAD_ROUTE', 'OPEN_SETTINGS', 'GO_BACK', 'CANCEL'
          ]
          for action in allowed_actions:
              assert ('case VoiceCommandAction.' + action) in main, action
              assert ('public static final String ' + action) in voice_action, action
          
          for required in [
              'Supplier<String> apiKeySupplier',
              'VoiceCommandSessionBuffer',
              'dispatcher.stateSnapshot()',
              'interpretationToken',
              'AUTO_STOP_AFTER_FINAL_SEGMENT_MS',
              'MAX_LISTENING_MS'
          ]:
              assert required in voice_controller, required
          
          for required in [
              'https://api.openai.com/v1/responses',
              '"type", "json_schema"',
              '"strict", true',
              'driver_assist_voice_command_plan',
              'AKTUÁLIS ALKALMAZÁSÁLLAPOT',
              'SEARCH_POI',
              'NEEDS_CLARIFICATION'
          ]:
              assert required in voice_interpreter, required
          assert 'parallel_tool_calls' not in voice_interpreter
          
          for required in [
              'VoiceCommandValidator.validate(plan)',
              'AtomicBoolean callbackConsumed',
              'persistentContext',
              'history.markRunning',
              'history.markSucceeded',
              'history.markFailed'
          ]:
              assert required in voice_dispatcher, required
          
          for required in [
              'isAllowedType',
              'isNavigationProvider',
              'törlési művelet megerősítés nélkül'
          ]:
              assert required in voice_validator, required
          
          for required in ['WAITING', 'RUNNING', 'SUCCEEDED', 'FAILED', 'SKIPPED', 'snapshot()']:
              assert required in voice_history, required
          for required in ['selected_result_label', 'results', 'poi_id']:
              assert required in voice_context, required
          for required in ['searchAround(', 'searchText(', 'findPoiCandidatesInBounds(', 'distanceMeters(']:
              assert required in voice_search, required
          for required in ['actions', 'status', 'clarificationQuestion']:
              assert required in voice_plan, required
          for required in ['buildVoiceCommandState()', 'executeVoiceAction(', 'requestVoiceConfirmation(', 'requestVoiceClarification(']:
              assert required in voice_host, required
          for required in ['append(', 'value()', 'reset()']:
              assert required in voice_buffer, required
          
          for required in [
              'voiceButton = compactButton("MIKROFON"',
              'processOverlayVoiceCommand',
              'ACTION_PROCESS_VOICE_TEXT',
              'KÖVETKEZŐ PONT',
              'SPOKEN_INDEX_PATTERN'
          ]:
              assert required in external_overlay, required
          
          for required in [
              'android.permission.RECORD_AUDIO',
              'android.permission.FOREGROUND_SERVICE_MICROPHONE',
              'android:foregroundServiceType="microphone"'
          ]:
              assert required in manifest, required
          
          for required in [
              'testImplementation("org.json:json:20250517")'
          ]:
              assert required in gradle, required
          
          for required in [
              'speechSegmentsAreCombinedInArrivalOrder',
              'dispatcherConsumesEachCallbackOnlyOnceAndPreservesContext',
              'destructiveActionWithoutConfirmationIsRejectedBeforeExecution'
          ]:
              assert required in voice_test, required
          
          print('DRIVER_ASSIST_V069_VOICE_AUDIT_OK')
          print('DRIVER_ASSIST_V069_SOURCE_AUDIT_OK')
          print('ROLE_LITERAL_HITS_ALLOWED', len(role_hits))
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V069 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V069 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V069.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V069.aab
          sha256sum artifact/Driver_Assist_V069.apk artifact/Driver_Assist_V069.aab \
            | tee artifact/Driver_Assist_V069_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V069
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V069
          path: |
            artifact/Driver_Assist_V069.apk
            artifact/Driver_Assist_V069.aab
            artifact/Driver_Assist_V069_SHA256.txt
          if-no-files-found: error
          retention-days: 14
