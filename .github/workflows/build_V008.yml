      - name: Audit Driver Assist V008 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          java_root = root / 'app/src/main/java/hu/pocsaji/driverassist'
          base_paths = sorted(java_root.glob('*.java'))
          database_paths = sorted((java_root / 'database').glob('*.java'))
          assert len(base_paths) == 6, base_paths
          assert len(database_paths) == 4, database_paths

          for path in base_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist;'), path
              assert source.rstrip().endswith('}'), path
          for path in database_paths:
              source = path.read_text(encoding='utf-8')
              assert source.startswith('package hu.pocsaji.driverassist.database;'), path
              assert source.rstrip().endswith('}'), path

          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          settings = Path('settings.gradle.kts').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')
          main = (java_root / 'MainActivity.java').read_text(encoding='utf-8')
          service = (java_root / 'TomTomAccessibilityService.java').read_text(encoding='utf-8')
          database_activity = (java_root / 'database/DatabaseManagementActivity.java').read_text(encoding='utf-8')
          database_store = (java_root / 'database/LocationDatabase.java').read_text(encoding='utf-8')
          transfer = (java_root / 'database/DatabaseTransfer.java').read_text(encoding='utf-8')
          poi_list = (java_root / 'database/PoiListActivity.java').read_text(encoding='utf-8')

          assert 'versionCode = 8' in gradle
          assert 'versionName = "008"' in gradle
          assert 'DriverAssistV008' in settings
          assert 'Driver Assist V008' in manifest
          assert 'Driver Assist V008' in strings
          assert 'private static final String VERSION = "V008";' in main
          assert 'static final String PREFS = "driver_assist_v008";' in main
          assert 'private static final String PREVIOUS_PREFS = "driver_assist_v007";' in main
          assert 'migration_v008_done' in main
          assert 'DatabaseManagementActivity.class' in main
          assert 'createTwoButtonRow(resolveButton, waypointButton)' in main
          assert 'createTwoButtonRow(finishButton, clearButton)' in main
          assert 'WindowInsets.Type.navigationBars()' in main
          assert 'Math.max(dp(96), navigationBottom + dp(30))' in main
          assert 'button.setSingleLine(true);' in main
          assert 'ELLENŐRIZVE – " + routePointCount + " útvonalpont' in main
          assert '.database.DatabaseManagementActivity' in manifest
          assert '.database.PoiListActivity' in manifest
          assert 'NEARBY_POI_METERS = 200.0' in main
          assert 'RELATED_POI_METERS = 2000.0' in main
          assert 'RELATED_POI_SCAN_LIMIT = 500' in main
          assert 'NEARBY_POI_LIMIT = 50' in main
          assert 'reviewPlaceAgainstDatabase' in main
          assert 'showNearbyPoiDialog' in main
          assert 'openPoiComparisonMap' in main
          assert 'GOOGLE-PONT HASZNÁLATA' in main
          assert 'Új POI elmentve 1 megerősítéssel' in main
          assert 'Mentett és megerősített POI • ' in main
          assert 'selectRelevantPoiCandidates' in main
          assert 'poiNameRelated' in main
          assert 'businessNameRelated' in main
          assert 'editDistanceAtMost' in main
          assert 'Google-találat; térképen külön is ellenőrizhető' in main
          assert 'isBlockingWarning' in main
          assert 'endpointStatusColor' in main

          assert 'POI-LISTA – KERESÉS ÉS SZERKESZTÉS' in database_activity
          assert 'EXTRA_ALLOW_MULTIPLE' in database_activity
          assert 'showResultDialog' in database_activity
          assert 'DatabaseTransfer.BASE_FOLDER' in database_activity

          assert 'CREATE TABLE ' in database_store
          assert 'company_name' in database_store
          assert 'AUTO_MERGE_METERS = 20.0' in database_store
          assert 'distance <= maximumMeters' in database_store
          assert 'A már eltárolt koordináta marad' in database_store
          assert 'Koordinátás rekordnál kizárólag a távolság dönthet' in database_store
          assert 'verification_count' in database_store
          assert 'CATEGORY_SHOP' in database_store and 'CATEGORY_PARKING' in database_store
          assert 'countPoiMatches' in database_store
          assert 'searchPoi' in database_store
          assert 'updatePoi' in database_store
          assert 'deletePoi' in database_store
          assert 'findPoiWithin' in database_store
          assert 'incrementVerification' in database_store
          assert 'insertConfirmedPoi' in database_store
          assert 'public static final class NearbyPoi' in database_store

          assert 'Environment.DIRECTORY_DOWNLOADS + "/Drive Assist"' in transfer
          assert 'MediaStore.Downloads.getContentUri' in transfer
          assert 'MediaStore.Files.getContentUri' not in transfer
          assert 'parseUpoi' in transfer
          assert 'exportUpoiByCategories' in transfer
          assert 'exportUpiByCategories' not in transfer
          assert 'UTF_16LE' in transfer
          assert 'validateUpoiBytes' in transfer
          assert 'verifyWrittenFile' in transfer
          assert 'IMPORT_FOLDER' in transfer and 'EXPORT_FOLDER' in transfer and 'BACKUP_FOLDER' in transfer
          assert 'database_transfer_v008' in transfer

          assert 'PAGE_SIZE = 100' in poi_list
          assert 'openEditor' in poi_list
          assert 'MEGERŐSÍTÉS +1' in poi_list
          assert 'database.updatePoi(record)' in poi_list
          assert 'database.deletePoi(record.id)' in poi_list

          assert 'public static boolean beginTomTomRoute(' in service
          assert 'TT_SEARCH_RESULT_FALLBACK_ATTEMPT = 14' in service
          assert 'tomTomNotBefore' in service
          assert 'scheduleTomTomStep(450L);' in service
          assert service.count('public static boolean beginTomTomRoute(') == 1

          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/xml/accessibility_service_config.xml')
          ET.parse('app/src/main/res/values/strings.xml')
          print('DRIVER_ASSIST_V008_AUDIT_OK')
          PY_VERIFY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"

      - name: Build signed Driver Assist V008 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle fordítás indul"
          gradle --no-daemon --console=plain assembleRelease bundleRelease --stacktrace
          echo "Gradle fordítás befejezve"

      - name: Collect Driver Assist V008 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V008.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V008.aab
          ls -lah artifact

      - name: Upload Driver Assist V008
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V008
          path: |
            artifact/Driver_Assist_V008.apk
            artifact/Driver_Assist_V008.aab
          if-no-files-found: error
          retention-days: 14
