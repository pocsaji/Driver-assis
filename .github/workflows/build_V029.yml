      - name: Audit Driver Assist V029 source
        shell: bash
        run: |
          set -euo pipefail
          echo "Forrásellenőrzés indul"
          python - <<'PY_VERIFY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path('.')
          java_root=root/'app/src/main/java/hu/pocsaji/driverassist'
          main=(java_root/'MainActivity.java').read_text('utf-8')
          service=(java_root/'TomTomAccessibilityService.java').read_text('utf-8')
          gradle=(root/'app/build.gradle.kts').read_text('utf-8')
          settings=(root/'settings.gradle.kts').read_text('utf-8')
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          strings=(root/'app/src/main/res/values/strings.xml').read_text('utf-8')
          alltext='\n'.join(p.read_text('utf-8',errors='replace') for p in root.rglob('*') if p.is_file())
          
          # lightweight lexer brace balance
          def balanced_java(source,path):
              stack=[]; i=0; state='code'; pairs={')':'(',']':'[','}':'{'}
              while i<len(source):
                  ch=source[i]; nxt=source[i+1] if i+1<len(source) else ''
                  if state=='code':
                      if ch=='/' and nxt=='/': state='line'; i+=2; continue
                      if ch=='/' and nxt=='*': state='block'; i+=2; continue
                      if ch=='"': state='string'; i+=1; continue
                      if ch=="'": state='char'; i+=1; continue
                      if ch in '([{': stack.append(ch)
                      elif ch in ')]}':
                          assert stack and stack[-1]==pairs[ch], (path,i,ch,stack[-5:])
                          stack.pop()
                  elif state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and nxt=='/': state='code'; i+=2; continue
                  elif state in ('string','char'):
                      if ch=='\\': i+=2; continue
                      if (state=='string' and ch=='"') or (state=='char' and ch=="'"): state='code'
                  i+=1
              assert state in ('code','line'), (path,state)
              assert not stack,(path,stack)
          
          for path in java_root.rglob('*.java'):
              src=path.read_text('utf-8')
              assert src.startswith('package hu.pocsaji.driverassist'), path
              assert src.rstrip().endswith('}'), path
              balanced_java(src,path)
          
          # Identity/version
          assert 'versionCode = 29' in gradle
          assert 'versionName = "029"' in gradle
          assert 'DriverAssistV029' in settings
          assert 'Driver Assist V029' in manifest and 'Driver Assist V029' in strings
          assert 'private static final String VERSION = "V029";' in main
          assert 'private static final String VERSION = "V029";' in service
          assert 'static final String PREFS = "driver_assist_v029";' in main
          assert 'PREVIOUS_PREFS_VERSIONS = {28, 27, 26' in main
          assert 'migration_v029_done' in main
          assert not re.search(r'(?i)\bv028\b|driver_assist_v028|DriverAssistV028', alltext)
          
          # Simplified main UI
          ui=main.split('private void buildUi()',1)[1].split('private void applySamsungNavigationBarClearance',1)[0]
          assert 'CÍMKERESÉS – név, város vagy teljes cím' in ui
          assert 'CÍM / POI KERESÉSE' in ui
          assert 'ÚTVONALPONTOK – SORREND ÉS ELLENŐRZÉS' in ui
          for removed in ['Cím → Google-koordináta', 'ELLENŐRIZVE –', 'KÖZTES PONTOK – mentett koordináták', 'FELRAKÓ – kézzel', 'LERAKÓ – kézzel', 'KÖZTES NÉV/CÍM KERESÉSE']:
              assert removed not in ui, removed
          assert 'waypointEditor = new EditText(this);' in ui
          assert 'root.addView(waypointEditor' not in ui
          
          # Route list display: two lines, role words, 4 decimals only for display
          route=main.split('private void rebuildRoutePointList',1)[1].split('private void moveWaypoint',1)[0]
          for needle in ['roleShortName(point.target)', 'compactPointDetail(point)', 'button.setMaxLines(2)', 'dp(58)', 'return "FEL"', 'return "LE"', 'return "KÖZTES"', 'setScale(4, RoundingMode.HALF_UP)']:
              assert needle in route, needle
          assert 'point.coordinate =' not in route
          
          # DB-first general search and explicit assignment only
          general=main.split('private void openGeneralAddressSearch()',1)[1].split('private void showGeneralDatabaseResults',1)[0]
          assert 'database.searchPoiSmart(query, 20)' in general
          assert general.index('database.searchPoiSmart(query, 20)') < general.index('openMapsForResolution(TARGET_UNASSIGNED, -1, query)')
          assert 'savePlaceToRoute(' not in general
          results=main.split('private void showGeneralDatabaseResults',1)[1].split('private void openDatabasePoiForGeneralMap',1)[0]
          for needle in ['Button pickup = createButton("FELRAKÓ", roleColor)', 'Button delivery = createButton("LERAKÓ", roleColor)', 'Button firstWaypoint = createButton("ELSŐ KÖZTES", roleColor)', 'Button lastWaypoint = createButton("UTOLSÓ KÖZTES", roleColor)', 'createTwoButtonRow(pickup, delivery)', 'createTwoButtonRow(firstWaypoint, lastWaypoint)']:
              assert needle in results, needle
          assert results.count('roleColor') >= 5
          
          # Scanned document becomes queue and is not inserted directly
          scan_service=service.split('private void handleExtractedEndpoints(',1)[1].split('private JSONObject scanQueueItem',1)[0]
          for needle in ['JSONArray queue = new JSONArray()', 'KEY_SCAN_QUEUE_JSON', 'KEY_SCAN_QUEUE_CURSOR', 'openEditor()']:
              assert needle in scan_service, needle
          for forbidden in ['KEY_PICKUP_QUERY', 'KEY_DELIVERY_QUERY', 'KEY_WAYPOINTS', 'savePlaceToRoute(']:
              assert forbidden not in scan_service, forbidden
          scan_main=main.split('private void processPendingScanQueue()',1)[1].split('private void openGeneralAddressSearch()',1)[0]
          for needle in ['database.searchPoiSmart(scanQuery, 20)', 'showGeneralDatabaseResults(', 'resolveScannedAddressWithGoogle(', 'BEOLVASOTT CÍM', 'TALÁLT POI / CÍM', 'showScannedResolvedPlaceDialog', 'completeCurrentScannedAddress()']:
              assert needle in scan_main, needle
          # no automatic role assignment before a button click
          assert 'assignGeneralPlaceToRoute(' in scan_main
          
          # Map-save local first, verified, then role, then cloud later
          persist=main.split('private void persistMapSave',1)[1].split('private LocationDatabase.PoiRecord createPoiRecordForMapSave',1)[0]
          for needle in ['database.updatePoi(existing)', 'database.insertMapPoi(record)', 'persisted = database.getPoi(id)', 'A helyi adatbázis visszaellenőrzése sikertelen.', 'showMandatoryPointRoleDialog(', 'startAutomaticDatabaseSync(false)']:
              assert needle in persist, needle
          assert persist.index('persisted = database.getPoi(id)') < persist.index('showMandatoryPointRoleDialog(') < persist.index('startAutomaticDatabaseSync(false)')
          assert 'mapsLinkResolutionInProgress = false;' in persist
          
          # Map interaction state blocks scan queue race
          handle=main.split('private void handleIncomingIntent',1)[1].split('private void reportMapSaveFailure',1)[0]
          assert handle.count('mapsLinkResolutionInProgress = true;') >= 2
          confirm=main.split('private void showMapSaveConfirmation',1)[1].split('private LocationDatabase.PoiRecord findExistingPoiForMapSave',1)[0]
          assert 'mapsLinkResolutionInProgress = true;' in confirm
          assert confirm.count('mapsLinkResolutionInProgress = false;') >= 2
          assert 'handler.postDelayed(this::processPendingScanQueue, 250L)' in confirm
          
          # Map never opens directions; preview is explicit and reversible
          assert 'maps/dir' not in main and '/dir?' not in main
          preview=main.split('private void openSinglePlaceInMaps',1)[1].split('private void finishPoiDecision',1)[0]
          assert 'beginPoiMapPreview(this)' in preview
          assert 'poiMapPreviewLaunched = true' in preview
          resume=main.split('protected void onResume()',1)[1].split('protected void onPause()',1)[0]
          assert 'endPoiMapPreview(this)' in resume
          
          # Mandatory four-role decision after map save
          mandatory=main.split('private void showMandatoryPointRoleDialog',1)[1].split('private void openManualEndpointSearch',1)[0]
          for needle in ['Mi legyen ebből a pontból?', 'dialog.setCancelable(false)', 'createTwoButtonRow(pickup, delivery)', 'createTwoButtonRow(firstWaypoint, lastWaypoint)']:
              assert needle in mandatory
          
          # Original four-button Maps overlay remains
          for needle in ['reviewPreviousButton = createReviewButton("◀ ELŐZŐ")', 'reviewSaveButton = createReviewButton("📍 MENTÉS")', 'reviewNextButton = createReviewButton("KÖVETKEZŐ ▶")', 'reviewDoneButton = createReviewButton("KÉSZ")']:
              assert needle in service, needle
          assert 'mode = "map_save";' not in service
          
          for xml in root.glob('app/src/main/**/*.xml'):
              ET.parse(xml)
          print('DRIVER_ASSIST_V029_SOURCE_AUDIT_OK')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Aláírókulcs ellenőrzése"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Aláírókulcs előkészítve"
          echo "Google Drive OAuth-hoz szükséges aláíró SHA-1:"
          keytool -list -v \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA1:"

      - name: Test and build signed Driver Assist V029 APK and AAB
        run: |
          set -euo pipefail
          echo "Gradle unit teszt és release fordítás indul"
          gradle --no-daemon --console=plain \
            testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Gradle unit teszt és release fordítás befejezve"

      - name: Collect Driver Assist V029 release files
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Driver_Assist_V029.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/Driver_Assist_V029.aab
          sha256sum artifact/Driver_Assist_V029.apk artifact/Driver_Assist_V029.aab \
            | tee artifact/Driver_Assist_V029_SHA256.txt
          ls -lah artifact

      - name: Upload Driver Assist V029
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Assist_V029
          path: |
            artifact/Driver_Assist_V029.apk
            artifact/Driver_Assist_V029.aab
            artifact/Driver_Assist_V029_SHA256.txt
          if-no-files-found: error
          retention-days: 14
